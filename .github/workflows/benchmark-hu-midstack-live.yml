name: HU midstack CFR live A/B sweep

on:
  pull_request:
    branches:
      - feature/hu-midstack-cfr
    paths:
      - benchmark-hu-midstack-live.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - .github/workflows/benchmark-hu-midstack-live.yml

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        stack: [12, 15, 18, 20]
        mix: [0.5, 1.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run duplicate HU midstack A/B
        env:
          BENCH_STACK_BB: ${{ matrix.stack }}
          BENCH_MIX: ${{ matrix.mix }}
          BENCH_PAIRS: "200"
          BENCH_SEED: "731731"
        run: node benchmark-hu-midstack-live.js
