name: Poker AI A/B Benchmark

on:
  pull_request:
    branches:
      - feature/range-aware-monte-carlo-equity
    paths:
      - benchmark-headsup.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - .github/workflows/benchmark-ai.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        seed: [12121, 13131, 14141, 15151, 16161, 17171, 18181, 19191, 20202, 21212]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run head-to-head benchmark
        env:
          BENCH_ALPHA: "0.25"
          BENCH_SEED: ${{ matrix.seed }}
          BENCH_HANDS: "500"
          BENCH_TRIALS: "60"
        run: node benchmark-headsup.js
