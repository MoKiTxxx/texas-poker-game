        }).filter(x => x.index >= 0)
        : activeOpponents.map(x => ({ rangeDebug: null, index: x.i }));

    return ordered.slice(0, 4).map(item => {
        const oppIndex = item.index;
        const p = players[oppIndex];
        const rangeWeights = estimateOpponentRange(oppIndex);
        const preflopRangeSource = getPreflopActionSummary(oppIndex);
        const preflopRangeSourceLabel = getPreflopRangeSourceLabel(preflopRangeSource);
        const preflopRangeSourceRead = getReadableActionSummary(preflopRangeSource);
        const currentStreetAction = getCurrentStreetOpponentActionCode(oppIndex);
        const currentStreetActionLabel = getCurrentStreetOpponentActionLabel(currentStreetAction);
        const currentStreetActionRead = getCurrentStreetOpponentActionRead(oppIndex);
        const rangeStage = board.length >= 3 ? "postflop" : "preflop";
        const rangeDistribution = rangeStage === "postflop"
            ? summarizePostflopRangeDistribution(rangeWeights, board)
            : summarizePreflopRangeShape(rangeWeights);
        const rangeBucket = getRangeBucketFromDistribution(rangeDistribution, rangeStage);
        const likelyHoldings = getLikelyHoldingGroupsFromRange(rangeWeights, board, 7);
        const rangeConfidence = getV35StreetConfidenceForRange(oppIndex);
        const modelRead = buildOpponentModelRead(oppIndex);
        const actionRead = buildV35ActionRead(oppIndex, preflopRangeSource, currentStreetActionRead, rangeBucket, rangeDistribution, rangeStage);
        const topWeighted = getTopRangeNotations(rangeWeights, 10);

        return {
            version: "v35B-range-model",
            playerName: p ? p.name : "未知對手",
            playerIndex: oppIndex,
            rangeStage,
            preflopRangeSource,
            preflopRangeSourceLabel,
            preflopRangeSourceRead,
            currentStreetAction,
            currentStreetActionLabel,
            currentStreetActionRead,
            actionSummary: preflopRangeSource,
            legacyActionSummaryNote: "Deprecated in v35B: actionSummary is the preflop range source. Use preflopRangeSource and currentStreetAction separately.",
            rangeBucket,
            rangeDistribution,
            likelyHoldings,
            topWeighted,
            actionRead,
            rangeConfidence,
            confidenceBreakdown: modelRead ? modelRead.streetConfidence : getOpponentStreetConfidence(oppIndex),
            modelTags: modelRead ? modelRead.activeTags : [],
            exploitPlanContext: modelRead ? modelRead.exploitPlan : "標準策略",
            note: "v35B only logs range inference; it separates preflop range source from current-street action and does not directly change decisions"
        };
    });
}

function getLikelyHoldingTextFromRange(oppRange) {
    if (!oppRange || !Array.isArray(oppRange.top) || oppRange.top.length === 0) return ["未知 range"];
    return oppRange.top.slice(0, 6).map(x => String(x).split(":")[0]);
}

function inferOpponentStrengthRead(oppRange, texture, toCall) {
    const actionSummary = oppRange ? oppRange.actionSummary : "none";
    const currentStreetRead = oppRange && Number.isInteger(oppRange.index) ? getCurrentStreetOpponentActionRead(oppRange.index) : "本街資訊不足";

    if (currentStreetRead.includes("加注")) return "強牌或強 draw 比例明顯上升";
    if (currentStreetRead.includes("主動下注")) return texture.wetness === "wet" ? "可能是保護下注、強 draw 或 value" : "可能是 c-bet、薄價值或 bluff";
    if (currentStreetRead.includes("跟注")) return "多為中等牌力、抽牌或 bluff-catcher";
    if (currentStreetRead.includes("過牌")) return texture.aceHighDry ? "在乾燥高牌面過牌，強牌比例下降" : "過牌削弱主動強牌比例，但仍可能慢打";
    if (actionSummary === "raised") return "翻前強 range，仍保有高牌和 overpair 優勢";
    if (actionSummary === "called") return "中等成牌、口袋對、同花連張與部分 Broadway 較多";
    if (actionSummary === "checkedBlind" || actionSummary === "onlyBlind") return "range 很寬，空氣牌和弱對比例較高";
    return "牌力未明，需要依後續行動判斷";
}

function inferPsychologicalState(playerIndex) {
    const p = players[playerIndex];
    if (!p) return "未知";
    const stackBB = p.chips / Math.max(1, bigBlind);
    const style = classifyPlayerStyleFromStats(playerIndex);
    if (stackBB <= 6) return "極短碼壓力，容易被迫 push/fold";
    if (stackBB <= 15) return "短碼壓力，可能擴大 all-in 或 resteal";
    if (p.chips >= Math.max(...players.map(x => x ? x.chips : 0)) && activePlayerCount() <= 4) return "大籌碼壓迫位，可能用籌碼施壓";
    if (style.allInRate >= 0.07) return "近期 All-in 偏多，波動和壓迫性較高";
    if (style.foldRate >= 0.58) return "棄牌率偏高，容易被持續下注施壓";
    if (style.vpip >= 0.42 && style.postflopAggression < 0.24) return "入池寬但翻後偏被動，像 calling station";
    return "狀態正常，沒有明顯 tilt 或短碼壓力";
}

function buildV32OpponentRead(index, texture, hero, plan, equity, toCall, opponentRanges) {
    const ranges = Array.isArray(opponentRanges) ? opponentRanges : [];
    const activeOpponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt);

    const source = ranges.length > 0 ? ranges.map(r => ({
        ...r,
        index: players.findIndex(p => p && p.name === r.name)
    })) : activeOpponents.map(x => ({
        name: x.p.name,
        index: x.i,
        actionSummary: getPreflopActionSummary(x.i),
        top: []
    }));

    return source.slice(0, 4).map(r => {
        const oppIndex = Number.isInteger(r.index) ? r.index : players.findIndex(p => p && p.name === r.name);
        const style = classifyPlayerStyleFromStats(oppIndex);
        const modelRead = buildOpponentModelRead(oppIndex);
        const likely = getLikelyHoldingTextFromRange(r);
        const modelLabel = modelRead ? modelRead.dynamicLabel : style.label;
        const tagsText = modelRead && modelRead.activeTags.length ? "｜tags " + modelRead.activeTags.slice(0, 4).join(",") : "";
        const styleRead = modelLabel + "｜先驗 " + (modelRead ? modelRead.profilePrior : "-") + "｜VPIP " + Math.round(style.vpip * 100) + "%｜PFR " + Math.round(style.pfr * 100) + "%" + tagsText;
        const rangeRead = getReadableActionSummary(r.actionSummary) + "；可能牌型集中在：" + likely.join("、");
        const strengthRead = inferOpponentStrengthRead({ ...r, index: oppIndex }, texture, toCall);
        const psychologicalState = inferPsychologicalState(oppIndex);
        let exploitPlan = modelRead ? modelRead.exploitPlan : "標準觀察，避免過度解讀單一行動";
        if (!modelRead) {
            if (style.label.includes("跟注站")) exploitPlan = "少 bluff，多做 value / thin value";
            else if (style.foldRate >= 0.58) exploitPlan = "可增加 c-bet / delayed c-bet 壓力";
            else if (style.postflopAggression >= 0.38) exploitPlan = "面對小中注保留更多 bluff-catcher";
            else if (style.allInRate >= 0.07) exploitPlan = "降低邊緣 bluff，等待可攤牌牌力抓過度進攻";
        }

        return {
            playerName: r.name,
            styleRead,
            rangeRead,
            strengthRead,
            likelyHoldings: likely,
            psychologicalState,
            exploitPlan,
            v34Model: modelRead,
            confidence: Number(Math.max(style.confidence, modelRead ? modelRead.confidence : 0).toFixed(2))
        };
    });
}

function buildV32PostflopPlanRead(index, plan, equity, toCall, texture, hero) {
    const pfa = getLastPreflopAggressorIndex() === index;
    const isFlop = board.length === 3;
    const isTurn = board.length === 4;
    const isRiver = board.length >= 5;
    const flopCheckedThrough = isTurn && didStreetCheckThrough("flop");
    const madeCategory = hero.made ? hero.made.category : 0;
    const drawing = !isRiver && (hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot || hero.hasComboDraw || hero.hasOvercards);
    const reasons = [];

    if (pfa) reasons.push("翻前主動者");
    if (isFlop && pfa && toCall === 0 && (texture.aceHighDry || texture.wetness === "dry" || texture.paired)) reasons.push("c-bet 候選：乾燥或高牌面");
    if (flopCheckedThrough && toCall === 0) reasons.push("delayed c-bet 候選：flop check-through");
    if (hero.hasTopPair || hero.hasOverPair || madeCategory >= 2) reasons.push("有 value / protection 來源");
    if (drawing) reasons.push("有 draw，可半詐唬或跟注實現 equity");
    if (toCall > 0 && (madeCategory >= 1 || drawing)) reasons.push("bluff-catcher / draw call 候選");
    if (plan.v32PostflopUpgrade && plan.v32PostflopUpgrade !== "none") reasons.push("v32B 覆蓋原計畫：" + plan.v32PostflopUpgrade);
    if (reasons.length === 0) reasons.push("無明顯主動下注理由，維持原策略");

    return {
        version: "v32B-postflop",
        planType: plan.type,
        amount: plan.amount ?? null,
        purpose: plan.v32Purpose || plan.purpose || (lastSizingDebug ? lastSizingDebug.purpose : "-"),
        cBetCandidate: !!(isFlop && pfa && toCall === 0),
        delayedCBetCandidate: !!(flopCheckedThrough && toCall === 0),
        thinValueCandidate: !!(toCall === 0 && (hero.hasTopPair || hero.hasOverPair || (madeCategory >= 1 && equity >= 0.48))),
        bluffCatcherCandidate: !!(toCall > 0 && (madeCategory >= 1 || drawing || equity >= 0.28)),
        boardRead: texture.wetness + (texture.aceHighDry ? "／A-high dry" : "") + (texture.paired ? "／paired" : ""),
        reasons
    };
}

function buildV32DecisionNarrative(index, planRead, opponentRead, equity, toCall) {
    const p = players[index];
    const opp = opponentRead && opponentRead.length > 0 ? opponentRead[0] : null;
    const actionText = planRead.planType === "bet" ? "下注" : planRead.planType === "raise" ? "加注" : planRead.planType === "call" ? "跟注" : planRead.planType === "fold" ? "棄牌" : "過牌";
    const oppText = opp ? "主要對手「" + opp.playerName + "」被判讀為「" + opp.styleRead + "」，" + opp.strengthRead + "。" : "目前沒有足夠對手資料。";
    return p.name + " 決定" + actionText + "。Equity 約 " + Math.round(equity * 100) + "%；需跟注 " + money(toCall) + "。" + oppText + "理由：" + planRead.reasons.join("；") + "。";
}

function getV32ActiveOpponentProfileFlags(index) {
    const opponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt && !x.p.allIn && x.p.chips > 0);

    if (opponents.length === 0) {
        return {
            count: 0,
            callingStation: false,
            overfolder: false,
            aggressive: false,
            veryLoose: false,
            maxFoldRate: 0,
            maxFoldToCBet: 0,
            maxFoldToTurnBet: 0,
            maxCallCBet: 0,
            maxVpip: 0,
            maxAggression: 0,
            labelSummary: "無主要對手"
        };
    }

    const styles = opponents.map(x => {
        const style = classifyPlayerStyleFromStats(x.i);
        const rates = getOpponentModelRates(x.i);
        const tags = buildOpponentModelTags(x.i);
        const profile = x.p.profile ? x.p.profile.name : "";
        return { index: x.i, name: x.p.name, style, profile, rates, tags };
    });

    const hardCallingStation = styles.some(x =>
        x.tags.callsTooMuch ||
        x.tags.riverStation ||
        (x.rates.callCBet.confidence >= 0.35 && x.rates.callCBet.effective >= 0.52) ||
        (x.rates.callRiverBet && x.rates.callRiverBet.confidence >= 0.35 && x.rates.callRiverBet.effective >= 0.55)
    );

    const softCallingStation = styles.some(x =>
        x.tags.softCallingStation ||
        (x.profile === "跟注站" && (
            x.rates.callCBet.effective >= 0.43 ||
            x.rates.foldToTurnBet.effective <= 0.38 ||
            x.tags.passivePostflop ||
            x.style.postflopAggression < 0.27
        )) ||
        (x.rates.callCBet.sample >= 3 && x.rates.callCBet.effective >= 0.47) ||
        (x.style.vpip >= 0.30 && x.style.postflopAggression < 0.24 && x.style.confidence >= 0.45)
    );

    const stickyStrongStation = styles.some(x => x.tags.stickyStrongStation);
    const strongShowdownRegular = styles.some(x => x.tags.strongShowdownRegular);
    const callingStation = hardCallingStation || softCallingStation || stickyStrongStation;

    const overfolder = styles.some(x =>
        x.tags.overfoldsFlop ||
        x.tags.foldsTurnTooMuch ||
        (x.rates.foldToCBet.confidence >= 0.25 && x.rates.foldToCBet.effective >= 0.58) ||
        (x.rates.foldToTurnBet.confidence >= 0.30 && x.rates.foldToTurnBet.effective >= 0.58) ||
        (x.profile === "極緊型" && x.style.foldRate >= 0.62 && x.style.confidence >= 0.70)
    );

    const aggressive = styles.some(x =>
        x.tags.aggressivePostflop ||
        x.tags.bluffHeavy ||
        x.style.postflopAggression >= 0.36 ||
        x.style.label.includes("鬆凶")
    );

    const veryLoose = styles.some(x => x.style.vpip >= 0.40 || x.style.label.includes("鬆"));
    const maxFoldRate = Math.max(...styles.map(x => x.style.foldRate || 0));
    const maxFoldToCBet = Math.max(...styles.map(x => x.rates.foldToCBet ? x.rates.foldToCBet.effective : 0));
    const maxFoldToTurnBet = Math.max(...styles.map(x => x.rates.foldToTurnBet ? x.rates.foldToTurnBet.effective : 0));
    const maxCallCBet = Math.max(...styles.map(x => x.rates.callCBet ? x.rates.callCBet.effective : 0));
    const maxVpip = Math.max(...styles.map(x => x.style.vpip || 0));
    const maxAggression = Math.max(...styles.map(x => x.style.postflopAggression || 0));
    const labelSummary = styles.slice(0, 3).map(x => {
        const tags = Object.entries(x.tags).filter(([k, v]) => !!v).map(([k]) => k).slice(0, 2).join(",");
        return x.name + ":" + x.style.label + (tags ? "(" + tags + ")" : "");
    }).join("｜");

    return {
        count: opponents.length,
        callingStation,
        hardCallingStation,
        softCallingStation,
        stickyStrongStation,
        strongShowdownRegular,
        overfolder,
        aggressive,
        veryLoose,
        maxFoldRate,
        maxFoldToCBet,
        maxFoldToTurnBet,
        maxCallCBet,
        maxVpip,
        maxAggression,
        labelSummary
    };
}


function clampNumber(value, min, max) {
    const n = Number(value);
    if (!Number.isFinite(n)) return min;
    return Math.max(min, Math.min(max, n));
}

function buildV36ARangeImpact(index, opponentRanges, texture, hero, equity, toCall, basePlan) {
    const reads = buildV35RangeReads(index, opponentRanges || [], texture, hero, basePlan || {}, equity, toCall)
        .filter(r => r && r.rangeStage === "postflop");

    const aggressiveReads = reads.filter(r => r.currentStreetAction === "bet" || r.currentStreetAction === "raise");
    const targetReads = toCall > 0 && aggressiveReads.length ? aggressiveReads : reads;
    const totalWeight = targetReads.reduce((sum, r) => sum + Math.max(0.15, Number(r.rangeConfidence || 0.15)), 0);

    const avg = { strongMade: 0, mediumMade: 0, draw: 0, air: 0 };
    let maxStrongMade = 0;
    let maxAir = 0;
    let maxDraw = 0;
    const bucketCounts = {};
    const tagSet = new Set();
    const reasons = [];

    for (const r of targetReads) {
        const w = totalWeight > 0 ? Math.max(0.15, Number(r.rangeConfidence || 0.15)) / totalWeight : 0;
        const d = r.rangeDistribution || {};
        avg.strongMade += (Number(d.strongMade || 0) * w);
        avg.mediumMade += (Number(d.mediumMade || 0) * w);
        avg.draw += (Number(d.draw || 0) * w);
        avg.air += (Number(d.air || 0) * w);
        maxStrongMade = Math.max(maxStrongMade, Number(d.strongMade || 0));
        maxAir = Math.max(maxAir, Number(d.air || 0));
        maxDraw = Math.max(maxDraw, Number(d.draw || 0));
        const bucket = r.rangeBucket || "unknown";
        bucketCounts[bucket] = (bucketCounts[bucket] || 0) + 1;
        (r.modelTags || []).forEach(t => tagSet.add(t));
    }

    const hasOverfolderTag = tagSet.has("overfoldsFlop") || tagSet.has("foldsTurnTooMuch");
    const hasStickyStrongStationTag = tagSet.has("stickyStrongStation");
    const hasStrongShowdownRegularTag = tagSet.has("strongShowdownRegular");
    const hasStationTag = tagSet.has("callsTooMuch") || tagSet.has("softCallingStation") || tagSet.has("riverStation") || tagSet.has("passivePostflop") || hasStickyStrongStationTag;
    const hasAggressiveTag = tagSet.has("aggressivePostflop") || tagSet.has("bluffHeavy");
    const dryPressure = texture && (texture.aceHighDry || texture.wetness === "dry" || texture.paired) ? 0.06 : 0;

    const foldPressure = clampNumber((avg.air * 0.34) + (maxAir * 0.12) + (hasOverfolderTag ? 0.16 : 0) + dryPressure - (hasStationTag ? 0.06 : 0), 0, 0.36);
    const strongRisk = clampNumber((maxStrongMade * 0.34) + (avg.strongMade >= 0.30 ? 0.10 : 0) + ((texture && texture.wetness === "wet") ? 0.04 : 0) + (hasStrongShowdownRegularTag ? 0.06 : 0), 0, 0.38);
    const valuePressure = clampNumber((avg.mediumMade * 0.18) + (avg.draw * 0.10) + (hasStationTag ? 0.16 : 0) - (hasStickyStrongStationTag ? 0.14 : 0) - (hasStrongShowdownRegularTag ? 0.08 : 0) - (strongRisk * 0.35), -0.14, 0.34);
    const bluffCatcherSupport = clampNumber((toCall > 0 ? (avg.air * 0.22 + avg.draw * 0.14) : 0) + (hasAggressiveTag ? 0.12 : 0) - (maxStrongMade * 0.18) - (hasStrongShowdownRegularTag ? 0.10 : 0), -0.16, 0.30);

    if (foldPressure >= 0.16) reasons.push("range 空氣 / 棄牌壓力偏高，可提高 c-bet 或 delayed c-bet");
    if (valuePressure >= 0.14) reasons.push("對手 range 中等成牌或跟注傾向偏多，可增加 thin value");
    if (strongRisk >= 0.18) reasons.push("對手強成牌密度偏高，降低純 bluff 與薄價值頻率");
    if (hasStrongShowdownRegularTag) reasons.push("對手攤牌勝率偏高，river bluff-catcher 與 thin value 收緊");
    if (bluffCatcherSupport >= 0.10) reasons.push("下注 range 含抽牌 / 空氣，可放寬 bluff-catcher");
    if (!reasons.length) reasons.push("range read 無明顯偏移，維持 v32B 基準頻率");

    const averageRangeConfidence = targetReads.length
        ? Number((targetReads.reduce((sum, r) => sum + Number(r.rangeConfidence || 0), 0) / targetReads.length).toFixed(2))
        : 0;

    return {
        version: "v37-range-impact",
        mode: "postflop-only",
        readCount: reads.length,
        targetReadCount: targetReads.length,
        averageRangeConfidence,
        averageStrongMade: Number(avg.strongMade.toFixed(3)),
        averageMediumMade: Number(avg.mediumMade.toFixed(3)),
        averageDraw: Number(avg.draw.toFixed(3)),
        averageAir: Number(avg.air.toFixed(3)),
        maxStrongMade: Number(maxStrongMade.toFixed(3)),
        maxAir: Number(maxAir.toFixed(3)),
        maxDraw: Number(maxDraw.toFixed(3)),
        bucketCounts,
        modelTags: Array.from(tagSet),
        rangeWeak: foldPressure >= 0.18 || avg.air >= 0.38,
        rangeStrong: strongRisk >= 0.20 || maxStrongMade >= 0.34,
        rangeValueTarget: valuePressure >= 0.14,
        rangeBluffCatcherSupport: bluffCatcherSupport >= 0.10,
        foldPressure: Number(foldPressure.toFixed(3)),
        strongRisk: Number(strongRisk.toFixed(3)),
        valuePressure: Number(valuePressure.toFixed(3)),
        bluffCatcherSupport: Number(bluffCatcherSupport.toFixed(3)),
        cBetFreqDelta: Number(clampNumber(foldPressure - strongRisk * 0.55, -0.22, 0.28).toFixed(3)),
        delayedCBetFreqDelta: Number(clampNumber(foldPressure * 0.90 - strongRisk * 0.50, -0.20, 0.26).toFixed(3)),
        thinValueFreqDelta: Number(clampNumber(valuePressure - strongRisk * 0.35, -0.18, 0.28).toFixed(3)),
        semiBluffFreqDelta: Number(clampNumber(foldPressure * 0.65 - strongRisk * 0.45, -0.18, 0.22).toFixed(3)),
        bluffCatcherThresholdMultiplier: Number(clampNumber(1 - bluffCatcherSupport + strongRisk * 0.32, 0.78, 1.16).toFixed(3)),
        reasons,
        note: "v37 uses range impact only for postflop; low-confidence range still cannot create heavy exploit, but standard c-bet/delayed-c-bet and risk-control overrides may apply"
    };
}


function buildV36DConfidenceGate(rangeImpact) {
    const confidence = Number(rangeImpact && rangeImpact.averageRangeConfidence || 0);
    let confidenceBand = "none";
    let frequencyScale = 0.25;
    let allowedImpact = "tiny";
    let allowOverride = false;
    let allowStrongExploit = false;
    const reasons = [];

    if (confidence < 0.25) {
        confidenceBand = "low";
        frequencyScale = 0;
        allowedImpact = "baseline-only";
        reasons.push("range confidence 低於 0.25，不允許正式 range exploit；只保留 baseline 翻後行為");
    } else if (confidence < 0.45) {
        confidenceBand = "medium-low";
        frequencyScale = 0.55;
        allowedImpact = "small";
        allowOverride = true;
        reasons.push("range confidence 介於 0.25–0.45，只允許小幅 postflop 調整");
    } else if (confidence < 0.65) {
        confidenceBand = "medium";
        frequencyScale = 0.85;
        allowedImpact = "normal";
        allowOverride = true;
        reasons.push("range confidence 介於 0.45–0.65，允許正常但有限的 postflop exploit");
    } else {
        confidenceBand = "high";
        frequencyScale = 1.05;
        allowedImpact = "strong-postflop-only";
        allowOverride = true;
        allowStrongExploit = true;
        reasons.push("range confidence 高於 0.65，允許較明顯但仍限於 postflop 的 exploit");
    }

    return {
        version: "v37-confidence-gate",
        rangeConfidence: Number(confidence.toFixed(2)),
        confidenceBand,
        frequencyScale,
        allowedImpact,
        allowOverride,
        allowStrongExploit,
        reason: reasons.join("；"),
        untouched: ["preflop-short-stack-chart", "all-in-call-range"]
    };
}

function buildV36DDelayedCBetPlan(args) {
    const impact = args.v36ARangeImpact || {};
    const gate = args.v36DConfidenceGate || {};
    const hero = args.hero || {};
    const texture = args.texture || {};
    const madeCategory = hero.made ? hero.made.category : 0;
    const equity = Number(args.equity || 0);
    const hasRealDraw = !!(!args.isRiver && (hero.hasComboDraw || hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot));
    const hasShowdownOrProtection = !!(
        madeCategory >= 1 || hero.hasTopPair || hero.hasOverPair || hero.hasSecondPair ||
        hasRealDraw || hero.hasOvercards || equity >= 0.28
    );
    const hasPositionProxy = !!(args.headsUp || args.pfa);
    const stableTurnCard = !!(texture.wetness === "dry" || texture.aceHighDry || texture.paired || texture.wetness === "medium");
    const notExtremeTurnCard = !!(texture.wetness !== "locked" && !texture.fourFlush && !texture.fourStraight && !(texture.wetness === "wet" && !hasRealDraw && !hero.hasTopPair && !hero.hasOverPair && equity < 0.36));
    const actionableOpponents = Number(args.actionableOpponents || (args.headsUp ? 1 : 2));
    const candidate = !!(args.isTurn && args.flopCheckedThrough && args.toCall === 0);
    const standardHeadsUpDelayedOk = !!(candidate && actionableOpponents === 1 && args.pfa && notExtremeTurnCard && equity >= 0.25);
    const stationValueDelayedOk = !!(standardHeadsUpDelayedOk && args.opponentCallingStation && (madeCategory >= 1 || hero.hasTopPair || hero.hasOverPair || equity >= 0.48));
    const villainWeaknessScore = clampNumber((impact.averageAir || 0) * 0.44 + (impact.averageDraw || 0) * 0.24 + (impact.foldPressure || 0) + (args.opponentOverfolder ? 0.13 : 0), 0, 1);
    const turnPressureScore = clampNumber(villainWeaknessScore + (args.headsUp ? 0.12 : 0) + (args.pfa ? 0.07 : 0) + (stableTurnCard ? 0.08 : 0), 0, 1);
    const protectionNeed = clampNumber((madeCategory >= 1 ? 0.18 : 0) + (hero.hasTopPair || hero.hasOverPair ? 0.12 : 0) + (hasRealDraw ? 0.14 : 0) + (!args.isRiver && hero.hasOvercards ? 0.08 : 0), 0, 0.6);
    const hasTurnPressureSource = !!(hasShowdownOrProtection || hasPositionProxy || args.opponentOverfolder || villainWeaknessScore >= 0.15 || equity >= 0.25);
    const baselineDelayedOk = !!(standardHeadsUpDelayedOk || (hasPositionProxy && stableTurnCard && equity >= 0.24 && (!args.opponentCallingStation || stationValueDelayedOk)));
    const blockedByStrongRisk = (impact.strongRisk || 0) >= (gate.allowStrongExploit ? 0.32 : 0.25) && !standardHeadsUpDelayedOk && !(hero.hasTopPair || hero.hasOverPair || hasRealDraw) && equity < 0.42;
    const blockedByBoard = texture.wetness === "locked" || (!standardHeadsUpDelayedOk && texture.wetness === "wet" && !hasShowdownOrProtection && !args.opponentOverfolder && villainWeaknessScore < 0.22 && equity < 0.36);
    const blockedByMultiway = actionableOpponents >= 2 && !(args.opponentOverfolder || turnPressureScore >= 0.36 || hasRealDraw || madeCategory >= 1);
    const blockedByConfidence = !gate.allowOverride && !(standardHeadsUpDelayedOk || baselineDelayedOk || (hasShowdownOrProtection && equity >= 0.34 && turnPressureScore + protectionNeed >= 0.32));
    const requiredPressure = actionableOpponents >= 2 ? 0.30 : (standardHeadsUpDelayedOk ? 0.10 : (hasPositionProxy ? 0.18 : 0.22));
    const finalAllowed = !!(candidate && !blockedByConfidence && !blockedByStrongRisk && !blockedByBoard && !blockedByMultiway && hasTurnPressureSource && (standardHeadsUpDelayedOk || turnPressureScore + protectionNeed >= requiredPressure));

    const reasons = [];
    if (!candidate) reasons.push("不是 delayed c-bet 場景：需要 flop check-through 且 turn 無下注壓力");
    if (blockedByConfidence) reasons.push("range confidence 偏低，但未達標準 delayed c-bet 條件");
    if (blockedByStrongRisk) reasons.push("對手強成牌風險偏高，阻止 turn 施壓");
    if (blockedByBoard) reasons.push("牌面完成度或濕度過高，降低 delayed c-bet");
    if (blockedByMultiway) reasons.push("多人底池且 fold equity / 保護需求不足，降低 delayed c-bet");
    if (!hasTurnPressureSource) reasons.push("沒有 equity / overcard / pair / draw / position / fold equity 支撐 delayed c-bet");
    if (standardHeadsUpDelayedOk && !gate.allowOverride) reasons.push("低信心下仍符合標準 heads-up delayed c-bet：PFA + turn 非極濕 + 最低 equity");
    else if (baselineDelayedOk && !gate.allowOverride) reasons.push("低信心下仍符合標準 delayed c-bet：heads-up/PFA + 穩定牌面 + 最低 equity");
    if (finalAllowed) reasons.push("flop check-through 後 turn 壓力條件足夠，允許 delayed c-bet");

    return {
        version: "v37-delayed-cbet-plan",
        candidate,
        turnPressureScore: Number(turnPressureScore.toFixed(3)),
        villainWeaknessScore: Number(villainWeaknessScore.toFixed(3)),
        protectionNeed: Number(protectionNeed.toFixed(3)),
        requiredPressure: Number(requiredPressure.toFixed(3)),
        baselineDelayedOk,
        standardHeadsUpDelayedOk,
        stationValueDelayedOk,
        actionableOpponents,
        notExtremeTurnCard,
        hasShowdownOrProtection,
        hasPositionProxy,
        hasTurnPressureSource,
        blockedByConfidence,
        blockedByStrongRisk,
        blockedByBoard,
        blockedByMultiway,
        finalAllowed,
        reason: reasons.join("；") || "standard"
    };
}

function buildV36DBluffCatcherGuard(args) {
    const impact = args.v36ARangeImpact || {};
    const gate = args.v36DConfidenceGate || {};
    const texture = args.texture || {};
    const hero = args.hero || {};
    const madeCategory = hero.made ? hero.made.category : 0;
    const potOddsOk = args.toCall > 0 && args.toCall <= args.pot * (args.isRiver ? 0.46 : 0.56) && Number(args.equity || 0) >= Number(args.potOdds || 0) * (args.isRiver ? 0.98 : 0.88);
    const showdownValueOk = !!(args.safeMade && (madeCategory >= 1 || hero.hasTopPair || hero.hasOverPair || hero.hasSecondPair || (args.isRiver && hero.highCardRank >= 14 && texture.wetness === "dry")));
    const drawValueOk = !args.isRiver && !!(hero.hasComboDraw || hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot) && Number(args.equity || 0) >= Number(args.potOdds || 0) * 0.72;
    const multiwayRisk = !!(args.multiway && args.toCall > args.pot * 0.32);
    const riverHonestRisk = !!(args.isRiver && args.opponentRiverHonest && args.toCall > args.pot * 0.30);
    const boardCompletionRisk = !!((texture.wetness === "locked" || texture.flushPossible || texture.fourStraight) && args.toCall > args.pot * 0.38 && !(hero.hasFlush || hero.hasStraight || hero.hasFullHouse || hero.hasQuads));
    const stationBetRespect = !!(args.opponentCallingStation && args.toCall > args.pot * 0.36 && args.isRiver);
    const strongRiskBlock = !!((impact.strongRisk || 0) >= (gate.allowStrongExploit ? 0.31 : 0.24) && !(hero.hasTopPair || hero.hasOverPair || hero.hasTwoPair || hero.hasTrips || hero.hasStraight || hero.hasFlush || hero.hasFullHouse));
    const confidenceBlocked = !gate.allowOverride && !drawValueOk && !(showdownValueOk && args.toCall <= args.pot * 0.30);
    const rangeSupportOk = !!((impact.bluffCatcherSupport || 0) >= 0.08 || args.opponentAggressive || drawValueOk);
    const finalAllowed = !!(args.candidate && potOddsOk && (showdownValueOk || drawValueOk) && rangeSupportOk && !multiwayRisk && !riverHonestRisk && !boardCompletionRisk && !stationBetRespect && !strongRiskBlock && !confidenceBlocked);

    const reasons = [];
    if (!args.candidate) reasons.push("不是 bluff-catcher 候選");
    if (!potOddsOk) reasons.push("pot odds / 下注尺度不適合 bluff-catch");
    if (!showdownValueOk && !drawValueOk) reasons.push("缺乏可攤牌價值或有效抽牌");
    if (!rangeSupportOk) reasons.push("range read 不支持對手有足夠 bluff / draw");
    if (multiwayRisk) reasons.push("多人底池降低 bluff-catcher");
    if (riverHonestRisk) reasons.push("riverHonest 對手下注需尊重");
    if (boardCompletionRisk) reasons.push("牌面完成同花 / 順子風險高，收緊跟注");
    if (stationBetRespect) reasons.push("calling station 主動下注通常 bluff 少，收緊 river call");
    if (strongRiskBlock) reasons.push("強成牌風險過高，阻止 hero call");
    if (confidenceBlocked) reasons.push("range confidence 太低，不用模型覆蓋 fold");
    if (finalAllowed) reasons.push("pot odds、攤牌價值與 range bluff 支撐均足夠，允許 bluff-catcher");

    return {
        version: "v37-bluff-catcher-guard",
        candidate: !!args.candidate,
        potOddsOk,
        showdownValueOk,
        drawValueOk,
        rangeSupportOk,
        multiwayRisk,
        riverHonestRisk,
        boardCompletionRisk,
        stationBetRespect,
        strongRiskBlock,
        confidenceBlocked,
        finalAllowed,
        reason: reasons.join("；") || "standard"
    };
}

function buildV37PostflopOverride(args) {
    const plan = args.plan || {};
    const hero = args.hero || {};
    const texture = args.texture || {};
    const impact = args.v36ARangeImpact || {};
    const madeCategory = Number(args.madeCategory || 0);
    const equity = Number(args.equity || 0);
    const potOdds = Number(args.potOdds || 0);
    const basePurpose = plan.v32Purpose || plan.purpose || (lastSizingDebug ? lastSizingDebug.purpose : "");
    const toCall = Number(args.toCall || 0);
    const potSize = Math.max(1, Number(args.pot || pot || 1));
    const hasRealDraw = !!(!args.isRiver && (hero.hasComboDraw || hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot));
    const hasShowdownValue = !!(args.safeMade && (madeCategory >= 1 || hero.hasTopPair || hero.hasOverPair || hero.hasSecondPair));
    const hasStrongMade = !!(hero.hasNutLikeMade || hero.hasEffectiveStrongMade || hero.hasTwoPairOrBetter || hero.hasTrips || hero.hasStraight || hero.hasFlush || hero.hasFullHouse || hero.hasQuads);
    const isBettingPlan = toCall === 0 && (plan.type === "bet" || plan.type === "raise");
    const isCallingPlan = toCall > 0 && (plan.type === "call" || plan.type === "raise");
    const fakeSemiBluffPurpose = !!(basePurpose === "semiBluff" && !hasRealDraw && !hasShowdownValue && !hasStrongMade);
    const pureBluffPurpose = basePurpose === "bluff" || basePurpose === "blockerBluff" || fakeSemiBluffPurpose || (!basePurpose && !hasShowdownValue && !hasRealDraw);
    const marginalThinPurpose = basePurpose === "thinValue" || basePurpose === "protection";
    const badTextureForAir = !!(texture.wetness === "dangerous" || texture.wetness === "locked" || texture.fourFlush || texture.fourStraight || (texture.monotone && !hero.hasFlush && !hero.hasNutFlushBlocker));
    const lowEquityNoBackup = equity < 0.32 && !hasRealDraw && !hasShowdownValue;
    const stickyStrongStation = !!args.opponentStickyStrongStation;
    const strongShowdownRegular = !!args.opponentStrongShowdownRegular;
    const stationPureBluff = !!(args.opponentCallingStation && pureBluffPurpose && equity < 0.40 && !hasRealDraw);
    const strongShowdownPureBluff = !!(strongShowdownRegular && pureBluffPurpose && equity < 0.43 && !hasRealDraw);
    const strongRiskPureBluff = !!(pureBluffPurpose && (impact.strongRisk || 0) >= (args.rangeExploitAllowed ? 0.26 : 0.22) && !(impact.rangeWeak || impact.foldPressure >= 0.18));
    const multiwayPureBluff = !!(args.multiway && pureBluffPurpose && equity < 0.42 && !hasRealDraw && !args.opponentOverfolder);
    const stationThinValueProtected = !!(args.opponentCallingStation && !stickyStrongStation && hasShowdownValue && (hero.hasTopPair || hero.hasOverPair || hero.hasSecondPair || equity >= 0.48));
    const stickyThinValueTooThin = !!(stickyStrongStation && marginalThinPurpose && !hasStrongMade && (
        !hasShowdownValue ||
        equity < (args.isRiver ? 0.62 : (args.multiway ? 0.58 : 0.52)) ||
        (args.isRiver && !(hero.hasTopPair || hero.hasOverPair || madeCategory >= 2))
    ));
    const strongShowdownThinValueTooThin = !!(strongShowdownRegular && marginalThinPurpose && !hasStrongMade && (
        !hasShowdownValue ||
        equity < (args.isRiver ? 0.60 : (args.multiway ? 0.56 : 0.50)) ||
        (args.isRiver && !(hero.hasTopPair || hero.hasOverPair || madeCategory >= 2))
    ));
    const thinValueTooThin = !!(marginalThinPurpose && !hasStrongMade && ((!hasShowdownValue || equity < (args.multiway ? 0.56 : 0.47)) && !stationThinValueProtected || stickyThinValueTooThin || strongShowdownThinValueTooThin));
    const completedBoardNoNut = !!((texture.wetness === "locked" || texture.fourFlush || texture.fourStraight) && !hasStrongMade && equity < 0.58);
    const noActionableOpponent = Number(args.actionableOpponents || 0) === 0;
    const largeBet = toCall > potSize * 0.55;
    const stationRiverBetRespect = !!(args.isRiver && args.opponentCallingStation && toCall > potSize * 0.34 && !hasStrongMade && equity < potOdds * 1.15);
    const strongShowdownRiverCallRisk = !!(isCallingPlan && args.isRiver && strongShowdownRegular && toCall > potSize * 0.28 && !hasStrongMade && equity < potOdds * 1.25);
    const strongRangeCallRisk = !!(isCallingPlan && largeBet && (impact.strongRisk || 0) >= (args.rangeExploitAllowed ? 0.30 : 0.24) && !hasStrongMade && equity < potOdds * 1.05);
    const completedBoardCallRisk = !!(isCallingPlan && completedBoardNoNut && toCall > potSize * 0.36 && equity < potOdds * 1.10);

    const reasons = [];
    let finalAction = null;

    if (isBettingPlan && noActionableOpponent) {
        finalAction = { type: "check", amount: null, upgrade: "v37-no-actionable-opponent-check", purpose: "potControl" };
        reasons.push("沒有仍可行動的對手，禁止無效下注");
    } else if (isBettingPlan && pureBluffPurpose && (lowEquityNoBackup || badTextureForAir || stationPureBluff || strongShowdownPureBluff || strongRiskPureBluff || multiwayPureBluff)) {
        finalAction = { type: "check", amount: null, upgrade: "v37-bad-bluff-check", purpose: "potControl" };
        if (lowEquityNoBackup) reasons.push("低 equity 且沒有抽牌 / 攤牌價值，阻止舊邏輯純 bluff");
        if (fakeSemiBluffPurpose) reasons.push("沒有真 draw / pair / 攤牌價值的 semi-bluff 視為 air bluff，交由 safety 攔截");
        if (badTextureForAir) reasons.push("危險或完成牌面，不用空氣牌硬 bluff");
        if (stationPureBluff) reasons.push("對 calling station 減少純 bluff");
        if (strongShowdownPureBluff) reasons.push("對攤牌勝率高的常規型對手減少低 equity 純 bluff");
        if (strongRiskPureBluff) reasons.push("range 強牌風險高於 fold pressure，阻止 bluff");
        if (multiwayPureBluff) reasons.push("多人底池且缺乏 fold equity，阻止純 bluff");
    } else if (isBettingPlan && thinValueTooThin) {
        finalAction = { type: "check", amount: null, upgrade: "v37-too-thin-value-check", purpose: "potControl" };
        reasons.push(stickyThinValueTooThin ? "對 sticky strong station 的薄價值過薄，改為 pot control" : (strongShowdownThinValueTooThin ? "對攤牌勝率高的常規型對手，薄價值過薄，改為 pot control" : "薄價值 / protection 過薄，改為 pot control"));
    } else if (isBettingPlan && completedBoardNoNut && !hasRealDraw) {
        finalAction = { type: "check", amount: null, upgrade: "v37-completed-board-check", purpose: "potControl" };
        reasons.push("完成牌面但沒有堅果級牌力，避免被反加或薄價值過度下注");
    } else if (isCallingPlan && (stationRiverBetRespect || strongShowdownRiverCallRisk || strongRangeCallRisk || completedBoardCallRisk)) {
        finalAction = { type: "fold", amount: null, upgrade: "v37-bad-call-fold", purpose: "disciplineFold" };
        if (stationRiverBetRespect) reasons.push("calling station 河牌主動下注通常 bluff 少，收緊 bluff-catcher");
        if (strongShowdownRiverCallRisk) reasons.push("對攤牌勝率高的常規型對手，river bluff-catcher 收緊");
        if (strongRangeCallRisk) reasons.push("下注 range 強牌風險偏高，阻止邊緣 call / raise");
        if (completedBoardCallRisk) reasons.push("完成牌面且非堅果，面對中大注改為 fold");
    }

    return {
        version: "v37-postflop-override",
        basePlanType: plan.type || "none",
        basePurpose: basePurpose || "unknown",
        actionableOpponents: Number(args.actionableOpponents || 0),

function chooseMixedTier(weightedTiers) {
    const total = weightedTiers.reduce((sum, item) => sum + item.weight, 0);
    if (total <= 0) return weightedTiers[0]?.tier || "medium";

    let r = Math.random() * total;

    for (const item of weightedTiers) {
        r -= item.weight;
        if (r <= 0) return item.tier;
    }

    return weightedTiers[weightedTiers.length - 1].tier;
}

function adjustTier(tier, steps) {
    const order = ["micro", "small", "medium", "large", "polar", "overbet", "jam"];
    const idx = order.indexOf(tier);
    if (idx === -1) return tier;
    const next = Math.max(0, Math.min(order.length - 1, idx + steps));
    return order[next];
}

            tier = chooseMixedTier([{ tier: "large", weight: 45 }, { tier: "polar", weight: 45 }, { tier: "overbet", weight: 10 }]);
        } else {
            tier = chooseMixedTier([{ tier: "medium", weight: 50 }, { tier: "large", weight: 40 }, { tier: "small", weight: 10 }]);
        }
    }

    if (lowSPR && purpose === "value" && !hero.isBoardOnlyMonster && !hero.isBoardTripsOnly && !hero.isWeakOneCardFlush && (equity >= 0.80 || hero.hasNutLikeMade || hero.hasEffectiveStrongMade || (hero.hasTwoPairOrBetter && !hero.isBoardPairedWeakTwoPair))) {
        tier = "jam";
    } else if (lowSPR && hero.hasComboDraw && equity >= 0.68) {
        tier = "jam";
    } else if (lowSPR && purpose === "protection") {
        tier = adjustTier(tier, 1);
    } else if (midLowSPR && (purpose === "value" || hero.hasComboDraw) && equity >= 0.70) {
        tier = adjustTier(tier, 1);
    }

    if (deepSPR && (hero.hasTopPair || hero.isWeakOneCardFlush || (hero.isOneCardStraight && !hero.isNutOneCardStraight)) && !hero.hasNutLikeMade && (texture.wetness === "dangerous" || texture.wetness === "locked")) {
        tier = adjustTier(tier, -1);
    }

    if ((purpose === "protection" || purpose === "thinValue") && !hero.hasEffectiveStrongMade && !hero.hasNutLikeMade && equity < 0.58) {
        tier = adjustTier(tier, -1);
        if (tier === "polar" || tier === "overbet" || tier === "jam") tier = "medium";
    }

    if (multiway) {
        if (purpose === "bluff" || purpose === "blockerBluff") tier = adjustTier(tier, -1);
        if (purpose === "protection" && !hero.hasEffectiveStrongMade && !hero.hasNutLikeMade && equity < 0.66) tier = adjustTier(tier, -2);
        else if ((purpose === "value" || purpose === "protection") && (texture.wetness === "wet" || texture.wetness === "dangerous") && equity >= 0.70) tier = adjustTier(tier, 1);
        if (purpose === "thinValue") tier = adjustTier(tier, -1);
        if (purpose === "semiBluff" && equity < 0.50) tier = adjustTier(tier, -1);
    }

    if (hero.isBoardPairedWeakTwoPair || hero.isBoardOnlyMonster || hero.isBoardTripsOnly || hero.isWeakOneCardFlush || (hero.isOneCardStraight && !hero.isTwoCardStraight && !hero.isNutOneCardStraight)) {
        if (purpose === "value" || purpose === "protection") tier = adjustTier(tier, -2);
        if (purpose === "thinValue") tier = adjustTier(tier, -1);
        if (tier === "polar" || tier === "overbet" || tier === "jam") tier = "medium";
    }

    return tier;
}

function tierToPotRatio(tier) {
    const ratios = {
        micro: 0.25,
        small: 0.33,
        medium: 0.50,
        large: 0.75,
        polar: 1.00,
        overbet: 1.25
    };

    return ratios[tier] || 0.50;
}

function roundToBlindUnit(amount) {
    const unit = Math.max(1, Math.floor(smallBlind));
    return Math.max(unit, Math.round(amount / unit) * unit);
}

function sizingToBetAmount(tier, index) {
    const p = players[index];

    if (tier === "jam") return p.chips;

    let amount = roundToBlindUnit(pot * tierToPotRatio(tier));
    amount = Math.max(minRaise, amount);

    if (amount >= p.chips * 0.92) return p.chips;

    return Math.min(amount, p.chips);
}

function sizingToRaiseTo(tier, index, toCall) {
    const p = players[index];
    const maxRaiseTo = p.currentBet + p.chips;

    if (tier === "jam") return maxRaiseTo;

    let raiseExtra = roundToBlindUnit((pot + toCall) * tierToPotRatio(tier));
    raiseExtra = Math.max(minRaise, raiseExtra);

    let raiseTo = currentBet + raiseExtra;
    const legalMinRaiseTo = getLegalMinRaiseTo();

    if (raiseTo >= maxRaiseTo * 0.92) return maxRaiseTo;

    if (raiseTo < legalMinRaiseTo && raiseTo < maxRaiseTo) {
        return null;
    }

    return Math.min(raiseTo, maxRaiseTo);
}

    const context = {

}

    };

}

function executeGTOAction(index, equity, toCall) {
    lastSizingDebug = null;
    const textureDebug = analyzeBoardTexture(board);
    const heroDebug = analyzeHeroBoardInteraction(players[index].hole, board);
    let plan = choosePostflopPlan(index, equity, toCall);
    plan = applyV32PostflopUpgrade(index, plan, equity, toCall, textureDebug, heroDebug);

    updateAiDebugInfo(index, equity, toCall, plan, textureDebug, heroDebug);

    if (plan.type === "check" || plan.type === "call") {
        callPlayer(index);
        return;
    }

    if (plan.type === "bet") {
        if (plan.amount === null || plan.amount === undefined || !Number.isFinite(plan.amount) || plan.amount <= 0) {
            callPlayer(index);
        } else {
            raisePlayer(index, currentBet + plan.amount);
        }
        return;
    }

    if (plan.type === "raise") {
        if (plan.amount === null || plan.amount === undefined || !Number.isFinite(plan.amount)) {
            callPlayer(index);
        } else {
            raisePlayer(index, plan.amount);
        }
        return;
    }

    foldPlayer(index);
}
