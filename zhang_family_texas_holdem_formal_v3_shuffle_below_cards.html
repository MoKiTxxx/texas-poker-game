}

function hideHandEndOverlay() {
    clearTimeout(handEndTimer);
    handEndMessage = "";
    handEndPhase = "none";
}


function getLegalMinRaiseTo() {
    if (currentBet === 0) {
        return Math.max(bigBlind, minRaise);
    }

    return Math.max(currentBet + 1, lastFullRaiseTo + minRaise);
}

function playerCanRaise(index) {
    const p = players[index];
    if (!p || p.folded || p.allIn || p.chips <= 0) return false;

    const maxRaiseTo = p.currentBet + p.chips;
    if (maxRaiseTo <= currentBet) return false;

    // If this player already responded to the last complete bet/raise, then an
    // intervening short all-in does not reopen their raising rights. They may
    // still call/fold when their currentBet is below currentBet.
    if (p.acted && p.currentBet < currentBet) return false;

    return true;
}

function hasEnoughForFullRaise(index, raiseTo) {
    const p = players[index];
    if (!p) return false;
    return raiseTo >= getLegalMinRaiseTo() || raiseTo >= p.currentBet + p.chips;
}

function playerAction(type) {
    if (communityRevealInProgress) return;
    if (!waitingForHuman) return;
    clearTurnWatchdog();
    pendingAiActionIndex = null;

    const p = players[actionIndex];
    const toCall = currentBet - p.currentBet;

    if (type === "fold") {
        foldPlayer(actionIndex);
    }

    if (type === "check") {
        if (toCall > 0) return;
        p.acted = true;
        p.lastAction = "過牌";
        if (street !== "preflop") p.stats.postflopChecks++;
        recordAction(actionIndex, "check", 0);
        log("你過牌。");
    }

    if (type === "call") {
        callPlayer(actionIndex);
    }

    if (type === "raise") {
        const input = document.getElementById("raiseAmount");
        let raiseTo = parseInt(input.value);

        if (isNaN(raiseTo)) return;

        if (raiseTo <= currentBet) {
            alert("加注後的總下注額必須大於目前最高下注。");
            return;
        }

        const legalMinRaiseTo = getLegalMinRaiseTo();
        if (!playerCanRaise(actionIndex)) {
            alert("目前不能再加注：短碼 All-in 不會重新開啟加注權。你只能跟注或棄牌。");
            return;
        }

        if (raiseTo < legalMinRaiseTo && p.chips + p.currentBet > raiseTo) {
            alert("加注太少。最少要加到 " + money(legalMinRaiseTo) + "。");
            return;
        }

        raisePlayer(actionIndex, raiseTo);
    }

    if (type === "allin") {
        const allInTo = p.currentBet + p.chips;
        if (allInTo <= currentBet) {
            callPlayer(actionIndex);
        } else if (!playerCanRaise(actionIndex)) {
            alert("目前不能用 All-in 再加注：短碼 All-in 不會重新開啟加注權。你只能跟注或棄牌。");
            return;
        } else {
            raisePlayer(actionIndex, allInTo);
        }
    }

    waitingForHuman = false;
    actionIndex = nextPlayableIndex(actionIndex);
    proceedTurn();
}

function foldPlayer(index) {
    const p = players[index];

    p.folded = true;
    p.acted = true;
    p.lastAction = "棄牌";
    p.stats.foldCount++;

    recordAction(index, "fold", 0);
    log(p.name + " 棄牌。");
}

function callPlayer(index) {
    const p = players[index];
    const toCall = currentBet - p.currentBet;
    const pay = Math.min(toCall, p.chips);
    const actionType = toCall === 0 ? "check" : "call";

    p.chips -= pay;
    p.currentBet += pay;
    p.totalBet += pay;
    pot += pay;
    p.acted = true;

    if (street === "preflop" && pay > 0) {
        markVoluntaryPreflop(index, false);
    }

    if (street !== "preflop") {
        if (actionType === "call") p.stats.postflopPassiveActions++;
        if (actionType === "check") p.stats.postflopChecks++;
    }

    if (p.chips === 0) {
        p.allIn = true;
        p.stats.allInCount++;
        p.lastAction = "All-in 跟注 " + money(pay);
        recordAction(index, actionType, pay, { becameAllIn: true });
        log(p.name + " All-in 跟注 " + money(pay) + "。");
    } else {
        p.lastAction = toCall === 0 ? "過牌" : "跟注 " + money(pay);
        recordAction(index, actionType, pay);
        log(p.name + (toCall === 0 ? " 過牌。" : " 跟注 " + money(pay) + "。"));
    }
}

function raisePlayer(index, raiseTo) {
    const p = players[index];

    const oldCurrentBet = currentBet;
    const previousMinRaise = minRaise;
    const previousLastFullRaiseTo = lastFullRaiseTo;
    const actionType = oldCurrentBet === 0 ? "bet" : "raise";
    const maxPossible = p.currentBet + p.chips;
    raiseTo = Math.min(Math.floor(raiseTo), maxPossible);

    if (raiseTo <= p.currentBet) {
        callPlayer(index);
        return;
    }

    if (raiseTo <= currentBet) {
        callPlayer(index);
        return;
    }

    if (!playerCanRaise(index)) {
        callPlayer(index);
        return;
    }

    const legalMinRaiseTo = getLegalMinRaiseTo();
    const isAllInAttempt = raiseTo >= maxPossible;
    if (raiseTo < legalMinRaiseTo && !isAllInAttempt) {
        callPlayer(index);
        return;
    }

    const pay = raiseTo - p.currentBet;
    const raiseIncrement = raiseTo - oldCurrentBet;
    const fullRaiseSize = raiseTo - previousLastFullRaiseTo;
    const isFullRaise = raiseTo >= previousLastFullRaiseTo + previousMinRaise;
    const isShortAllInRaise = isAllInAttempt && raiseTo > oldCurrentBet && !isFullRaise;

    p.chips -= pay;
    p.currentBet += pay;
    p.totalBet += pay;
    pot += pay;

    if (street === "preflop" && pay > 0) {
        markVoluntaryPreflop(index, true);
    }

    if (street !== "preflop") {
        p.stats.postflopAggressiveActions++;
    }

    let reopenedAction = false;
    if (raiseTo > currentBet) {
        currentBet = raiseTo;

        if (isFullRaise) {
            minRaise = Math.max(bigBlind, fullRaiseSize);
            lastFullRaiseTo = raiseTo;
            reopenedAction = true;

            for (const other of players) {
                if (other !== p && !other.folded && !other.allIn) {
                    other.acted = false;
                }
            }
        }
        // Incomplete short all-in: update currentBet so others can call the
        // extra amount, but do not reset acted flags. This prevents players who
        // already responded to the last full raise from raising again.
    }

    p.acted = true;

    const raiseMeta = {
        raiseTo,
        legalMinRaiseTo,
        previousMinRaise,
        previousLastFullRaiseTo,
        raiseIncrement,
        fullRaiseSize,
        isFullRaise,
        isShortAllInRaise,
        reopenedAction
    };

    if (p.chips === 0) {
        p.allIn = true;
        p.stats.allInCount++;
        p.lastAction = actionType === "bet" ? "All-in 下注 " + money(pay) : "All-in 到 " + money(raiseTo);
        recordAction(index, actionType, pay, { ...raiseMeta, becameAllIn: true });
        log(p.name + (actionType === "bet" ? " All-in 下注 " + money(pay) + "。" : " All-in 到 " + money(raiseTo) + "。"));
    } else {
        p.lastAction = actionType === "bet" ? "下注 " + money(pay) : "加注到 " + money(raiseTo);
        recordAction(index, actionType, pay, raiseMeta);
        log(p.name + (actionType === "bet" ? " 下注 " + money(pay) + "。" : " 加注到 " + money(raiseTo) + "。"));
    }
}
function nextPlayableIndex(from) {
    for (let i = 1; i <= players.length; i++) {
        const idx = (from + i) % players.length;
        const p = players[idx];
        if (!p.folded && !p.allIn && p.chips > 0) return idx;
    }
    return from;
}

function bestOfSeven(cards) {
    let best = null;

    for (let a = 0; a < cards.length - 4; a++) {
        for (let b = a + 1; b < cards.length - 3; b++) {
            for (let c = b + 1; c < cards.length - 2; c++) {
                for (let d = c + 1; d < cards.length - 1; d++) {
                    for (let e = d + 1; e < cards.length; e++) {
                        const five = [cards[a], cards[b], cards[c], cards[d], cards[e]];
                        const val = evaluateFive(five);
                        if (best === null || compareHands(val, best) > 0) {
                            best = val;
                        }
                    }
                }
            }
        }
    }

    return best;
}

function evaluateFive(cards) {
    const ranks = cards.map(c => c.rank).sort((a, b) => b - a);
    const suits = cards.map(c => c.suit);

    const counts = {};
    for (const r of ranks) counts[r] = (counts[r] || 0) + 1;

    const groups = Object.keys(counts)
        .map(r => ({ rank: parseInt(r), count: counts[r] }))
        .sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            return b.rank - a.rank;
        });

    const isFlush = suits.every(s => s === suits[0]);
    const straightHigh = getStraightHigh(ranks);

    if (isFlush && straightHigh) return { category: 8, tiebreak: [straightHigh] };

    if (groups[0].count === 4) {
        const quad = groups[0].rank;
        const kicker = groups.find(g => g.count === 1).rank;
        return { category: 7, tiebreak: [quad, kicker] };
    }

    if (groups[0].count === 3 && groups[1].count === 2) {
        return { category: 6, tiebreak: [groups[0].rank, groups[1].rank] };
    }

    if (isFlush) return { category: 5, tiebreak: ranks };
    if (straightHigh) return { category: 4, tiebreak: [straightHigh] };

    if (groups[0].count === 3) {
        const trip = groups[0].rank;
        const kickers = groups.filter(g => g.count === 1).map(g => g.rank).sort((a, b) => b - a);
        return { category: 3, tiebreak: [trip].concat(kickers) };
    }

    if (groups[0].count === 2 && groups[1].count === 2) {
        const pairRanks = groups.filter(g => g.count === 2).map(g => g.rank).sort((a, b) => b - a);
        const kicker = groups.find(g => g.count === 1).rank;
        return { category: 2, tiebreak: pairRanks.concat([kicker]) };
    }

    if (groups[0].count === 2) {
        const pair = groups[0].rank;
        const kickers = groups.filter(g => g.count === 1).map(g => g.rank).sort((a, b) => b - a);
        return { category: 1, tiebreak: [pair].concat(kickers) };
    }

    return { category: 0, tiebreak: ranks };
}

function getStraightHigh(ranks) {
    const unique = [...new Set(ranks)].sort((a, b) => b - a);

    if (unique.includes(14)) unique.push(1);

    for (let i = 0; i <= unique.length - 5; i++) {
        if (
            unique[i] - 1 === unique[i + 1] &&
            unique[i + 1] - 1 === unique[i + 2] &&
            unique[i + 2] - 1 === unique[i + 3] &&
            unique[i + 3] - 1 === unique[i + 4]
        ) {
            return unique[i];
        }
    }

    return null;
}

function compareHands(a, b) {
    if (a.category !== b.category) return a.category - b.category;

    for (let i = 0; i < Math.max(a.tiebreak.length, b.tiebreak.length); i++) {
        const av = a.tiebreak[i] || 0;
        const bv = b.tiebreak[i] || 0;
        if (av !== bv) return av - bv;
    }

    return 0;
}

function getSeatPosition(index, total) {
    const step = 360 / total;
    const deg = index * step;
    const rad = deg * Math.PI / 180;

    return {
        x: TABLE_CENTER_X + SEAT_RX * Math.sin(rad),
        y: TABLE_CENTER_Y + SEAT_RY * Math.cos(rad)
    };
}

function cardKey(card) {
    return card.rank + card.suit;
}

function render() {
    if (batchTestState.running) {
        const now = Date.now();
        if (now - batchTestState.lastRenderAt < 160) return;
        batchTestState.lastRenderAt = now;
    }

    renderSeats();
    renderCenter();
    renderActions();
    renderResultOverlay();
    renderBatchStatsPanel();
}

function renderSeats() {
    const wrap = document.getElementById("seats");
    wrap.innerHTML = "";

    for (let i = 0; i < players.length; i++) {
        const p = players[i];
        const seat = document.createElement("div");

        seat.className = "seat";

        if (p.isHuman) seat.classList.add("human");
        if (isAssigningSeats && !p.isHuman) seat.classList.add("assigning");
        if (i === actionIndex && handInProgress) seat.classList.add("activeTurn");

        if (p.chips <= 0 && !handInProgress) {
            seat.classList.add("bankrupt");
        } else if (p.folded) {
            seat.classList.add("folded");
        }

        const pos = getSeatPosition(i, players.length);
        seat.style.left = pos.x + "px";
        seat.style.top = pos.y + "px";

        let badges = "";
        if (i === dealerIndex && handInProgress) badges += "<span class='dealerBadge'>D</span>";

        if (handInProgress && street === "preflop") {
            if (i === getSmallBlindIndex()) badges += "<span class='blindBadge'>SB</span>";
            if (i === getBigBlindIndex()) badges += "<span class='blindBadge'>BB</span>";
        }

        if (handInProgress && p.allIn) badges += "<span class='allinBadge'>ALL-IN</span>";

        let html = "";
        html += "<div class='seatName'>" + p.name + badges + "</div>";
        html += "<div class='seatInfo'>";
        html += "籌碼：" + money(p.chips) + "<br>";
        html += "下注：" + money(p.currentBet) + "<br>";

        if (p.chips <= 0 && !handInProgress) {
            html += "<span class='bankruptText'>破產</span>";
        } else {
            html += "<span class='seatAction'>" + (p.lastAction || "-") + "</span>";
        }

        html += "</div>";

        html += "<div class='cards'>";

        if (p.chips <= 0 && p.hole.length === 0) {
            html += "<span class='small'>已離開牌局</span>";
        } else if (holeDealAnimationInProgress) {
            const visualCount = Math.max(0, Math.min(2, visualHoleCardCounts[i] || 0));
            for (let c = 0; c < visualCount; c++) {
                html += renderCardBack(i === lastDealtSeatIndex && c === visualCount - 1 ? "dealtBack" : "");
            }
        } else {
            for (const card of p.hole) {
                if (p.isHuman || p.revealed || showAllHoleCards) {
                    html += cardHTML(card);
                } else {
                    html += renderCardBack();
                }
            }

        }

        html += "</div>";

        if (!handInProgress && p.showdownResult && !p.folded) {
            html += "<div class='small'>牌型：" + handCategoryName[p.showdownResult.category] + "</div>";
        }

        seat.innerHTML = html;
        wrap.appendChild(seat);
    }
}

function renderCenter() {
    const streetName = {
        "preflop": "翻牌前",
        "flop": "翻牌",
        "turn": "轉牌",
        "river": "河牌"
    };

    document.getElementById("handLabel").textContent =
        handNumber > 0
            ? "第 " + handNumber + " 局｜盲注：" + money(smallBlind) + " / " + money(bigBlind)
            : "";

    const modeSuffix = humanTestMode !== "none" ? "｜測試模式：" + humanTestModeLabel : "";
    document.getElementById("street").textContent =
        (handInProgress ? "目前階段：" + streetName[street] : (isAssigningSeats ? "正在分配座位" : "等待下一局")) + modeSuffix;

    document.getElementById("pot").textContent = "底池：" + money(pot);

    const batchStatus = document.getElementById("batchStatus");
    if (batchStatus) {
        if (batchTestState.running || batchTestState.results.length > 0) {
            batchStatus.style.display = "block";
            const s = getBatchSummaryObject();
            const progressText = (s.completedGames || 0) + " / " + (s.targetGames || 0);
            const winRateText = s.completedGames ? Number((s.humanWinRate * 100).toFixed(1)) + "%" : "-";
            batchStatus.textContent = "批量統計｜模式：" + (s.label || "-") + "｜進度：" + progressText + "｜勝率：" + winRateText;
        } else {
            batchStatus.style.display = "none";
            batchStatus.textContent = "";
        }
    }

    const deckArea = document.getElementById("deckAnimationArea");
    if (deckArea) {
        if (deckShuffleAnimationInProgress || holeDealAnimationInProgress) {
            const cls = deckShuffleAnimationInProgress ? "deckStack shuffleActive" : "deckStack";
            const text = deckShuffleAnimationInProgress ? "正在洗牌……" : "正在發手牌……";
            deckArea.innerHTML =
                "<div class='" + cls + "'>" +
                    "<span class='card back deckCard'>?</span>" +
                    "<span class='card back deckCard'>?</span>" +
                    "<span class='card back deckCard'>?</span>" +
                "</div>" +
                "<div class='deckAnimationText'>" + text + "</div>";
        } else {
            deckArea.innerHTML = "";
        }
    }

    const community = document.getElementById("community");
    community.innerHTML = "<h3>公共牌</h3>";

    const visibleCount = Math.max(0, Math.min(visibleBoardCount, board.length));
    for (let i = 0; i < 5; i++) {
        if (board[i] && i < visibleCount) {
            const revealClass = i === lastCommunityRevealIndex ? "communityReveal" : "";
            community.innerHTML += cardHTML(board[i], revealClass);
        } else if (board[i]) {
            community.innerHTML += renderCardBack();
        } else {
            community.innerHTML += renderCommunityEmptySlot();
        }
    }
}

function renderActions() {
    const actions = document.getElementById("actions");
    const panel = document.getElementById("actionsPanel");
    actions.innerHTML = "";
    panel.classList.remove("waitingStatus", "humanAction", "assignStatus");

    if (isAssigningSeats) {
        panel.classList.remove("hidden");
        panel.classList.add("assignStatus");
        actions.innerHTML = "<div class='small'>正在隨機分配座位……</div>";
        return;
    }

    if (!handInProgress) {
        panel.classList.add("hidden");
        return;
    }

    if (deckShuffleAnimationInProgress) {
        panel.classList.remove("hidden");
        panel.classList.add("waitingStatus");
        actions.innerHTML = "<div class='small'>正在洗牌……</div>";
        return;
    }

    if (holeDealAnimationInProgress) {
        panel.classList.remove("hidden");
        panel.classList.add("waitingStatus");
        actions.innerHTML = "<div class='small'>正在發手牌……</div>";
        return;
    }

    if (communityRevealInProgress) {
        panel.classList.remove("hidden");
        panel.classList.add("waitingStatus");
        actions.innerHTML = "<div class='small'>公牌發牌中……</div>";
        return;
    }

    panel.classList.remove("hidden");

    const p = players[actionIndex];

    if (!waitingForHuman || !p || !p.isHuman) {
        panel.classList.add("waitingStatus");
        const modeNote = humanTestMode !== "none" ? "<div class='small'>目前測試模式：" + humanTestModeLabel + "</div>" : "";
        actions.innerHTML = "<div class='small'>等待其他玩家行動……</div>" + modeNote;
        return;
    }

    panel.classList.add("humanAction");

    const toCall = currentBet - p.currentBet;

    actions.innerHTML += "<div class='row'>";
    if (toCall === 0) {
        actions.innerHTML += "<button onclick=\"playerAction('check')\">過牌</button>";
    } else {
        actions.innerHTML += "<button onclick=\"playerAction('call')\">跟注 " + money(Math.min(toCall, p.chips)) + "</button>";
    }
    actions.innerHTML += "<button onclick=\"playerAction('fold')\">棄牌</button>";
    actions.innerHTML += "</div>";

    const legalMinRaiseTo = getLegalMinRaiseTo();
    const defaultRaise = Math.min(p.currentBet + p.chips, legalMinRaiseTo);
    const canRaiseNow = playerCanRaise(actionIndex);

    actions.innerHTML += "<div class='row'>";
    if (canRaiseNow) {
        actions.innerHTML += "加注到：";
        actions.innerHTML += "<input id='raiseAmount' type='number' value='" + defaultRaise + "' min='1'>";
        actions.innerHTML += "<button onclick=\"playerAction('raise')\">加注</button>";
        actions.innerHTML += "<button onclick=\"playerAction('allin')\">All-in</button>";
    } else {
        actions.innerHTML += "<span class='small'>短碼 All-in 未重開加注權：此輪只能跟注或棄牌。</span>";
    }
    actions.innerHTML += "</div>";

    actions.innerHTML += "<div class='small' style='margin-top:8px;'>";
    actions.innerHTML += "最高下注：" + money(currentBet) + "｜需跟注：" + money(toCall) + "｜合法最小加注到：" + money(legalMinRaiseTo) + "｜最小加注幅度：" + money(minRaise);
    actions.innerHTML += "</div>";
}

function renderResultOverlay() {
    const overlay = document.getElementById("resultOverlay");
    const message = document.getElementById("resultMessage");
    const buttonWrap = document.getElementById("resultButtonWrap");

    if (handEndPhase === "none") {
        overlay.classList.remove("show");
        message.innerHTML = "";
        buttonWrap.innerHTML = "";
        return;
    }

    overlay.classList.add("show");
    message.textContent = handEndMessage;

    if (handEndPhase === "message") {
        buttonWrap.innerHTML = "";
    } else if (handEndPhase === "button") {
        buttonWrap.innerHTML = "<button id='nextHandBigBtn' onclick='startNewHand()'>下一局</button>";
    } else if (handEndPhase === "gameover") {
        buttonWrap.innerHTML = "<button id='nextHandBigBtn' onclick='location.reload()'>重新開始</button>";
    }
}

function cardHTML(card, extraClass = "") {
    const red = card.suit === "H" || card.suit === "D";
    const classes = ["card"];
    if (red) classes.push("red");
    if (extraClass) classes.push(extraClass);
    return "<span class='" + classes.join(" ") + "'>" +
        rankNames[card.rank] + suitNames[card.suit] +
        "</span>";
}

function cardToText(card) {
    return rankNames[card.rank] + suitNames[card.suit];
}

function cardsToText(cards) {
    return cards.map(cardToText).join(" ");
}

function getAllHoleCardsSnapshot(context = "snapshot") {
    return players.map((p, i) => ({
        index: i,
        name: p.name,
        isHuman: !!p.isHuman,
        chips: p.chips,
        folded: !!p.folded,
        allIn: !!p.allIn,
        bankrupt: p.chips <= 0,
        dealtThisHand: !!(p.flags && p.flags.dealtThisHand),
        holeCards: p.hole && p.hole.length ? p.hole.map(cardToText) : [],
        notation: p.hole && p.hole.length === 2 ? getHandNotation(p.hole[0], p.hole[1]) : null,
        profile: p.profile ? p.profile.name : null,
        context
    }));
}

function recordHoleCardsSnapshot(context = "snapshot") {
    if (!FORMAL_RELEASE) autoLogEntries.push({
        type: "holeCardsSnapshot",
        handNumber,
        street,
        context,
        pot,
        board: board.map(cardToText),
        players: getAllHoleCardsSnapshot(context),
        timestamp: Date.now()
    });
}

function log(msg) {
    const isBatchMessage = typeof msg === "string" && msg.includes("批量測試");

    if (!(batchTestState.running && batchTestState.suppressVerboseLog && !isBatchMessage)) {
        const box = document.getElementById("log");
        if (box) {
            const line = document.createElement("div");
            line.className = "logLine";
            line.innerHTML = msg;
            box.prepend(line);
        }
    }

    if (!(batchTestState.running && batchTestState.suppressVerboseLog && !isBatchMessage)) {
        if (!FORMAL_RELEASE) autoLogEntries.push({
            type: "log",
            handNumber,
            street,
            text: stripHtml(msg),
            raw: msg,
            pot,
            board: board.map(c => cardToText(c)),
            timestamp: Date.now()
        });
    }
}

function randomInt(a, b) {
    return Math.floor(Math.random() * (b - a + 1)) + a;
}

function money(n) {
    return "$" + Number(n || 0).toLocaleString();
}

// Formal release: remove testing/debug/export entry points.
if (FORMAL_RELEASE) {
    debugMode = false;
    autoPlayMode = false;
    humanTestMode = "none";
    humanTestModeLabel = "";
    humanTestSessionMode = "none";
    humanTestSessionLabel = "";
    humanTestModeHistory = [];
    if (typeof batchTestState === "object" && batchTestState) {
        batchTestState.running = false;
        batchTestState.results = [];
        batchTestState.completedGames = 0;
        batchTestState.targetGames = 0;
    }
    toggleDebugPanel = function () { return; };
    toggleTestMenu = function () { return; };
    closeTestMenu = function () { return; };
    startAutoPlay = function () { return; };
    startHumanAllInTest = function () { return; };
    startHumanChaosTest = function () { return; };
    stopAutoPlay = function () { return; };
    startBatchChaosTest = function () { return; };
    startBatchAllInTest = function () { return; };
    startBatchTest = function () { return; };
    stopBatchTest = function () { return; };
    downloadAutoLog = function () { return; };
    downloadBatchStats = function () { return; };
    renderDebugPanel = function () { return; };
    renderBatchStatsPanel = function () { return; };
}
