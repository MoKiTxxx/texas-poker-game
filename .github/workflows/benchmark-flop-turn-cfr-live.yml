name: Flop+turn depth CFR iteration sweep

on:
  pull_request:
    branches:
      - feature/flop-depth-cfr
    paths:
      - benchmark-flop-cfr-live.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - cfr/flop-depth-cfr.js
      - cfr/holdem-postflop.js
      - .github/workflows/benchmark-flop-turn-cfr-live.yml

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - stack: 15
            iterations: 300
            seed: 51515115
          - stack: 15
            iterations: 600
            seed: 51515115
          - stack: 15
            iterations: 1200
            seed: 51515115
          - stack: 18
            iterations: 300
            seed: 81818118
          - stack: 18
            iterations: 600
            seed: 81818118
          - stack: 18
            iterations: 1200
            seed: 81818118
          - stack: 20
            iterations: 300
            seed: 20262026
          - stack: 20
            iterations: 600
            seed: 20262026
          - stack: 20
            iterations: 1200
            seed: 20262026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run duplicate flop+turn CFR sensitivity
        env:
          BENCH_STACK_BB: ${{ matrix.stack }}
          BENCH_PAIRS: "500"
          BENCH_CFR_ITERATIONS: ${{ matrix.iterations }}
          BENCH_SEED: ${{ matrix.seed }}
        run: node benchmark-flop-cfr-live.js
