name: HU midstack CFR selfplay smoke

on:
  pull_request:
    branches:
      - feature/hu-midstack-cfr
    paths:
      - benchmark-hu-midstack-selfplay.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - .github/workflows/benchmark-hu-midstack-selfplay.yml

jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise full live CFR public tree
        env:
          BENCH_STACK_BB: "15"
          BENCH_MIX: "1.0"
          BENCH_PAIRS: "2500"
          BENCH_SEED: "51515151"
        run: node benchmark-hu-midstack-selfplay.js
