name: Poker AI A/B Benchmark

on:
  pull_request:
    branches:
      - feature/range-aware-monte-carlo-equity
    paths:
      - benchmark-headsup.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - .github/workflows/benchmark-ai.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        alpha: [0.25, 0.40, 0.55]
        seed: [101, 202, 303, 404]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run head-to-head benchmark
        env:
          BENCH_ALPHA: ${{ matrix.alpha }}
          BENCH_SEED: ${{ matrix.seed }}
          BENCH_HANDS: "200"
          BENCH_TRIALS: "40"
        run: node benchmark-headsup.js
