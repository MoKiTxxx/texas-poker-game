<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>張家德州撲克 正式版</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: radial-gradient(circle at center, #0d5c38 0%, #052b1b 75%);
        color: white;
        overflow: hidden;
    }

    button {
        padding: 9px 16px;
        border: none;
        border-radius: 8px;
        background: #f3c04d;
        font-weight: bold;
        cursor: pointer;
        margin: 4px;
    }

    button:hover { background: #ffda70; }

    .testMenu {
        position: relative;
        display: inline-block;
    }

    .testMenuPanel {
        display: none;
        position: absolute;
        right: 0;
        top: 42px;
        min-width: 190px;
        padding: 8px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.86);
        box-shadow: 0 10px 26px rgba(0,0,0,0.45);
        z-index: 80;
    }

    .testMenuPanel.open { display: block; }

    .testMenuPanel button {
        display: block;
        width: 100%;
        margin: 4px 0;
        text-align: left;
        white-space: nowrap;
    }


    input, select {
        border: none;
        border-radius: 8px;
        font-size: 16px;
    }

    #setup {
        width: 420px;
        margin: 80px auto;
        background: rgba(0, 0, 0, 0.48);
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #setup h1 {
        text-align: center;
        margin-top: 0;
    }

    #setup label {
        display: block;
        margin-top: 18px;
    }

    #setup select,
    #setup input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
    }

    #game {
        display: none;
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
    }

    #stage {
        position: absolute;
        width: 1500px;
        height: 900px;
        left: 50%;
        top: 50%;
        transform-origin: center center;
        transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
    }

    #topbar {
        position: absolute;
        left: 30px;
        top: 14px;
        width: 1440px;
        height: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 30;
    }

    #topbar h2 {
        margin: 0;
        font-size: 26px;
    }

    #pokerTable {
        position: absolute;
        left: 610px;
        top: 400px;
        width: 840px;
        height: 455px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background:
            radial-gradient(circle at center, rgba(30,150,90,0.94), rgba(4,75,43,0.98) 70%),
            #074b2d;
        border: 18px solid #7c3f1f;
        box-shadow:
            inset 0 0 40px rgba(0,0,0,0.45),
            0 20px 40px rgba(0,0,0,0.45);
        z-index: 1;
    }

    #centerInfo {
        position: absolute;
        left: 610px;
        top: 236px;
        width: 520px;
        transform: translateX(-50%);
        text-align: center;
        z-index: 3;
        pointer-events: none;
    }

    #handLabel {
        font-size: 22px;
        color: #f3c04d;
        font-weight: bold;
        margin-bottom: 8px;
    }

    #street {
        font-size: 22px;
        margin-bottom: 10px;
    }

    #pot {
        font-size: 30px;
        font-weight: bold;
        color: #f3c04d;
        margin-bottom: 14px;
    }

    #community {
        position: absolute;
        left: 610px;
        top: 405px;
        width: 560px;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 3;
        margin: 0;
        pointer-events: none;
    }

    #community h3 {
        margin: 0 0 14px 0;
        font-size: 28px;
        color: #ffffff;
        line-height: 1.15;
    }

    #batchStatus {
        margin-top: 8px;
        color: #d9e8ff;
        font-size: 13px;
        line-height: 1.35;
        background: rgba(0,0,0,0.24);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 6px 10px;
        display: none;
    }


    #batchStatsPanel {
        position: absolute;
        right: 22px;
        top: 84px;
        width: 350px;
        max-height: 500px;
        overflow-y: auto;
        background: rgba(9, 20, 35, 0.9);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        z-index: 12;
        display: none;
        color: #eef4ff;
    }

    #batchStatsPanel h3 {
        margin: 0 0 8px 0;
        font-size: 18px;
        color: #f3c04d;
    }

    .batchPanelSub {
        font-size: 12px;
        color: #c8d7f7;
        margin-bottom: 10px;
    }

    .batchPanelStatusRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }

    .batchRunBadge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.06);
        color: #eef4ff;
    }

    .batchRunBadge.running {
        color: #d8ffd8;
        background: rgba(44, 125, 44, 0.35);
        border-color: rgba(120,255,120,0.28);
    }

    .batchMetricGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
    }

    .batchMetricCard {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 8px;
    }

    .batchMetricLabel {
        font-size: 12px;
        color: #c8d7f7;
        margin-bottom: 4px;
    }

    .batchMetricValue {
        font-size: 19px;
        font-weight: bold;
        color: #ffffff;
    }

    .batchMetricSmall {
        font-size: 12px;
        color: #bfd0f3;
    }

    .batchStatsSection {
        margin-top: 12px;
    }

    .batchStatsSection h4 {
        margin: 0 0 6px 0;
        font-size: 14px;
        color: #f3c04d;
    }

    .batchStatsTable {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }

    .batchStatsTable th,
    .batchStatsTable td {
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 6px 4px;
        text-align: left;
        vertical-align: top;
    }

    .batchStatsTable th {
        color: #dbe7ff;
        font-weight: bold;
        font-size: 12px;
    }

    .batchStatsTable td {
        color: #f7fbff;
    }

    .batchStatsTable tr:last-child td {
        border-bottom: none;
    }

    .batchResultWin {
        color: #98ff98;
        font-weight: bold;
    }

    .batchResultLose {
        color: #ffb0b0;
        font-weight: bold;
    }

    .batchHintText {
        font-size: 11px;
        color: #aebee0;
        margin-top: 8px;
        line-height: 1.35;
    }

    .seat {
        position: absolute;
        width: 142px;
        min-height: 106px;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.22);
        border-radius: 14px;
        padding: 7px;
        background: rgba(0,0,0,0.56);
        text-align: center;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        z-index: 5;
        transition: left 0.15s linear, top 0.15s linear, box-shadow 0.15s;
    }

    .seat.human {
        width: 220px;
        min-height: 142px;
        background: rgba(45, 130, 220, 0.46);
        border-color: rgba(120, 200, 255, 0.95);
        z-index: 7;
    }

    .seat.assigning {
        border-color: rgba(243,192,77,0.9);
        box-shadow: 0 0 18px rgba(243,192,77,0.65);
    }

    .seat.activeTurn {
        border-color: #f3c04d;
        box-shadow: 0 0 16px rgba(243,192,77,0.85);
    }

    .seat.folded {
        opacity: 0.38;
    }

    .seat.bankrupt {
        opacity: 0.28;
        filter: grayscale(0.85);
    }

    .seatName {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 3px;
    }

    .seatInfo {
        font-size: 12px;
        line-height: 1.35;
    }

    .seatAction {
        display: inline-block;
        margin-top: 2px;
        color: #f6e4a7;
        font-weight: bold;
    }

    .bankruptText {
        display: inline-block;
        margin-top: 4px;
        color: #ff8c8c;
        font-weight: bold;
    }

    .cards {
        margin-top: 6px;
        white-space: nowrap;
    }

    .card {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 36px;
        height: 50px;
        margin: 2px;
        border-radius: 8px;
        background: #fff;
        color: #111;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    .human .card {
        width: 46px;
        height: 66px;
        font-size: 20px;
    }

    #community .card {
        width: 42px;
        height: 58px;
        font-size: 18px;
    }

    #community .communityReveal {
        animation: communityCardReveal 220ms ease-out;
        transform-origin: left center;
    }

    @keyframes communityCardReveal {
        from {
            opacity: 0;
            transform: translateX(-14px) scale(0.88);
        }
        to {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }

    .red { color: #d11; }

    .back {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18) 0 18%, transparent 19%),
            repeating-linear-gradient(45deg, rgba(255,255,255,0.12) 0 4px, transparent 4px 8px),
            linear-gradient(135deg, #153f86, #0b1f44 54%, #102d67);
        color: transparent;
        border: 1px solid rgba(255,255,255,0.35);
        box-shadow: inset 0 0 0 3px rgba(255,255,255,0.10), 0 3px 8px rgba(0,0,0,0.35);
    }

    .back::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(255,255,255,0.48);
        border-radius: 6px;
    }

    .back::after {
        content: "♠";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255,255,255,0.82);
        font-size: 18px;
        line-height: 1;
    }



    .communityEmptySlot {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 42px;
        height: 58px;
        margin: 2px;
        border-radius: 8px;
        background: rgba(0,0,0,0.46);
        border: 1px dashed rgba(255,255,255,0.25);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.035), 0 3px 8px rgba(0,0,0,0.22);
        vertical-align: middle;
    }

    .communityEmptySlot::after {
        content: "";
        width: 14px;
        height: 20px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.025);
    }

    .dealtBack {
        animation: dealtCardPop 220ms ease-out;
    }

    @keyframes dealtCardPop {
        from { opacity: 0; transform: translateY(-12px) scale(0.84); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #deckAnimationArea {
        position: absolute;
        left: 610px;
        top: 525px;
        width: 320px;
        min-height: 86px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        pointer-events: none;
        z-index: 4;
    }

    .deckStack {
        position: relative;
        width: 56px;
        height: 72px;
    }

    .deckCard {
        position: absolute;
        width: 42px;
        height: 58px;
        left: 7px;
        top: 7px;
        border-radius: 8px;
    }

    .deckCard:nth-child(1) { transform: translate(-4px, 2px) rotate(-8deg); }
    .deckCard:nth-child(2) { transform: translate(3px, -1px) rotate(6deg); }
    .deckCard:nth-child(3) { transform: translate(0, 0) rotate(0deg); }

    .deckStack.shuffleActive .deckCard:nth-child(1) { animation: shuffleLeft 680ms ease-in-out infinite; }
    .deckStack.shuffleActive .deckCard:nth-child(2) { animation: shuffleRight 720ms ease-in-out infinite; }
    .deckStack.shuffleActive .deckCard:nth-child(3) { animation: shuffleTop 620ms ease-in-out infinite; }

    @keyframes shuffleLeft {
        0%, 100% { transform: translate(-5px, 2px) rotate(-9deg); }
        50% { transform: translate(14px, -3px) rotate(12deg); }
    }

    @keyframes shuffleRight {
        0%, 100% { transform: translate(4px, -1px) rotate(7deg); }
        50% { transform: translate(-15px, 3px) rotate(-13deg); }
    }

    @keyframes shuffleTop {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -8px) rotate(3deg); }
    }

    .deckAnimationText {
        min-width: 88px;
        color: #f6e4a7;
        font-size: 13px;
        font-weight: bold;
        text-align: left;
    }

    .dealerBadge, .blindBadge, .allinBadge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 12px;
        margin-left: 4px;
    }

    .dealerBadge { background: #b359ff; }
    .blindBadge { background: #e06b30; }
    .allinBadge { background: #db3556; }

    #actionsPanel {
        position: absolute;
        left: 860px;
        top: 705px;
        width: 330px;
        min-height: 135px;
        background: rgba(0,0,0,0.76);
        padding: 12px;
        border-radius: 14px;
        text-align: center;
        z-index: 20;
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    #actionsPanel.waitingStatus {
        left: 1188px;
        top: 655px;
        width: 282px;
        min-height: 0;
        padding: 9px 10px;
        background: rgba(0,0,0,0.52);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        z-index: 13;
        box-shadow: 0 5px 14px rgba(0,0,0,0.28);
    }

    #actionsPanel.waitingStatus .small {
        font-size: 13px;
        line-height: 1.35;
        color: rgba(255,255,255,0.82);
    }

    #actionsPanel.assignStatus {
        left: 1188px;
        top: 655px;
        width: 282px;
        min-height: 0;
        padding: 9px 10px;
        background: rgba(0,0,0,0.52);
        border: 1px solid rgba(255,255,255,0.08);
        z-index: 13;
    }

    #actionsPanel.humanAction {
        left: 1188px;
        top: 655px;
        width: 282px;
        min-height: 0;
        padding: 10px;
        z-index: 20;
        background: rgba(0,0,0,0.76);
        border: 1px solid rgba(243,192,77,0.25);
    }

    #actionsPanel.humanAction button {
        font-size: 14px;
        padding: 7px 11px;
        margin: 3px;
        border-radius: 9px;
    }

    #actionsPanel.humanAction .small {
        font-size: 12px;
        line-height: 1.35;
    }

    #actionsPanel.hidden {
        display: none;
    }

    #actionsPanel .row { margin-bottom: 8px; }

    #raiseAmount {
        width: 82px;
        padding: 7px;
        margin: 0 3px;
    }

    #resultOverlay {
        position: absolute;
        left: 610px;
        top: 128px;
        transform: translate(-50%, 0);
        min-width: 420px;
        max-width: 760px;
        padding: 0;
        background: transparent;
        border: none;
        text-align: center;
        z-index: 26;
        box-shadow: none;
        display: none;
        pointer-events: none;
    }

    #resultOverlay.show {
        display: block;
    }

    #resultMessage {
        display: inline-block;
        font-size: 22px;
        line-height: 1.42;
        font-weight: bold;
        color: #f6e4a7;
        margin-bottom: 10px;
        word-break: break-word;
        max-width: 760px;
        max-height: 96px;
        overflow-y: auto;
        padding: 10px 18px;
        background: rgba(0,0,0,0.58);
        border: 2px solid rgba(243,192,77,0.75);
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    #nextHandBigBtn {
        font-size: 28px;
        padding: 12px 38px;
        border-radius: 16px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        pointer-events: auto;
    }

    #logPanel {
        position: absolute;
        right: 30px;
        top: 78px;
        width: 285px;
        height: 560px;
        background: rgba(0,0,0,0.46);
        padding: 12px;
        border-radius: 12px;
        overflow-y: auto;
        z-index: 12;
    }

    #debugPanel {
        position: absolute;
        right: 30px;
        bottom: 28px;
        width: 430px;
        max-height: 275px;
        background: rgba(0,0,0,0.78);
        border: 1px solid rgba(243,192,77,0.55);
        border-radius: 12px;
        padding: 10px;
        z-index: 35;
        overflow-y: auto;
        display: none;
        font-size: 12px;
        line-height: 1.45;
        box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    }

    #debugPanel.show {
        display: block;
    }

    #debugPanel h3 {
        margin: 0 0 6px 0;
        font-size: 16px;
        color: #f3c04d;
    }

    .debugBlock {
        border-top: 1px solid rgba(255,255,255,0.12);
        padding-top: 5px;
        margin-top: 5px;
    }

    .debugMono {
        font-family: Consolas, monospace;
        color: #d8f7d8;
        word-break: break-word;
    }

    #logHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    #logHeader h3 {
        margin: 0;
        font-size: 22px;
    }

    #toggleLogBtn {
        padding: 5px 10px;
        font-size: 12px;
        margin: 0;
    }

    #logPanel.collapsed {
        height: 48px;
        overflow: hidden;
    }

    #logPanel.collapsed #log {
        display: none;
    }

    .logLine {
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 5px 0;
        font-size: 13px;
        line-height: 1.45;
    }

    .winText {
        color: #f3c04d;
        font-weight: bold;
    }

    .bustLog {
        color: #ff5b5b;
        font-weight: bold;
    }

    .small {
        font-size: 13px;
        color: #ddd;
    }

    #seatAssignOverlay {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
    }

    #seatAssignBanner {
        position: absolute;
        left: 610px;
        top: 90px;
        transform: translateX(-50%);
        width: 420px;
        background: rgba(0,0,0,0.72);
        border: 2px solid rgba(243,192,77,0.8);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 0 24px rgba(0,0,0,0.5);
    }

    #seatAssignBanner h2 {
        margin: 0 0 8px 0;
        color: #f3c04d;
        font-size: 24px;
    }

    #seatAssignBanner p {
        margin: 0;
        font-size: 15px;
    }

    .assignDot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 2px;
        border-radius: 50%;
        background: #f3c04d;
        animation: blink 0.8s infinite alternate;
    }

    .assignDot:nth-child(2) { animation-delay: 0.2s; }
    .assignDot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
        from { opacity: 0.25; transform: translateY(0); }
        to { opacity: 1; transform: translateY(-3px); }
    }
</style>
</head>
<body>

<div id="setup">
    <h1>張家德州撲克</h1>

    <label>遊戲人數，包含你自己</label>
    <select id="playerCount"></select>

    <label>每位玩家起始籌碼</label>
    <input id="startChips" type="number" value="2000" min="200" step="100">

    <button style="width:100%; margin-top:24px;" onclick="startGameWithSeatAnimation()">開始遊戲</button>

    <p class="small">這是純遊戲模擬，不涉及真實金錢。</p>
</div>

<div id="game">
    <div id="stage">
        <div id="topbar">
            <h2>張家德州撲克</h2>
            <div>
                <button onclick="location.reload()">重新開始</button>
            </div>
        </div>

        <div id="pokerTable"></div>

        <div id="centerInfo">
            <div id="handLabel"></div>
            <div id="street"></div>
            <div id="pot"></div>
        </div>

        <div id="deckAnimationArea"></div>
        <div id="community"></div>

        <div id="resultOverlay">
            <div id="resultMessage"></div>
            <div id="resultButtonWrap"></div>
        </div>

        <div id="seats"></div>

        <div id="actionsPanel">
            <div id="actions"></div>
        </div>

        <div id="logPanel">
            <div id="logHeader">
                <h3>遊戲日誌</h3>
                <button id="toggleLogBtn" onclick="toggleLogPanel()">收起</button>
            </div>
            <div id="log"></div>
        </div>

        <div id="seatAssignOverlay">
            <div id="seatAssignBanner">
                <h2>正在分配座位</h2>
                <p>
                    角色正在隨機換位
                    <span class="assignDot"></span>
                    <span class="assignDot"></span>
                    <span class="assignDot"></span>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
const FORMAL_RELEASE = true;

    return players.findIndex(p => p && p.isHuman);
}

function getHumanPlayer() {
    const idx = getHumanPlayerIndex();
    return idx >= 0 ? players[idx] : null;
}

function getChipLeaderIndexAmongActivePlayers() {
    let bestIndex = null;
    let bestChips = -1;
    for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (!p || p.chips <= 0) continue;
        if (p.chips > bestChips) {
            bestChips = p.chips;
            bestIndex = i;
        }
    }
    return bestIndex;
}


function clearCommunityRevealTimer() {
    if (communityRevealTimer) {
        clearTimeout(communityRevealTimer);
        communityRevealTimer = null;
    }
    communityRevealInProgress = false;
    lastCommunityRevealIndex = -1;
}

function randomCommunityRevealDelay() {
    return 500 + Math.floor(Math.random() * 201);
}

function revealCommunityCardsTo(targetCount, onDone) {
    clearCommunityRevealTimer();
    const safeTarget = Math.max(0, Math.min(5, targetCount, board.length));
    if (visibleBoardCount >= safeTarget) {
        communityRevealInProgress = false;
        lastCommunityRevealIndex = -1;
        render();
        if (typeof onDone === "function") onDone();
        return;
    }

    communityRevealInProgress = true;
    waitingForHuman = false;
    render();

    const step = () => {
        if (!handInProgress) {
            clearCommunityRevealTimer();
            return;
        }

        visibleBoardCount = Math.min(safeTarget, visibleBoardCount + 1);
        lastCommunityRevealIndex = visibleBoardCount - 1;
        render();

        if (visibleBoardCount >= safeTarget) {
            communityRevealTimer = setTimeout(() => {
                communityRevealTimer = null;
                communityRevealInProgress = false;
                lastCommunityRevealIndex = -1;
                render();
                if (typeof onDone === "function") onDone();
            }, 220);
        } else {
            communityRevealTimer = setTimeout(step, randomCommunityRevealDelay());
        }
    };

    communityRevealTimer = setTimeout(step, randomCommunityRevealDelay());
}

function startOpeningShuffleAndDealAnimation(dealOrder, onDone) {
    clearOpeningDealTimers();

    render();

    deckShuffleTimer = setTimeout(() => {
        deckShuffleTimer = null;
        deckShuffleAnimationInProgress = false;
        startHoleDealAnimation(dealOrder, onDone);
    }, 1050 + Math.floor(Math.random() * 301));
}

function startHoleDealAnimation(dealOrder, onDone) {
    holeDealAnimationInProgress = true;
    visualHoleCardCounts = {};
    lastDealtSeatIndex = null;

    const sequence = [];
    for (let r = 0; r < 2; r++) {
        for (const idx of dealOrder) sequence.push(idx);
    }

    let cursor = 0;
    const step = () => {
        if (!handInProgress) {
            clearOpeningDealTimers();
            return;
        }

        if (cursor >= sequence.length) {
            holeDealTimer = setTimeout(() => {
                holeDealTimer = null;
                holeDealAnimationInProgress = false;
                lastDealtSeatIndex = null;
                visualHoleCardCounts = {};
                render();
                if (typeof onDone === "function") onDone();
            }, 260);
            return;
        }

        const idx = sequence[cursor];
        const p = players[idx];
        if (p && p.chips > 0 && p.hole.length < 2) {
            p.hole.push(deck.pop());
            visualHoleCardCounts[idx] = Math.min(2, (visualHoleCardCounts[idx] || 0) + 1);
            lastDealtSeatIndex = idx;
        }

        cursor++;
        render();
        holeDealTimer = setTimeout(step, randomHoleDealDelay());
    };

    render();
    holeDealTimer = setTimeout(step, randomHoleDealDelay());
}

    if (batchTestState.running) {

            batchTestState.currentHumanBustHand = handNumber;

function handleBatchHumanBust() {
    if (!batchTestState.running) return false;

    const leaderIndex = getChipLeaderIndexAmongActivePlayers();
    const summary = collectBatchGameSummary(leaderIndex, "human_bust");
    batchTestState.results.push(summary);
    batchTestState.completedGames++;

    const leaderText = summary.winnerName ? "目前領先者：" + summary.winnerName + "。" : "";
    log("<span class='winText'>批量測試第 " + summary.gameNumber + " 場完成：你在第 " + summary.humanBustHand + " 手破產。" + leaderText + getBatchSummaryText() + "</span>");

    handInProgress = false;
    waitingForHuman = false;
    autoPlayMode = false;
    humanTestMode = "none";
    humanTestModeLabel = "";
    clearTimeout(handEndTimer);
    clearTurnWatchdog();
    pendingAiActionIndex = null;
    pendingAiActionHandId = 0;

    if (batchTestState.completedGames >= batchTestState.targetGames) {
        finishBatchTest();
    } else {
        setTimeout(startNextBatchTournament, 20);
    }

    render();
    return true;
}

        finishBatchTest();

    log("<span class='winText'>批量測試第 " + (batchTestState.completedGames + 1) + " / " + batchTestState.targetGames + " 場開始：" + batchTestState.label + "。</span>");

function collectBatchGameSummary(winnerIndex, endReason = "tournament_end") {
    const humanIndex = players.findIndex(p => p.isHuman);
    const human = players[humanIndex];
    const winner = players[winnerIndex];
    const elapsedMs = batchTestState.currentGameStartedAt ? Date.now() - batchTestState.currentGameStartedAt : null;

    return {
        gameNumber: batchTestState.completedGames + 1,
        mode: batchTestState.mode,
        label: batchTestState.label,
        handNumber,
        winnerIndex,
        winnerName: winner ? winner.name : null,
        winnerIsHuman: !!(winner && winner.isHuman),
        winnerProfile: winner && winner.profile ? winner.profile.name : null,
        winnerChips: winner ? winner.chips : 0,
        endReason,
        endedByHumanBust: endReason === "human_bust",
        humanChips: human ? human.chips : 0,
        humanBankrupt: human ? human.chips <= 0 : true,
        humanBustHand: batchTestState.currentHumanBustHand,
        humanHandsPlayed: human ? human.stats.handsPlayed : 0,
        humanVPIP: human ? human.stats.vpipHands : 0,
        humanPFR: human ? human.stats.pfrHands : 0,
        humanAllInCount: human ? human.stats.allInCount : 0,
        humanPostflopAggressiveActions: human ? human.stats.postflopAggressiveActions : 0,
        humanPostflopPassiveActions: human ? human.stats.postflopPassiveActions : 0,
        humanFoldCount: human ? human.stats.foldCount : 0,
        elapsedMs
    };
}

function handleBatchTournamentFinished(winnerIndex) {
    if (!batchTestState.running) return false;

    const summary = collectBatchGameSummary(winnerIndex);
    batchTestState.results.push(summary);
    batchTestState.completedGames++;

    const text = getBatchSummaryText();
    log("<span class='winText'>批量測試第 " + summary.gameNumber + " 場完成。冠軍：" + summary.winnerName + "。" + text + "</span>");

    if (batchTestState.completedGames >= batchTestState.targetGames) {
        finishBatchTest();
    } else {
        setTimeout(startNextBatchTournament, 20);
    }

    render();
    return true;
}

function finishBatchTest() {
    batchTestState.running = false;
    batchTestState.finishedAt = Date.now();
    autoPlayMode = false;
    humanTestMode = "none";
    humanTestModeLabel = "";

    const summary = getBatchSummaryText();
    log("<span class='winText'>批量測試完成。" + summary + "</span>");
    render();
}

function average(nums) {
    const arr = nums.filter(x => Number.isFinite(x));
    if (arr.length === 0) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
}

function getChampionCounts() {
    const counts = {};
    for (const r of batchTestState.results) {
        const key = r.winnerIsHuman ? "你" : (r.endedByHumanBust ? "AI（你破產）" : (r.winnerProfile || "AI"));
        counts[key] = (counts[key] || 0) + 1;
    }
    return counts;
}

function getBatchSummaryObject() {
    const results = batchTestState.results;
    const completed = results.length;
    const humanWins = results.filter(r => r.winnerIsHuman).length;
    const humanLosses = completed - humanWins;
    const bustHands = results.filter(r => r.humanBankrupt).map(r => r.humanBustHand || r.humanHandsPlayed || r.handNumber);

    return {
        mode: batchTestState.mode,
        label: batchTestState.label,
        targetGames: batchTestState.targetGames,
        completedGames: completed,
        humanWins,
        humanLosses,
        humanWinRate: completed ? humanWins / completed : 0,
        averageTournamentHands: average(results.map(r => r.handNumber)),
        averageHumanBustHand: average(bustHands),
        averageHumanAllIns: average(results.map(r => r.humanAllInCount)),
        averageHumanVPIP: average(results.map(r => r.humanVPIP)),
        averageHumanPFR: average(results.map(r => r.humanPFR)),
        championCounts: getChampionCounts(),
        startedAt: batchTestState.startedAt ? new Date(batchTestState.startedAt).toISOString() : null,
        finishedAt: batchTestState.finishedAt ? new Date(batchTestState.finishedAt).toISOString() : null
    };
}

function getBatchSummaryText() {
    const s = getBatchSummaryObject();
    if (s.completedGames === 0) return "尚未完成任何場次。";

    const winRate = Math.round(s.humanWinRate * 1000) / 10;
    const avgHands = s.averageTournamentHands === null ? "-" : Number(s.averageTournamentHands.toFixed(1));
    const avgBust = s.averageHumanBustHand === null ? "-" : Number(s.averageHumanBustHand.toFixed(1));
    const avgAllIn = s.averageHumanAllIns === null ? "-" : Number(s.averageHumanAllIns.toFixed(1));
    const champs = Object.entries(s.championCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => k + "×" + v)
        .join("，");

    return "完成 " + s.completedGames + " / " + s.targetGames + " 場｜你勝率 " + winRate + "%｜平均局數 " + avgHands + "｜平均破產手數 " + avgBust + "｜平均 All-in " + avgAllIn + "｜冠軍分布：" + champs + "。";
}

function formatBatchMetric(value, digits = 1) {
    if (value === null || value === undefined || !Number.isFinite(value)) return "-";
    if (digits <= 0) return String(Math.round(value));
    return Number(value.toFixed(digits)).toString();
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function completePreflopDecisionDebug(index, actionType, amountPaid, extra = {}) {
    const entry = pendingPreflopDecisionDebug[index];
    if (!entry) return;

    entry.finalAction = actionType;
    entry.finalAmountPaid = amountPaid || 0;
    entry.finalRaiseTo = extra.raiseTo ?? null;
    entry.finalPotAfterAction = pot;
    entry.finalChipsAfterAction = players[index].chips;
    entry.completedAt = Date.now();

    delete pendingPreflopDecisionDebug[index];
}

function annotatePreflopDecisionDebug(index, data = {}) {
    const entry = pendingPreflopDecisionDebug[index];
    if (!entry) return;
    Object.assign(entry, data);
}

function startGameWithSeatAnimation() {
    const count = parseInt(document.getElementById("playerCount").value);
    const chips = parseInt(document.getElementById("startChips").value);
    
    if (count < 2 || count > 9) {
        alert("德州撲克合法人數為 2 到 9 人。");
        return;
    }

    if (chips < 200) {
        alert("起始籌碼太少，至少要 $200。");
        return;
    }

    initialChips = chips;
    lastBlindSmallBlind = null;
    lastBlindBigBlind = null;

    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("log").innerHTML = "";

    updateStageScale();

    createInitialPlayers(count, chips);

    board = [];
    pot = 0;
    street = "preflop";
    handInProgress = false;
    waitingForHuman = false;
    isAssigningSeats = true;
    hasHandStarted = false;
    handNumber = 0;
    tournamentGameOver = false;
    showAllHoleCards = false;
    lastBlindSmallBlind = null;
    lastBlindBigBlind = null;
    hideHandEndOverlay();

    document.getElementById("seatAssignOverlay").style.display = "block";

    log("正在分配座位。你固定在最下方。");

    render();

    let shuffleCount = 0;
    seatShuffleTimer = setInterval(() => {
        randomizeAiSeatOrder();
        shuffleCount++;
        render();

        if (shuffleCount >= 18) {
            finishSeatAssignment();
        }
    }, 130);
}

function createInitialPlayers(count, chips) {
    const aiNames = generateAiNames(count - 1);

    const human = createPlayer("你", true, chips, "human", null);
    const aiPlayers = aiNames.map(name => {
        return createPlayer(name, false, chips, "gto", randomAiProfile());
    });

    shuffle(aiPlayers);
    players = [human].concat(aiPlayers);
}

function createPlayer(name, isHuman, chips, aiType = "gto", profile = null) {
    return {
        name,
        isHuman,
        aiType,
        profile,
        chips,
        hole: [],
        folded: false,
        allIn: false,
        currentBet: 0,
        totalBet: 0,
        acted: false,
        lastAction: "",
        revealed: false,
        showdownResult: null,
        eliminatedLogged: false,
        stats: {
            handsPlayed: 0,
            vpipHands: 0,
            pfrHands: 0,
            postflopAggressiveActions: 0,
            postflopPassiveActions: 0,
            postflopChecks: 0,
            foldCount: 0,
            allInCount: 0
        },
        opponentModel: createOpponentModel(),
        flags: {
            dealtThisHand: false,
            voluntarilyPutMoneyInPotThisHand: false,
            preflopRaisedThisHand: false,
            statsFinalizedForThisHand: false
        }
    };
}

function randomAiProfile() {
    const profiles = [aiProfiles.TAG, aiProfiles.LAG, aiProfiles.Station, aiProfiles.Nit];
    return profiles[Math.floor(Math.random() * profiles.length)];
}

function generateAiNames(aiCount) {
    const pool = allAiNames.slice();
    shuffle(pool);
    return pool.slice(0, aiCount);
}

function randomizeAiSeatOrder() {
    const human = players.find(p => p.isHuman);
    const aiPlayers = players.filter(p => !p.isHuman);
    shuffle(aiPlayers);
    players = [human].concat(aiPlayers);
}

function finishSeatAssignment() {
    clearInterval(seatShuffleTimer);
    seatShuffleTimer = null;

    randomizeAiSeatOrder();

    isAssigningSeats = false;
    document.getElementById("seatAssignOverlay").style.display = "none";

    render();

    log("座位分配完成。正式座位：" + players.map((p, i) => "座位" + i + "：" + p.name).join("，") + "。");

    setTimeout(() => {
        startNewHand();
    }, 500);
}

function totalTournamentChips() {
    return players.reduce((sum, p) => sum + Math.max(0, Number(p.chips) || 0), 0);
}

function expectedTournamentChips() {
    return players.length * initialChips;
}

function logChipConservationCheck(context) {
    if (!players || players.length === 0) return true;

    const total = totalTournamentChips();
    const expected = expectedTournamentChips();
    const ok = total === expected;

    if (!FORMAL_RELEASE) autoLogEntries.push({
        type: "chipConservationCheck",
        handNumber,
        street,
        context,
        totalChips: total,
        expectedChips: expected,
        difference: total - expected,
        ok,
        timestamp: Date.now()
    });

    if (!ok) {
        log("<span class='bustLog'>籌碼守恆警告：" + context + "，目前總籌碼 " + money(total) + "，應為 " + money(expected) + "，差額 " + money(total - expected) + "。</span>");
    }

    return ok;
}
