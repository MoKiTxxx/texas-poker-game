<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>張家德州撲克 正式版</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: radial-gradient(circle at center, #0d5c38 0%, #052b1b 75%);
        color: white;
        overflow: hidden;
    }

    button {
        padding: 9px 16px;
        border: none;
        border-radius: 8px;
        background: #f3c04d;
        font-weight: bold;
        cursor: pointer;
        margin: 4px;
    }

    button:hover { background: #ffda70; }

    .testMenu {
        position: relative;
        display: inline-block;
    }

    .testMenuPanel {
        display: none;
        position: absolute;
        right: 0;
        top: 42px;
        min-width: 190px;
        padding: 8px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.86);
        box-shadow: 0 10px 26px rgba(0,0,0,0.45);
        z-index: 80;
    }

    .testMenuPanel.open { display: block; }

    .testMenuPanel button {
        display: block;
        width: 100%;
        margin: 4px 0;
        text-align: left;
        white-space: nowrap;
    }


    input, select {
        border: none;
        border-radius: 8px;
        font-size: 16px;
    }

    #setup {
        width: 420px;
        margin: 80px auto;
        background: rgba(0, 0, 0, 0.48);
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #setup h1 {
        text-align: center;
        margin-top: 0;
    }

    #setup label {
        display: block;
        margin-top: 18px;
    }

    #setup select,
    #setup input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
    }

    #game {
        display: none;
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
    }

    #stage {
        position: absolute;
        width: 1500px;
        height: 900px;
        left: 50%;
        top: 50%;
        transform-origin: center center;
        transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
    }

    #topbar {
        position: absolute;
        left: 30px;
        top: 14px;
        width: 1440px;
        height: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 30;
    }

    #topbar h2 {
        margin: 0;
        font-size: 26px;
    }

    #pokerTable {
        position: absolute;
        left: 610px;
        top: 400px;
        width: 840px;
        height: 455px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background:
            radial-gradient(circle at center, rgba(30,150,90,0.94), rgba(4,75,43,0.98) 70%),
            #074b2d;
        border: 18px solid #7c3f1f;
        box-shadow:
            inset 0 0 40px rgba(0,0,0,0.45),
            0 20px 40px rgba(0,0,0,0.45);
        z-index: 1;
    }

    #centerInfo {
        position: absolute;
        left: 610px;
        top: 236px;
        width: 520px;
        transform: translateX(-50%);
        text-align: center;
        z-index: 3;
        pointer-events: none;
    }

    #handLabel {
        font-size: 22px;
        color: #f3c04d;
        font-weight: bold;
        margin-bottom: 8px;
    }

    #street {
        font-size: 22px;
        margin-bottom: 10px;
    }

    #pot {
        font-size: 30px;
        font-weight: bold;
        color: #f3c04d;
        margin-bottom: 14px;
    }

    #community {
        position: absolute;
        left: 610px;
        top: 405px;
        width: 560px;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 3;
        margin: 0;
        pointer-events: none;
    }

    #community h3 {
        margin: 0 0 14px 0;
        font-size: 28px;
        color: #ffffff;
        line-height: 1.15;
    }

    #batchStatus {
        margin-top: 8px;
        color: #d9e8ff;
        font-size: 13px;
        line-height: 1.35;
        background: rgba(0,0,0,0.24);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 6px 10px;
        display: none;
    }


    #batchStatsPanel {
        position: absolute;
        right: 22px;
        top: 84px;
        width: 350px;
        max-height: 500px;
        overflow-y: auto;
        background: rgba(9, 20, 35, 0.9);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        z-index: 12;
        display: none;
        color: #eef4ff;
    }

    #batchStatsPanel h3 {
        margin: 0 0 8px 0;
        font-size: 18px;
        color: #f3c04d;
    }

    .batchPanelSub {
        font-size: 12px;
        color: #c8d7f7;
        margin-bottom: 10px;
    }

    .batchPanelStatusRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }

    .batchRunBadge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.06);
        color: #eef4ff;
    }

    .batchRunBadge.running {
        color: #d8ffd8;
        background: rgba(44, 125, 44, 0.35);
        border-color: rgba(120,255,120,0.28);
    }

    .batchMetricGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
    }

    .batchMetricCard {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 8px;
    }

    .batchMetricLabel {
        font-size: 12px;
        color: #c8d7f7;
        margin-bottom: 4px;
    }

    .batchMetricValue {
        font-size: 19px;
        font-weight: bold;
        color: #ffffff;
    }

    .batchMetricSmall {
        font-size: 12px;
        color: #bfd0f3;
    }

    .batchStatsSection {
        margin-top: 12px;
    }

    .batchStatsSection h4 {
        margin: 0 0 6px 0;
        font-size: 14px;
        color: #f3c04d;
    }

    .batchStatsTable {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }

    .batchStatsTable th,
    .batchStatsTable td {
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 6px 4px;
        text-align: left;
        vertical-align: top;
    }

    .batchStatsTable th {
        color: #dbe7ff;
        font-weight: bold;
        font-size: 12px;
    }

    .batchStatsTable td {
        color: #f7fbff;
    }

    .batchStatsTable tr:last-child td {
        border-bottom: none;
    }

    .batchResultWin {
        color: #98ff98;
        font-weight: bold;
    }

    .batchResultLose {
        color: #ffb0b0;
        font-weight: bold;
    }

    .batchHintText {
        font-size: 11px;
        color: #aebee0;
        margin-top: 8px;
        line-height: 1.35;
    }

    .seat {
        position: absolute;
        width: 142px;
        min-height: 106px;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.22);
        border-radius: 14px;
        padding: 7px;
        background: rgba(0,0,0,0.56);
        text-align: center;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        z-index: 5;
        transition: left 0.15s linear, top 0.15s linear, box-shadow 0.15s;
    }

    .seat.human {
        width: 220px;
        min-height: 142px;
        background: rgba(45, 130, 220, 0.46);
        border-color: rgba(120, 200, 255, 0.95);
        z-index: 7;
    }

    .seat.assigning {
        border-color: rgba(243,192,77,0.9);
        box-shadow: 0 0 18px rgba(243,192,77,0.65);
    }

    .seat.activeTurn {
        border-color: #f3c04d;
        box-shadow: 0 0 16px rgba(243,192,77,0.85);
    }

    .seat.folded {
        opacity: 0.38;
    }

    .seat.bankrupt {
        opacity: 0.28;
        filter: grayscale(0.85);
    }

    .seatName {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 3px;
    }

    .seatInfo {
        font-size: 12px;
        line-height: 1.35;
    }

    .seatAction {
        display: inline-block;
        margin-top: 2px;
        color: #f6e4a7;
        font-weight: bold;
    }

    .bankruptText {
        display: inline-block;
        margin-top: 4px;
        color: #ff8c8c;
        font-weight: bold;
    }

    .cards {
        margin-top: 6px;
        white-space: nowrap;
    }

    .card {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 36px;
        height: 50px;
        margin: 2px;
        border-radius: 8px;
        background: #fff;
        color: #111;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    .human .card {
        width: 46px;
        height: 66px;
        font-size: 20px;
    }

    #community .card {
        width: 42px;
        height: 58px;
        font-size: 18px;
    }

    #community .communityReveal {
        animation: communityCardReveal 220ms ease-out;
        transform-origin: left center;
    }

    @keyframes communityCardReveal {
        from {
            opacity: 0;
            transform: translateX(-14px) scale(0.88);
        }
        to {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }

    .red { color: #d11; }

    .back {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18) 0 18%, transparent 19%),
            repeating-linear-gradient(45deg, rgba(255,255,255,0.12) 0 4px, transparent 4px 8px),
            linear-gradient(135deg, #153f86, #0b1f44 54%, #102d67);
        color: transparent;
        border: 1px solid rgba(255,255,255,0.35);
        box-shadow: inset 0 0 0 3px rgba(255,255,255,0.10), 0 3px 8px rgba(0,0,0,0.35);
    }

    .back::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(255,255,255,0.48);
        border-radius: 6px;
    }

    .back::after {
        content: "♠";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255,255,255,0.82);
        font-size: 18px;
        line-height: 1;
    }



    .communityEmptySlot {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 42px;
        height: 58px;
        margin: 2px;
        border-radius: 8px;
        background: rgba(0,0,0,0.46);
        border: 1px dashed rgba(255,255,255,0.25);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.035), 0 3px 8px rgba(0,0,0,0.22);
        vertical-align: middle;
    }

    .communityEmptySlot::after {
        content: "";
        width: 14px;
        height: 20px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.025);
    }

    .dealtBack {
        animation: dealtCardPop 220ms ease-out;
    }

    @keyframes dealtCardPop {
        from { opacity: 0; transform: translateY(-12px) scale(0.84); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #deckAnimationArea {
        position: absolute;
        left: 610px;
        top: 525px;
        width: 320px;
        min-height: 86px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        pointer-events: none;
        z-index: 4;
    }

    .deckStack {
        position: relative;
        width: 56px;
        height: 72px;
    }

    .deckCard {
        position: absolute;
        width: 42px;
        height: 58px;
        left: 7px;
        top: 7px;
        border-radius: 8px;
    }

    .deckCard:nth-child(1) { transform: translate(-4px, 2px) rotate(-8deg); }
    .deckCard:nth-child(2) { transform: translate(3px, -1px) rotate(6deg); }
    .deckCard:nth-child(3) { transform: translate(0, 0) rotate(0deg); }

    .deckStack.shuffleActive .deckCard:nth-child(1) { animation: shuffleLeft 680ms ease-in-out infinite; }
    .deckStack.shuffleActive .deckCard:nth-child(2) { animation: shuffleRight 720ms ease-in-out infinite; }
    .deckStack.shuffleActive .deckCard:nth-child(3) { animation: shuffleTop 620ms ease-in-out infinite; }

    @keyframes shuffleLeft {
        0%, 100% { transform: translate(-5px, 2px) rotate(-9deg); }
        50% { transform: translate(14px, -3px) rotate(12deg); }
    }

    @keyframes shuffleRight {
        0%, 100% { transform: translate(4px, -1px) rotate(7deg); }
        50% { transform: translate(-15px, 3px) rotate(-13deg); }
    }

    @keyframes shuffleTop {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -8px) rotate(3deg); }
    }

    .deckAnimationText {
        min-width: 88px;
        color: #f6e4a7;
        font-size: 13px;
        font-weight: bold;
        text-align: left;
    }

    .dealerBadge, .blindBadge, .allinBadge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 12px;
        margin-left: 4px;
    }

    .dealerBadge { background: #b359ff; }
    .blindBadge { background: #e06b30; }
    .allinBadge { background: #db3556; }

    #actionsPanel {
        position: absolute;
        left: 860px;
        top: 705px;
        width: 330px;
        min-height: 135px;
        background: rgba(0,0,0,0.76);
        padding: 12px;
        border-radius: 14px;
        text-align: center;
        z-index: 20;
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    #actionsPanel.waitingStatus {
        left: 1188px;
        top: 655px;
        width: 282px;
        min-height: 0;
        padding: 9px 10px;
        background: rgba(0,0,0,0.52);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        z-index: 13;
        box-shadow: 0 5px 14px rgba(0,0,0,0.28);
    }

    #actionsPanel.waitingStatus .small {
        font-size: 13px;
        line-height: 1.35;
        color: rgba(255,255,255,0.82);
    }

    #actionsPanel.assignStatus {
        left: 1188px;
        top: 655px;
        width: 282px;
        min-height: 0;
        padding: 9px 10px;
        background: rgba(0,0,0,0.52);
        border: 1px solid rgba(255,255,255,0.08);
        z-index: 13;
    }

    #actionsPanel.humanAction {
        left: 1188px;
        top: 655px;
        width: 282px;
        min-height: 0;
        padding: 10px;
        z-index: 20;
        background: rgba(0,0,0,0.76);
        border: 1px solid rgba(243,192,77,0.25);
    }

    #actionsPanel.humanAction button {
        font-size: 14px;
        padding: 7px 11px;
        margin: 3px;
        border-radius: 9px;
    }

    #actionsPanel.humanAction .small {
        font-size: 12px;
        line-height: 1.35;
    }

    #actionsPanel.hidden {
        display: none;
    }

    #actionsPanel .row { margin-bottom: 8px; }

    #raiseAmount {
        width: 82px;
        padding: 7px;
        margin: 0 3px;
    }

    #resultOverlay {
        position: absolute;
        left: 610px;
        top: 128px;
        transform: translate(-50%, 0);
        min-width: 420px;
        max-width: 760px;
        padding: 0;
        background: transparent;
        border: none;
        text-align: center;
        z-index: 26;
        box-shadow: none;
        display: none;
        pointer-events: none;
    }

    #resultOverlay.show {
        display: block;
    }

    #resultMessage {
        display: inline-block;
        font-size: 22px;
        line-height: 1.42;
        font-weight: bold;
        color: #f6e4a7;
        margin-bottom: 10px;
        word-break: break-word;
        max-width: 760px;
        max-height: 96px;
        overflow-y: auto;
        padding: 10px 18px;
        background: rgba(0,0,0,0.58);
        border: 2px solid rgba(243,192,77,0.75);
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    #nextHandBigBtn {
        font-size: 28px;
        padding: 12px 38px;
        border-radius: 16px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        pointer-events: auto;
    }

    #logPanel {
        position: absolute;
        right: 30px;
        top: 78px;
        width: 285px;
        height: 560px;
        background: rgba(0,0,0,0.46);
        padding: 12px;
        border-radius: 12px;
        overflow-y: auto;
        z-index: 12;
    }

    #debugPanel {
        position: absolute;
        right: 30px;
        bottom: 28px;
        width: 430px;
        max-height: 275px;
        background: rgba(0,0,0,0.78);
        border: 1px solid rgba(243,192,77,0.55);
        border-radius: 12px;
        padding: 10px;
        z-index: 35;
        overflow-y: auto;
        display: none;
        font-size: 12px;
        line-height: 1.45;
        box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    }

    #debugPanel.show {
        display: block;
    }

    #debugPanel h3 {
        margin: 0 0 6px 0;
        font-size: 16px;
        color: #f3c04d;
    }

    .debugBlock {
        border-top: 1px solid rgba(255,255,255,0.12);
        padding-top: 5px;
        margin-top: 5px;
    }

    .debugMono {
        font-family: Consolas, monospace;
        color: #d8f7d8;
        word-break: break-word;
    }

    #logHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    #logHeader h3 {
        margin: 0;
        font-size: 22px;
    }

    #toggleLogBtn {
        padding: 5px 10px;
        font-size: 12px;
        margin: 0;
    }

    #logPanel.collapsed {
        height: 48px;
        overflow: hidden;
    }

    #logPanel.collapsed #log {
        display: none;
    }

    .logLine {
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 5px 0;
        font-size: 13px;
        line-height: 1.45;
    }

    .winText {
        color: #f3c04d;
        font-weight: bold;
    }

    .bustLog {
        color: #ff5b5b;
        font-weight: bold;
    }

    .small {
        font-size: 13px;
        color: #ddd;
    }

    #seatAssignOverlay {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
    }

    #seatAssignBanner {
        position: absolute;
        left: 610px;
        top: 90px;
        transform: translateX(-50%);
        width: 420px;
        background: rgba(0,0,0,0.72);
        border: 2px solid rgba(243,192,77,0.8);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 0 24px rgba(0,0,0,0.5);
    }

    #seatAssignBanner h2 {
        margin: 0 0 8px 0;
        color: #f3c04d;
        font-size: 24px;
    }

    #seatAssignBanner p {
        margin: 0;
        font-size: 15px;
    }

    .assignDot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 2px;
        border-radius: 50%;
        background: #f3c04d;
        animation: blink 0.8s infinite alternate;
    }

    .assignDot:nth-child(2) { animation-delay: 0.2s; }
    .assignDot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
        from { opacity: 0.25; transform: translateY(0); }
        to { opacity: 1; transform: translateY(-3px); }
    }
</style>
</head>
<body>

<div id="setup">
    <h1>張家德州撲克</h1>

    <label>遊戲人數，包含你自己</label>
    <select id="playerCount"></select>

    <label>每位玩家起始籌碼</label>
    <input id="startChips" type="number" value="2000" min="200" step="100">

    <button style="width:100%; margin-top:24px;" onclick="startGameWithSeatAnimation()">開始遊戲</button>

    <p class="small">這是純遊戲模擬，不涉及真實金錢。</p>
</div>

<div id="game">
    <div id="stage">
        <div id="topbar">
            <h2>張家德州撲克</h2>
            <div>
                <button onclick="location.reload()">重新開始</button>
            </div>
        </div>

        <div id="pokerTable"></div>

        <div id="centerInfo">
            <div id="handLabel"></div>
            <div id="street"></div>
            <div id="pot"></div>
        </div>

        <div id="deckAnimationArea"></div>
        <div id="community"></div>

        <div id="resultOverlay">
            <div id="resultMessage"></div>
            <div id="resultButtonWrap"></div>
        </div>

        <div id="seats"></div>

        <div id="actionsPanel">
            <div id="actions"></div>
        </div>

        <div id="logPanel">
            <div id="logHeader">
                <h3>遊戲日誌</h3>
                <button id="toggleLogBtn" onclick="toggleLogPanel()">收起</button>
            </div>
            <div id="log"></div>
        </div>

        <div id="seatAssignOverlay">
            <div id="seatAssignBanner">
                <h2>正在分配座位</h2>
                <p>
                    角色正在隨機換位
                    <span class="assignDot"></span>
                    <span class="assignDot"></span>
                    <span class="assignDot"></span>
                </p>
            </div>
        </div>
    </div>
</div>

<script>

function resumeAutoControlAfterModeChange() {
    if (handInProgress && waitingForHuman && players[actionIndex] && players[actionIndex].isHuman) {
        waitingForHuman = false;
        performGTODecision(actionIndex);
    } else if (!handInProgress && players.length > 0 && activePlayerCount() > 1 && handEndPhase === "none") {
        setTimeout(startNewHand, 300);
    }
}


function markHumanTestModeStarted(mode, label) {
    if (mode === "none") return;
    humanTestSessionMode = mode;
    humanTestSessionLabel = label;
    humanTestModeHistory.push({
        mode,
        label,
        handNumber,
        timestamp: Date.now()
    });
}

function startAutoPlay() {
    if (isAssigningSeats || tournamentGameOver) return;

    autoPlayMode = true;
    humanTestMode = "none";
    humanTestModeLabel = "";
    log("<span class='winText'>自動測試開始：玩家也會由 AI 代打。</span>");

    resumeAutoControlAfterModeChange();
    render();
}

function canStartStandaloneHumanTest(label) {
    if (isAssigningSeats || tournamentGameOver) return false;

    const human = getHumanPlayer();
    if (!human || human.bankrupt || human.chips <= 0) {
        autoPlayMode = false;
        humanTestMode = "none";
        humanTestModeLabel = "";
        log("<span class='bustLog'>無法開始「" + label + "」：你已經破產，請重新開始或開始新的 tournament。</span>");
        render();
        return false;
    }

    if (activePlayerCount() <= 1) {
        log("<span class='bustLog'>無法開始「" + label + "」：牌局已沒有足夠玩家繼續。</span>");
        render();
        return false;
    }

    return true;
}

function startHumanAllInTest() {
    const label = "我每手 All-in";
    if (!canStartStandaloneHumanTest(label)) return;

    autoPlayMode = true;
    humanTestMode = "allin";
    humanTestModeLabel = label;
    markHumanTestModeStarted(humanTestMode, humanTestModeLabel);
    log("<span class='winText'>測試模式開始：我每手都會自動 All-in。</span>");

    resumeAutoControlAfterModeChange();
    render();
}

function startHumanChaosTest() {
    const label = "我亂玩";

    autoPlayMode = true;
    humanTestMode = "chaos";
    humanTestModeLabel = label;
    markHumanTestModeStarted(humanTestMode, humanTestModeLabel);
    log("<span class='winText'>測試模式開始：我會用亂玩策略自動行動。</span>");

    resumeAutoControlAfterModeChange();
    render();
}

function stopAutoPlay() {
    autoPlayMode = false;
    humanTestMode = "none";
    humanTestModeLabel = "";
    if (batchTestState.running) {
        batchTestState.running = false;
        batchTestState.finishedAt = Date.now();
    }
    log("<span class='bustLog'>自動測試停止。</span>");
    render();
}

function getHumanPlayerIndex() {
    return players.findIndex(p => p && p.isHuman);
}

function getHumanPlayer() {
    const idx = getHumanPlayerIndex();
    return idx >= 0 ? players[idx] : null;
}

function getChipLeaderIndexAmongActivePlayers() {
    let bestIndex = null;
    let bestChips = -1;
    for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (!p || p.chips <= 0) continue;
        if (p.chips > bestChips) {
            bestChips = p.chips;
            bestIndex = i;
        }
    }
    return bestIndex;
}

            communityRevealTimer = setTimeout(step, randomCommunityRevealDelay());
        }
    };

    communityRevealTimer = setTimeout(step, randomCommunityRevealDelay());
}


function clearOpeningDealTimers() {
    if (deckShuffleTimer) {
        clearTimeout(deckShuffleTimer);
        deckShuffleTimer = null;
    }
    if (holeDealTimer) {
        clearTimeout(holeDealTimer);
        holeDealTimer = null;
    }
    deckShuffleAnimationInProgress = false;
    holeDealAnimationInProgress = false;
    visualHoleCardCounts = {};
    lastDealtSeatIndex = null;
}

function randomHoleDealDelay() {
    return 210 + Math.floor(Math.random() * 91);
}

function renderCardBack(extraClass = "") {

function startOpeningShuffleAndDealAnimation(dealOrder, onDone) {
    clearOpeningDealTimers();
    deckShuffleAnimationInProgress = true;
    holeDealAnimationInProgress = false;
    visualHoleCardCounts = {};
    lastDealtSeatIndex = null;

    if (!FORMAL_RELEASE) autoLogEntries.push({
        type: "openingShuffleAnimation",
        handNumber,
        dealerIndex,
        dealOrder: dealOrder.map(idx => ({ index: idx, name: players[idx] ? players[idx].name : "" })),
        timestamp: Date.now()
    });

    render();

    deckShuffleTimer = setTimeout(() => {
        deckShuffleTimer = null;
        deckShuffleAnimationInProgress = false;
        startHoleDealAnimation(dealOrder, onDone);
    }, 1050 + Math.floor(Math.random() * 301));
}

function startHoleDealAnimation(dealOrder, onDone) {
    holeDealAnimationInProgress = true;
    visualHoleCardCounts = {};
    lastDealtSeatIndex = null;

    const sequence = [];
    for (let r = 0; r < 2; r++) {
        for (const idx of dealOrder) sequence.push(idx);
    }

    let cursor = 0;
    const step = () => {
        if (!handInProgress) {
            clearOpeningDealTimers();
            return;
        }

        if (cursor >= sequence.length) {
            holeDealTimer = setTimeout(() => {
                holeDealTimer = null;
                holeDealAnimationInProgress = false;
                lastDealtSeatIndex = null;
                visualHoleCardCounts = {};
                render();
                if (typeof onDone === "function") onDone();
            }, 260);
            return;
        }

        const idx = sequence[cursor];
        const p = players[idx];
        if (p && p.chips > 0 && p.hole.length < 2) {
            p.hole.push(deck.pop());
            visualHoleCardCounts[idx] = Math.min(2, (visualHoleCardCounts[idx] || 0) + 1);
            lastDealtSeatIndex = idx;
        }

        cursor++;
        render();
        holeDealTimer = setTimeout(step, randomHoleDealDelay());
    };

    render();
    holeDealTimer = setTimeout(step, randomHoleDealDelay());
}

function stopStandaloneHumanTestAfterBust() {

function maybeStopHumanTestAfterHumanBust() {
    const human = getHumanPlayer();
    if (!human || human.chips > 0) return false;

    if (batchTestState.running) {
        if (batchTestState.currentHumanBustHand === null) {
            batchTestState.currentHumanBustHand = handNumber;
        }

function handleBatchHumanBust() {

    const leaderIndex = getChipLeaderIndexAmongActivePlayers();
    const summary = collectBatchGameSummary(leaderIndex, "human_bust");
    batchTestState.results.push(summary);
    batchTestState.completedGames++;

    const leaderText = summary.winnerName ? "目前領先者：" + summary.winnerName + "。" : "";
    log("<span class='winText'>批量測試第 " + summary.gameNumber + " 場完成：你在第 " + summary.humanBustHand + " 手破產。" + leaderText + getBatchSummaryText() + "</span>");

function collectBatchGameSummary(winnerIndex, endReason = "tournament_end") {
    const humanIndex = players.findIndex(p => p.isHuman);
    const human = players[humanIndex];
    const winner = players[winnerIndex];
    const elapsedMs = batchTestState.currentGameStartedAt ? Date.now() - batchTestState.currentGameStartedAt : null;

    return {
        gameNumber: batchTestState.completedGames + 1,
        mode: batchTestState.mode,
        label: batchTestState.label,
        handNumber,
        winnerIndex,
        winnerName: winner ? winner.name : null,
        winnerIsHuman: !!(winner && winner.isHuman),
        winnerProfile: winner && winner.profile ? winner.profile.name : null,
        winnerChips: winner ? winner.chips : 0,
        endReason,
        endedByHumanBust: endReason === "human_bust",
        humanChips: human ? human.chips : 0,
        humanBankrupt: human ? human.chips <= 0 : true,
        humanBustHand: batchTestState.currentHumanBustHand,
        humanHandsPlayed: human ? human.stats.handsPlayed : 0,
        humanVPIP: human ? human.stats.vpipHands : 0,
        humanPFR: human ? human.stats.pfrHands : 0,
        humanAllInCount: human ? human.stats.allInCount : 0,
        humanPostflopAggressiveActions: human ? human.stats.postflopAggressiveActions : 0,
        humanPostflopPassiveActions: human ? human.stats.postflopPassiveActions : 0,
        humanFoldCount: human ? human.stats.foldCount : 0,
        elapsedMs
    };
}

function average(nums) {
    const arr = nums.filter(x => Number.isFinite(x));
    if (arr.length === 0) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
}

function getChampionCounts() {
    const counts = {};
    for (const r of batchTestState.results) {
        const key = r.winnerIsHuman ? "你" : (r.endedByHumanBust ? "AI（你破產）" : (r.winnerProfile || "AI"));
        counts[key] = (counts[key] || 0) + 1;
    }
    return counts;
}

function getBatchSummaryObject() {
    const results = batchTestState.results;
    const completed = results.length;
    const humanWins = results.filter(r => r.winnerIsHuman).length;
    const humanLosses = completed - humanWins;
    const bustHands = results.filter(r => r.humanBankrupt).map(r => r.humanBustHand || r.humanHandsPlayed || r.handNumber);

    return {
        mode: batchTestState.mode,
        label: batchTestState.label,
        targetGames: batchTestState.targetGames,
        completedGames: completed,
        humanWins,
        humanLosses,
        humanWinRate: completed ? humanWins / completed : 0,
        averageTournamentHands: average(results.map(r => r.handNumber)),
        averageHumanBustHand: average(bustHands),
        averageHumanAllIns: average(results.map(r => r.humanAllInCount)),
        averageHumanVPIP: average(results.map(r => r.humanVPIP)),
        averageHumanPFR: average(results.map(r => r.humanPFR)),
        championCounts: getChampionCounts(),
        startedAt: batchTestState.startedAt ? new Date(batchTestState.startedAt).toISOString() : null,
        finishedAt: batchTestState.finishedAt ? new Date(batchTestState.finishedAt).toISOString() : null
    };
}

function getBatchSummaryText() {
    const s = getBatchSummaryObject();
    if (s.completedGames === 0) return "尚未完成任何場次。";

    const winRate = Math.round(s.humanWinRate * 1000) / 10;
    const avgHands = s.averageTournamentHands === null ? "-" : Number(s.averageTournamentHands.toFixed(1));
    const avgBust = s.averageHumanBustHand === null ? "-" : Number(s.averageHumanBustHand.toFixed(1));
    const avgAllIn = s.averageHumanAllIns === null ? "-" : Number(s.averageHumanAllIns.toFixed(1));
    const champs = Object.entries(s.championCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => k + "×" + v)
        .join("，");

    return "完成 " + s.completedGames + " / " + s.targetGames + " 場｜你勝率 " + winRate + "%｜平均局數 " + avgHands + "｜平均破產手數 " + avgBust + "｜平均 All-in " + avgAllIn + "｜冠軍分布：" + champs + "。";
}

function formatBatchMetric(value, digits = 1) {
    if (value === null || value === undefined || !Number.isFinite(value)) return "-";
    if (digits <= 0) return String(Math.round(value));
    return Number(value.toFixed(digits)).toString();
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function startGameWithSeatAnimation() {
    const count = parseInt(document.getElementById("playerCount").value);
    const chips = parseInt(document.getElementById("startChips").value);
    
    if (count < 2 || count > 9) {
        alert("德州撲克合法人數為 2 到 9 人。");
        return;
    }

    if (chips < 200) {
        alert("起始籌碼太少，至少要 $200。");
        return;
    }

    initialChips = chips;
    lastBlindSmallBlind = null;
    lastBlindBigBlind = null;

    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("log").innerHTML = "";

    updateStageScale();

    createInitialPlayers(count, chips);

    board = [];
    pot = 0;
    street = "preflop";
    handInProgress = false;
    waitingForHuman = false;
    isAssigningSeats = true;
    hasHandStarted = false;
    handNumber = 0;
    tournamentGameOver = false;
    showAllHoleCards = false;
    lastBlindSmallBlind = null;
    lastBlindBigBlind = null;
    hideHandEndOverlay();

    document.getElementById("seatAssignOverlay").style.display = "block";

    log("正在分配座位。你固定在最下方。");

    render();

    let shuffleCount = 0;
    seatShuffleTimer = setInterval(() => {
        randomizeAiSeatOrder();
        shuffleCount++;
        render();

        if (shuffleCount >= 18) {
            finishSeatAssignment();
        }
    }, 130);
}

function createInitialPlayers(count, chips) {
    const aiNames = generateAiNames(count - 1);

    const human = createPlayer("你", true, chips, "human", null);
    const aiPlayers = aiNames.map(name => {
        return createPlayer(name, false, chips, "gto", randomAiProfile());
    });

    shuffle(aiPlayers);
    players = [human].concat(aiPlayers);
}

function createPlayer(name, isHuman, chips, aiType = "gto", profile = null) {
    return {
        name,
        isHuman,
        aiType,
        profile,
        chips,
        hole: [],
        folded: false,
        allIn: false,
        currentBet: 0,
        totalBet: 0,
        acted: false,
        lastAction: "",
        revealed: false,
        showdownResult: null,
        eliminatedLogged: false,
        stats: {
            handsPlayed: 0,
            vpipHands: 0,
            pfrHands: 0,
            postflopAggressiveActions: 0,
            postflopPassiveActions: 0,
            postflopChecks: 0,
            foldCount: 0,
            allInCount: 0
        },
        opponentModel: createOpponentModel(),
        flags: {
            dealtThisHand: false,
            voluntarilyPutMoneyInPotThisHand: false,
            preflopRaisedThisHand: false,
            statsFinalizedForThisHand: false
        }
    };
}

function randomAiProfile() {
    const profiles = [aiProfiles.TAG, aiProfiles.LAG, aiProfiles.Station, aiProfiles.Nit];
    return profiles[Math.floor(Math.random() * profiles.length)];
}

function generateAiNames(aiCount) {
    const pool = allAiNames.slice();
    shuffle(pool);
    return pool.slice(0, aiCount);
}

function randomizeAiSeatOrder() {
    const human = players.find(p => p.isHuman);
    const aiPlayers = players.filter(p => !p.isHuman);
    shuffle(aiPlayers);
    players = [human].concat(aiPlayers);
}

function finishSeatAssignment() {
    clearInterval(seatShuffleTimer);
    seatShuffleTimer = null;

    randomizeAiSeatOrder();

    isAssigningSeats = false;
    document.getElementById("seatAssignOverlay").style.display = "none";

    render();

    log("座位分配完成。正式座位：" + players.map((p, i) => "座位" + i + "：" + p.name).join("，") + "。");

    setTimeout(() => {
        startNewHand();
    }, 500);
}

function totalTournamentChips() {
    return players.reduce((sum, p) => sum + Math.max(0, Number(p.chips) || 0), 0);
}

function expectedTournamentChips() {
    return players.length * initialChips;
}

function logChipConservationCheck(context) {
    if (!players || players.length === 0) return true;

    const total = totalTournamentChips();
    const expected = expectedTournamentChips();
    const ok = total === expected;

    if (!FORMAL_RELEASE) autoLogEntries.push({
        type: "chipConservationCheck",
        handNumber,
        street,
        context,
        totalChips: total,
        expectedChips: expected,
        difference: total - expected,
        ok,
        timestamp: Date.now()
    });

    if (!ok) {
        log("<span class='bustLog'>籌碼守恆警告：" + context + "，目前總籌碼 " + money(total) + "，應為 " + money(expected) + "，差額 " + money(total - expected) + "。</span>");
    }

    return ok;
}

function clearPendingAiAction(reason = "clear") {
    clearTurnWatchdog();
    pendingAiActionToken++;
    pendingAiActionIndex = null;
    pendingAiActionHandId = 0;
}

function guardStartNewHandWhileCurrentHandActive() {
    if (!handInProgress) return false;

    if (!FORMAL_RELEASE) autoLogEntries.push({
        type: "abortedHandGuard",
        handNumber,
        street,
        pot,
        currentBet,
        actionIndex,
        pendingAiActionIndex,
        pendingAiActionToken,
        handLifecycleId,
        message: "startNewHand blocked while current hand is still in progress",
        timestamp: Date.now()
    });

    log("<span class='bustLog'>防止跳手：第 " + handNumber + " 局尚未結算，系統已阻止直接開始下一局。</span>");

    if (!waitingForHuman) {
        setTimeout(proceedTurn, 0);
    }

    render();
    return true;
}

function startNewHand() {
    if (isAssigningSeats || tournamentGameOver) return;

    if (guardStartNewHandWhileCurrentHandActive()) return;

    hideHandEndOverlay();

    if (checkTournamentGameOver()) {
        return;
    }

    clearPendingAiAction("start-new-hand");
    handLifecycleId++;

    hasHandStarted = true;
    handNumber++;
    showAllHoleCards = false;
    handActionHistory = [];
    v34CFlopCBetTracker = null;
    statsFinalizedThisHand = false;

    handInProgress = true;
    waitingForHuman = false;
    clearOpeningDealTimers();
    clearCommunityRevealTimer();
    board = [];
    visibleBoardCount = 0;
    pot = 0;
    deck = createDeck();
    shuffle(deck);

    for (const p of players) {
        p.hole = [];
        p.folded = p.chips <= 0;
        p.allIn = false;
        p.currentBet = 0;
        p.totalBet = 0;
        p.acted = false;
        p.lastAction = "";
        p.revealed = false;
        p.showdownResult = null;
        p.flags = {
            dealtThisHand: false,
            voluntarilyPutMoneyInPotThisHand: false,
            preflopRaisedThisHand: false,
            statsFinalizedForThisHand: false
        };

        if (p.chips <= 0) {
            p.lastAction = "破產";
            p.folded = true;
            p.allIn = false;
        }
    }

    moveDealerToActivePlayer();

    street = "preflop";
    const blindChanged = updateBlindByRemainingPlayers();
    currentBet = bigBlind;
    minRaise = bigBlind;
    lastFullRaiseTo = bigBlind;

    const sbIndex = getSmallBlindIndex();
    const bbIndex = getBigBlindIndex();
    const dealOrder = getActivePlayerIndicesInDealOrder();

    log("第 " + handNumber + " 局開始。莊家是 " + players[dealerIndex].name + "。");
    if (blindChanged) {
        log("盲注調整：小盲 " + money(smallBlind) + "，大盲 " + money(bigBlind) + "。");
    }

    render();

    startOpeningShuffleAndDealAnimation(dealOrder, () => {
        if (!handInProgress) return;

        for (const p of players) {
            if (p.hole.length === 2) {
                p.flags.dealtThisHand = true;
                p.stats.handsPlayed++;
                const model = ensureOpponentModel(players.indexOf(p));
                model.handsSeen = p.stats.handsPlayed;
            }
        }

        recordHoleCardsSnapshot("hand-start-after-deal");

        postBlind(sbIndex, smallBlind, "小盲");
        postBlind(bbIndex, bigBlind, "大盲");

        actionIndex = nextPlayableIndex(bbIndex);
        render();
        proceedTurn();
    });
}

function getActivePlayerIndicesInDealOrder() {
    const indices = [];

    for (let i = 1; i <= players.length; i++) {
        const idx = (dealerIndex + i) % players.length;
        if (players[idx].chips > 0) {
            indices.push(idx);
        }
    }

    return indices;
}

function getHandPlayerIndicesInSeatOrder() {
    const indices = [];

    for (let i = 0; i < players.length; i++) {
        if (players[i].hole.length === 2) {
            indices.push(i);
        }
    }

    return indices;
}

function getPositionCategory(index) {
    const activeIndices = getHandPlayerIndicesInSeatOrder();
    const activeCount = activeIndices.length;

    if (activeCount <= 3) return "late";

    const sb = getSmallBlindIndex();
    const bb = getBigBlindIndex();

    if (index === sb || index === bb) return "blinds";

    const order = [];
    let curr = (bb + 1) % players.length;

    while (order.length < activeCount) {
        if (activeIndices.includes(curr)) {
            order.push(curr);
        }
        curr = (curr + 1) % players.length;
    }

    const pos = order.indexOf(index);

    if (pos < Math.floor(activeCount / 3)) return "early";
    if (pos < Math.floor(activeCount * 2 / 3)) return "middle";
    return "late";
}

function rankToNotation(rank) {
    if (rank === 14) return "A";
    if (rank === 13) return "K";
    if (rank === 12) return "Q";
    if (rank === 11) return "J";
    if (rank === 10) return "T";
    return String(rank);
}

function getHandNotation(card1, card2) {
    const high = card1.rank >= card2.rank ? card1 : card2;
    const low = card1.rank >= card2.rank ? card2 : card1;

    const r1 = rankToNotation(high.rank);
    const r2 = rankToNotation(low.rank);

    if (high.rank === low.rank) {
        return r1 + r2;
    }

    return r1 + r2 + (card1.suit === card2.suit ? "s" : "o");
}

function getPreflopStrength(notation) {
    if (PreflopStrategy.premium.includes(notation)) return 3;
    if (PreflopStrategy.playable.includes(notation)) return 2;
    if (PreflopStrategy.speculative.includes(notation)) return 1;
    return 0;
}


function getHeadsUpNotationStrength(notation, baseStrength = 0) {
    let strength = baseStrength;

    const high = rangeRankValue(notation[0]);
    const low = notation.length === 2 ? high : rangeRankValue(notation[1]);
    const suited = notation.endsWith("s");
    const pocketPair = notation.length === 2;
    const gap = pocketPair ? 0 : high - low;

    // Heads-up 時牌值大幅上升。不能把 A8s、K2s、Q3s、T9o 這些牌當成九人桌垃圾牌。
    if (pocketPair) {
        strength = Math.max(strength, high >= 9 ? 3 : high >= 5 ? 2 : 1);
    }

    if (high === 14) {
        strength = Math.max(strength, low >= 8 || suited ? 2 : 1);
    } else if (high === 13) {
        strength = Math.max(strength, low >= 9 || suited ? 2 : 1);
    } else if (high === 12) {
        strength = Math.max(strength, low >= 10 || suited ? 2 : 1);
    } else if (high === 11) {
        strength = Math.max(strength, low >= 10 || suited ? 1 : strength);
    }

    if (!pocketPair) {
        if (gap === 1 && high >= 7) strength = Math.max(strength, 1);
        if (gap === 2 && suited && high >= 8) strength = Math.max(strength, 1);
        if (suited && high >= 9) strength = Math.max(strength, 1);
    }

    return Math.max(0, Math.min(3, strength));
}


function getPremiumReraiseTier(notation) {
    if (["AA", "KK"].includes(notation)) return "nut-premium";
    if (["QQ", "AKs", "AKo"].includes(notation)) return "premium";
    if (["JJ", "TT", "AQs", "AQo", "AJs", "KQs"].includes(notation)) return "strong";
    if (["KJs", "KQo", "QJs", "ATs", "AJo", "KTs", "QTs", "JTs"].includes(notation)) return "medium";
    return "weak";
}

function isNutPremiumReraiseTier(tier) {
    return tier === "nut-premium";
}

function isPremiumReraiseTier(tier) {
    return tier === "nut-premium" || tier === "premium";
}

function getDeepStackReraiseGuard(notation, strength, posCategory, activeCount, stackBB, toCall) {
    const tier = getPremiumReraiseTier(notation);
    const facingThreeBetOrMore = currentBet >= bigBlind * 5.5;
    const facingFourBetOrMore = currentBet >= bigBlind * 12;
    const deepFullRing = stackBB >= 40 && activeCount >= 6;
    const callCostRatio = toCall / Math.max(1, players[actionIndex] ? players[actionIndex].chips + players[actionIndex].currentBet : toCall);
    const suited = notation.endsWith("s");

    if (!deepFullRing || strength < 2) {
        return { block: false, action: null, reason: "not-deep-full-ring" };
    }

    if (tier === "nut-premium") {
        return { block: false, action: null, reason: "v27-nut-premium-can-reraise" };
    }

    // v27：QQ / AK 很強，但 full-ring 80–100BB 深碼面對 4-bet/5-bet 或多人已投入時，不能等同 AA/KK 無腦打光。
    if (tier === "premium") {
        if (facingFourBetOrMore) {
            return {
                block: true,
                action: callCostRatio <= 0.18 && activeCount <= 6 ? "call" : "fold",
                reason: "v27-control-qq-ak-vs-4bet-plus"
            };
        }
        if (facingThreeBetOrMore && stackBB >= 80 && activeCount >= 7) {
            return {
                block: true,
                action: callCostRatio <= 0.16 ? "call" : "fold",
                reason: "v27-flat-qq-ak-vs-deep-fullring-3bet"
            };
        }
        return { block: false, action: null, reason: "v27-premium-can-pressure" };
    }

    if (facingFourBetOrMore) {
        return { block: true, action: tier === "strong" && callCostRatio <= 0.12 ? "call" : "fold", reason: "v25-block-nonpremium-vs-4bet" };
    }

    if (facingThreeBetOrMore) {
        if (tier === "strong" && callCostRatio <= 0.10) {
            return { block: true, action: "call", reason: "v25-flat-strong-nonpremium-vs-3bet" };
        }
        if (tier === "medium" && suited && callCostRatio <= 0.07 && isLateOrBlind(posCategory)) {
            return { block: true, action: "call", reason: "v25-flat-suited-medium-vs-small-3bet" };
        }
        return { block: true, action: "fold", reason: "v25-fold-nonpremium-vs-3bet" };
    }

    return { block: false, action: null, reason: "open-or-single-raise" };
}

function isHeadsUpPlayableNotation(notation, strength) {
    const huStrength = getHeadsUpNotationStrength(notation, strength);
    const high = rangeRankValue(notation[0]);
    const low = notation.length === 2 ? high : rangeRankValue(notation[1]);
    const suited = notation.endsWith("s");
    const pocketPair = notation.length === 2;
    const gap = pocketPair ? 0 : high - low;

    return huStrength >= 1 ||
        pocketPair ||
        high === 14 ||
        high === 13 ||
        (high === 12 && low >= 7) ||
        (high === 11 && low >= 8) ||
        (suited && high >= 8) ||
        (gap <= 2 && high >= 7);
}


function getDynamicPreflopStrength(notation, posCategory, aliveCount) {
    let strength = getPreflopStrength(notation);

    const strongBroadways = ["AJs", "AJo", "KQs", "KQo", "KJs", "QJs"];
    const playableOffsuitAces = ["ATo", "A9o", "A8o", "A7o"];
    const weakOffsuitAces = ["A6o", "A5o", "A4o", "A3o", "A2o"];
    const weakOffsuitBroadways = ["KJo", "QJo", "KTo", "QTo", "JTo"];
    const offsuitConnectors = ["T9o", "98o", "87o", "76o"];
    const suitedGappers = ["J9s", "T8s", "97s", "86s", "75s", "64s", "Q9s", "K9s"];

    if (strongBroadways.includes(notation)) {
        strength = Math.max(strength, 2);

        // v25：KJs / KQo / QJs 這類位置加成牌不能在 9 人桌深碼時被升成 premium。
        // 它們可以 open、call，短桌時可以更主動，但不能因此進入 100BB 4-bet / 5-bet 打光邏輯。
        if (aliveCount <= 5) {
            strength = Math.max(strength, 3);
        }
    }

    if (playableOffsuitAces.includes(notation)) {
        if (isLateOrBlind(posCategory) || aliveCount <= 6) {
            strength = Math.max(strength, 1);
        }

        if (aliveCount <= 4) {
            strength = Math.max(strength, 2);
        }
    }

    if (weakOffsuitAces.includes(notation)) {
        if (isLateOrBlind(posCategory) || aliveCount <= 4) {
            strength = Math.max(strength, 1);
        }

        if (aliveCount <= 3) {
            strength = Math.max(strength, 2);
        }
    }

    if (weakOffsuitBroadways.includes(notation)) {
        if (isLateOrBlind(posCategory) || aliveCount <= 5) {
            strength = Math.max(strength, 1);
        }

        if (aliveCount <= 3) {
            strength = Math.max(strength, 2);
        }
    }

    if (offsuitConnectors.includes(notation)) {
        if (isLateOrBlind(posCategory) || aliveCount <= 4) {
            strength = Math.max(strength, 1);
        }
    }

    if (suitedGappers.includes(notation)) {
        if (isLateOrBlind(posCategory) || aliveCount <= 5) {
            strength = Math.max(strength, 1);
        }
    }

    if (aliveCount <= 3) {
        const huStrength = getHeadsUpNotationStrength(notation, strength);
        if (aliveCount <= 2) {
            strength = Math.max(strength, huStrength);
        } else {
            // v26：3 人桌也要比 full-ring 寬，但不直接套完整 heads-up 範圍。
            strength = Math.max(strength, Math.min(2, huStrength));
        }
    }

    return strength;
}


function isMarginalButPlayableZeroPreflop(notation, posCategory, aliveCount) {
    const high = rangeRankValue(notation[0]);
    const low = notation.length === 2 ? high : rangeRankValue(notation[1]);
    const suited = notation.endsWith("s");
    const pair = notation.length === 2;
    const gap = pair ? 0 : high - low;

    if (pair) return true;
    if (high === 14 && (suited || low >= 8 || aliveCount <= 5 || isLateOrBlind(posCategory))) return true;
    if (suited && high >= 13 && low >= 6) return true;
    if (suited && high >= 12 && low >= 8) return true;
    if (suited && gap <= 2 && high >= 8 && low >= 5) return true;
    if (!suited && gap <= 1 && high >= 10 && low >= 8 && (isLateOrBlind(posCategory) || aliveCount <= 5)) return true;
    if (!suited && high >= 13 && low >= 10 && (isLateOrBlind(posCategory) || aliveCount <= 5)) return true;

    return false;
}

function getStrengthZeroCheapCallProfileFactor(profile, posCategory, aliveCount, notation) {
    const name = profile ? profile.name : "";
    const lateOrBlind = isLateOrBlind(posCategory);
    const shortTable = aliveCount <= 6;
    const marginalPlayable = isMarginalButPlayableZeroPreflop(notation, posCategory, aliveCount);

    if (!lateOrBlind && !shortTable && !marginalPlayable) {
        return 0;
    }

    if (name === "跟注站") {
        if (lateOrBlind) return marginalPlayable ? 0.34 : 0.10;
        if (shortTable && marginalPlayable) return 0.24;
        return marginalPlayable ? 0.16 : 0;
    }

    if (name === "鬆凶型") {
        if (lateOrBlind && marginalPlayable) return 0.26;
        if (shortTable && marginalPlayable) return 0.16;
        return 0;
    }

    if (name === "緊凶型") {
        if (lateOrBlind && marginalPlayable) return 0.10;
        return 0;
    }

    if (name === "極緊型") {
        if (lateOrBlind && marginalPlayable && aliveCount <= 5) return 0.06;
        return 0;
    }

    return lateOrBlind && marginalPlayable ? 0.12 : 0;
}

function isTrashStrengthZeroOpenBlocked(notation, posCategory, aliveCount, stackBB, toCall) {
    const marginalPlayable = isMarginalButPlayableZeroPreflop(notation, posCategory, aliveCount);

    // v24: full-ring、深碼、無 ante 的 strength 0 不能只因 late/blinds 就 open raise。
    // 92o、J4s、T3o、K2o 這類牌可以在 heads-up/短桌另行處理，但不該在 9 人 100BB 亂偷。
    if (marginalPlayable) return false;
    if (aliveCount <= 4) return false;
    if (stackBB < 25) return false;
    if (toCall > bigBlind * 1.25) return false;

    return true;
}


function getNotationFeatureInfo(notation) {
    const high = rangeRankValue(notation[0]);
    const low = notation.length === 2 ? high : rangeRankValue(notation[1]);
    const suited = notation.endsWith("s");
    const pocketPair = notation.length === 2;
    const gap = pocketPair ? 0 : high - low;
    return {
        high,
        low,
        suited,
        pocketPair,
        gap,
        ace: high === 14,
        broadway: high >= 11 && low >= 10,
        suitedBroadway: suited && high >= 11 && low >= 10,
        suitedConnector: suited && gap <= 1 && high >= 7,
        suitedGapper: suited && gap <= 2 && high >= 8 && low >= 5,
        smallPair: pocketPair && high <= 6,
        mediumPair: pocketPair && high >= 7 && high <= 10,
        highPair: pocketPair && high >= 11
    };
}

function isPreflopPotUnopened() {
    return !handActionHistory.some(a => {
        if (a.street !== "preflop") return false;
        if (a.forcedBlind) return false;
        return a.action === "call" || a.action === "raise" || a.action === "bet";
    });
}

function countVoluntaryPreflopCallers() {
    const seen = new Set();
    for (const a of handActionHistory) {
        if (a.street !== "preflop" || a.forcedBlind) continue;
        if (a.action === "call") seen.add(a.playerIndex);
        if (a.action === "fold") seen.delete(a.playerIndex);
    }
    return seen.size;
}

function getHumanPostflopExploitInfo(index) {
    const human = players.find(p => p && p.isHuman);
    if (!human || human.chips <= 0 || human.folded || human.allIn) {
        return {
            active: false,
            vpip: 0,
            pfr: 0,
            postflopAggression: 0,
            foldRate: 0,
            loose: false,
            veryLoose: false,
            aggressive: false,
            overfolder: false,
            callingStation: false,
            valueFactor: 1,
            bluffFactor: 1,
            semiBluffFactor: 1,
            callFactor: 1
        };
    }

    const hands = Math.max(1, human.stats.handsPlayed || 0);
    const vpip = (human.stats.vpipHands || 0) / hands;
    const pfr = (human.stats.pfrHands || 0) / hands;
    const foldRate = (human.stats.foldCount || 0) / hands;
    const postTotal =
        (human.stats.postflopAggressiveActions || 0) +
        (human.stats.postflopPassiveActions || 0) +
        (human.stats.postflopChecks || 0);
    const postflopAggression = postTotal > 0 ? (human.stats.postflopAggressiveActions || 0) / postTotal : 0;

    const loose = hands >= 8 && vpip >= 0.42;
    const veryLoose = hands >= 12 && vpip >= 0.58;
    const aggressive = postTotal >= 6 && postflopAggression >= 0.45;
    const overfolder = hands >= 10 && foldRate >= 0.55 && vpip <= 0.45;
    const callingStation = hands >= 10 && vpip >= 0.48 && postflopAggression < 0.28 && foldRate < 0.45;

    return {
        active: true,
        vpip,
        pfr,
        postflopAggression,
        foldRate,
        loose,
        veryLoose,
        aggressive,
        overfolder,
        callingStation,
        valueFactor: veryLoose || callingStation ? 1.28 : loose ? 1.15 : 1,
        bluffFactor: overfolder ? 1.35 : callingStation ? 0.62 : veryLoose ? 0.75 : 1,
        semiBluffFactor: aggressive || overfolder ? 1.16 : callingStation ? 0.85 : 1,
        callFactor: aggressive ? 0.88 : isNaN(postflopAggression) ? 1 : 1
    };
}

function getTournamentPressurePlan(index, notation, strength, posCategory, stack, profile, aggression, tightness, toCall) {
    const p = players[index];
    const features = getNotationFeatureInfo(notation);
    const unopened = isPreflopPotUnopened();
    const facingRaise = currentBet > bigBlind;
    const active = activePlayerCount();
    const lateOrBlind = isLateOrBlind(posCategory);
    const veryShortStacks = countVeryShortStacks(index);
    const voluntaryCallers = countVoluntaryPreflopCallers();
    const stackBB = p.chips / Math.max(1, bigBlind);
    const r = Math.random();

    if (!facingRaise && unopened && lateOrBlind) {
        if (stackBB <= 18 && stackBB > 8) {
            const shortTablePush =
                active <= 4 &&
                (strength >= 1 || features.ace || features.pocketPair || features.broadway || features.suitedBroadway || features.suitedConnector);
            const normalShortPush =
                strength >= 2 || features.highPair || (features.ace && features.low >= 9) || features.suitedBroadway;

            if (normalShortPush && r < 0.42 + aggression * 0.24) {
                return { action: "jam", reason: "v26-short-open-jam" };
            }

            if (shortTablePush && r < 0.34 + aggression * 0.22) {
                return { action: "jam", reason: "v26-short-table-open-jam" };
            }
        }

        if ((stack.type === "chipLeader" || stack.type === "big") && veryShortStacks >= 1) {
            if (strength >= 2 || (strength === 1 && (features.ace || features.broadway || features.pocketPair))) {
                if (r < 0.72 + aggression * 0.12) return { action: "raise", reason: "v23-big-stack-pressure-open" };
            }

            if (strength === 0 && isMarginalButPlayableZeroPreflop(notation, posCategory, active) && active <= 6 && r < 0.14 + aggression * 0.08) {
                return { action: "raise", reason: "v24-big-stack-selective-steal" };
            }
        }

        if (active <= 4 && strength >= 1 && r < 0.58 + aggression * 0.14) {
            return { action: "raise", reason: "v23-short-table-open-steal" };
        }
    }

    if (!facingRaise && voluntaryCallers >= 1 && lateOrBlind) {
        if (strength >= 2 && r < 0.55 + aggression * 0.18) return { action: "raise", reason: "v23-isolation-raise" };
        if (profile && profile.name === "鬆凶型" && strength === 1 && (features.ace || features.broadway || features.pocketPair) && r < 0.28 + aggression * 0.12) {
            return { action: "raise", reason: "v23-loose-aggressive-isolation" };
        }
    }

    if (facingRaise && (stack.type === "chipLeader" || stack.type === "big") && currentBet <= bigBlind * 3.2 && lateOrBlind) {
        if (strength >= 3 && r < 0.88) return { action: "threebet", reason: "v23-big-stack-value-3bet" };
        if (strength === 2 && (features.ace || features.broadway || features.highPair) && r < 0.32 + aggression * 0.18) {
            return { action: "threebet", reason: "v23-big-stack-pressure-3bet" };
        }
    }

    return { action: null, reason: "none" };
}

function buildAllStartingHandNotations() {
    const list = [];

    for (let i = 0; i < rangeRankSymbols.length; i++) {
        const high = rangeRankSymbols[i];
        list.push(high + high);

        for (let j = i + 1; j < rangeRankSymbols.length; j++) {
            const low = rangeRankSymbols[j];
            list.push(high + low + "s");
            list.push(high + low + "o");
        }
    }

    return list;
}

function rangeRankValue(symbol) {
    if (symbol === "A") return 14;
    if (symbol === "K") return 13;
    if (symbol === "Q") return 12;
    if (symbol === "J") return 11;
    if (symbol === "T") return 10;
    return parseInt(symbol, 10);
}

const explicitStartingHandRanking = [
    "AA", "KK", "QQ", "AKs", "JJ", "AQs", "KQs", "AKo", "TT", "AJs",
    "KJs", "QJs", "JTs", "99", "AQo", "ATs", "KTs", "QTs", "T9s", "88",
    "AJo", "KQo", "A9s", "J9s", "98s", "77", "A8s", "K9s", "T8s", "87s",
    "A7s", "KJo", "QJo", "A5s", "A6s", "Q9s", "J8s", "76s", "66", "ATo",
    "A4s", "K8s", "T7s", "97s", "65s", "55", "A3s", "K7s", "Q8s", "86s",
    "54s", "A2s", "KTo", "QTo", "JTo", "44", "K6s", "J7s", "75s", "64s",
    "T9o", "33", "K5s", "Q7s", "T6s", "53s", "98o", "22", "K4s", "J9o",
    "Q9o", "87o", "K3s", "Q6s", "J6s", "43s", "K2s", "T8o", "76o", "Q5s"
];

function scoreStartingHandNotation(notation) {
    const explicitIndex = explicitStartingHandRanking.indexOf(notation);
    if (explicitIndex !== -1) return 10000 - explicitIndex * 20;

    const r1 = rangeRankValue(notation[0]);
    const r2 = rangeRankValue(notation[1]);
    const suited = notation.endsWith("s");
    const pair = notation.length === 2;
    const high = Math.max(r1, r2);
    const low = Math.min(r1, r2);
    const gap = high - low;

    if (pair) {
        return 7400 + high * 12;
    }

    let score = high * 18 + low * 8;

    if (suited) score += 35;
    if (gap === 1) score += 26;
    else if (gap === 2) score += 14;
    else if (gap === 3) score += 4;
    else if (gap >= 5) score -= 30;

    if (high === 14) score += 45;
    if (high >= 13 && low >= 10) score += 25;
    if (low <= 5 && high < 14) score -= 18;
    if (!suited && gap >= 4 && low <= 8) score -= 36;

    return score;
}

function getStartingHandRanking169() {
    if (cachedStartingHandRanking169) return cachedStartingHandRanking169;

    cachedStartingHandRanking169 = buildAllStartingHandNotations().sort((a, b) => {
        const scoreDiff = scoreStartingHandNotation(b) - scoreStartingHandNotation(a);
        if (scoreDiff !== 0) return scoreDiff;
        return a.localeCompare(b);
    });

    return cachedStartingHandRanking169;
}

function initializeDefaultRange() {
    const weights = {};
    for (const notation of getStartingHandRanking169()) {
        weights[notation] = 1.0;
    }
    return weights;
}

function getPreflopActionSummary(opponentIndex) {
    const actions = handActionHistory.filter(a => {
        return a.playerIndex === opponentIndex && a.street === "preflop";
    });

    if (actions.some(a => a.action === "fold")) return "folded";
    if (actions.some(a => a.action === "bet" || a.action === "raise")) return "raised";
    if (actions.some(a => a.action === "call" && !a.forcedBlind)) return "called";
    if (actions.some(a => a.action === "check")) return "checkedBlind";
    if (actions.some(a => a.action === "smallBlind" || a.action === "bigBlind")) return "onlyBlind";
    return "none";
}

function getProfilePreflopDefaults(profile) {
    if (!profile) return { vpip: 0.24, pfr: 0.16 };

    if (profile.name === "鬆凶型") return { vpip: 0.38, pfr: 0.27 };
    if (profile.name === "跟注站") return { vpip: 0.46, pfr: 0.09 };
    if (profile.name === "極緊型") return { vpip: 0.15, pfr: 0.10 };
    return { vpip: 0.24, pfr: 0.17 };
}

function getEstimatedPreflopRates(opponentIndex) {
    const opp = players[opponentIndex];
    const defaults = getProfilePreflopDefaults(opp.profile);
    const hands = Math.max(0, opp.stats.handsPlayed || 0);
    const sampleWeight = Math.min(1, hands / 50);

    const realVpip = hands > 0 ? opp.stats.vpipHands / hands : defaults.vpip;
    const realPfr = hands > 0 ? opp.stats.pfrHands / hands : defaults.pfr;

    let vpip = realVpip * sampleWeight + defaults.vpip * (1 - sampleWeight);
    let pfr = realPfr * sampleWeight + defaults.pfr * (1 - sampleWeight);

    vpip = Math.max(0.08, Math.min(0.65, vpip));
    pfr = Math.max(0.03, Math.min(vpip * 0.95, pfr));

    return { vpip, pfr, sampleWeight, hands };
}

function isPremiumNotation(notation) {
    return ["AA", "KK", "QQ", "JJ", "AKs", "AKo"].includes(notation);
}

function isSpeculativeNotation(notation) {
    if (notation.length === 2) {
        const rank = rangeRankValue(notation[0]);
        return rank <= 9;
    }

    const high = rangeRankValue(notation[0]);
    const low = rangeRankValue(notation[1]);
    const gap = high - low;
    const suited = notation.endsWith("s");

    return suited && gap <= 3 && high <= 12 && low >= 4;
}

function applyPreflopStatsFilter(weights, opponentIndex) {
    const actionSummary = getPreflopActionSummary(opponentIndex);

    if (actionSummary === "folded") {
        for (const key of Object.keys(weights)) weights[key] = 0;
        return weights;
    }

    const ranking = getStartingHandRanking169();
    const { vpip, pfr } = getEstimatedPreflopRates(opponentIndex);
    const pfrThreshold = Math.max(1, Math.ceil(ranking.length * pfr));
    const vpipThreshold = Math.max(pfrThreshold + 1, Math.ceil(ranking.length * vpip));
    const premiumThreshold = Math.max(5, Math.ceil(ranking.length * 0.05));

    for (let i = 0; i < ranking.length; i++) {
        const notation = ranking[i];
        const rank = i + 1;
        let weight = 1.0;

        if (actionSummary === "raised") {
            if (rank <= pfrThreshold) weight = 1.0;
            else if (rank <= vpipThreshold) weight = 0.25;
            else weight = isSpeculativeNotation(notation) ? 0.10 : 0.04;
        } else if (actionSummary === "called") {
            if (rank <= premiumThreshold || isPremiumNotation(notation)) weight = 0.25;
            else if (rank <= vpipThreshold) weight = 1.0;
            else weight = isSpeculativeNotation(notation) ? 0.28 : 0.05;
        } else if (actionSummary === "checkedBlind" || actionSummary === "onlyBlind") {
            if (rank <= premiumThreshold || isPremiumNotation(notation)) weight = 0.15;
            else if (rank <= pfrThreshold) weight = 0.35;
            else if (rank <= vpipThreshold) weight = 0.65;
            else weight = isSpeculativeNotation(notation) ? 0.55 : 0.30;
        } else {
            if (rank <= pfrThreshold) weight = 0.80;
            else if (rank <= vpipThreshold) weight = 0.70;
            else weight = 0.35;
        }

        weights[notation] = weight;
    }

    return weights;
}

function getFullDeckForRange() {
    const suits = ["S", "H", "D", "C"];
    const cards = [];

    for (const suit of suits) {
        for (let rank = 2; rank <= 14; rank++) {
            cards.push({ rank, suit });
        }
    }

    return cards;
}

function buildCombosForNotation(notation, blockedCards = []) {
    const blocked = new Set(blockedCards.map(c => c.rank + c.suit));
    const deck = getFullDeckForRange().filter(c => !blocked.has(c.rank + c.suit));
    const combos = [];

    for (let i = 0; i < deck.length; i++) {
        for (let j = i + 1; j < deck.length; j++) {
            if (getHandNotation(deck[i], deck[j]) === notation) {
                combos.push([deck[i], deck[j]]);
            }
        }
    }

    return combos;
}

const rangeBoardCache = new Map();

function getRangeBoardCacheKey(notation, boardCards) {
    return notation + "|" + boardCards.map(c => c.rank + c.suit).join("-");
}

function classifyNotationOnBoard(notation, boardCards) {
    if (!boardCards || boardCards.length < 3) {
        return { strong: 0, medium: 0, draw: 0, air: 1 };
    }

    const cacheKey = getRangeBoardCacheKey(notation, boardCards);
    if (rangeBoardCache.has(cacheKey)) return rangeBoardCache.get(cacheKey);

    const combos = buildCombosForNotation(notation, boardCards);

    if (combos.length === 0) {
        const emptyResult = { strong: 0, medium: 0, draw: 0, air: 0 };
        rangeBoardCache.set(cacheKey, emptyResult);
        return emptyResult;
    }

    let strong = 0;
    let medium = 0;
    let draw = 0;
    let air = 0;

    for (const hole of combos) {
        const info = analyzeHeroBoardInteraction(hole, boardCards);

        if (info.hasNutLikeMade || info.hasEffectiveStrongMade || info.isRealTwoPair || info.hasOverPair) {
            strong++;
        } else if (info.hasTopPair || info.hasPair || info.isBoardPairedWeakTwoPair || info.isBoardTripsOnly || info.isWeakOneCardFlush || info.isOneCardStraight) {
            medium++;
        } else if (info.hasFlushDraw || info.hasOpenEndedStraightDraw || info.hasGutshot || info.hasComboDraw || info.hasOvercards) {
            draw++;
        } else {
            air++;
        }
    }

    const total = combos.length;
    const result = {
        strong: strong / total,
        medium: medium / total,
        draw: draw / total,
        air: air / total
    };

    rangeBoardCache.set(cacheKey, result);

    if (rangeBoardCache.size > 1200) {
        rangeBoardCache.clear();
    }

    return result;
}

function getPostflopAggressionEstimate(player) {
    const aggressive = player.stats.postflopAggressiveActions || 0;
    const passive = player.stats.postflopPassiveActions || 0;
    const checks = player.stats.postflopChecks || 0;
    const total = aggressive + passive + checks;

    const profileDefault = player.profile && player.profile.name === "鬆凶型" ? 0.55 :
        player.profile && player.profile.name === "跟注站" ? 0.25 :
        player.profile && player.profile.name === "極緊型" ? 0.22 : 0.38;

    if (total <= 0) return profileDefault;

    const sampleWeight = Math.min(1, total / 30);
    const realRate = aggressive / total;
    return realRate * sampleWeight + profileDefault * (1 - sampleWeight);
}

function applyPostflopHistoryFilter(weights, opponentIndex) {
    const opponent = players[opponentIndex];
    const actions = handActionHistory.filter(a => {
        return a.playerIndex === opponentIndex && a.street !== "preflop";
    });

    if (actions.length === 0) return weights;

    const aggressionRate = getPostflopAggressionEstimate(opponent);
    const isLag = opponent.profile && opponent.profile.name === "鬆凶型";
    const isStation = opponent.profile && opponent.profile.name === "跟注站";
    const isNit = opponent.profile && opponent.profile.name === "極緊型";

    for (const action of actions) {
        const boardAtAction = action.boardSnapshot || [];
        if (boardAtAction.length < 3) continue;

        for (const notation of Object.keys(weights)) {
            if (weights[notation] <= 0) continue;

            const cls = classifyNotationOnBoard(notation, boardAtAction);
            let multiplier = 1.0;

            if (action.action === "bet" || action.action === "raise") {
                const bluffShare = isLag ? 0.55 : isNit ? 0.18 : 0.32;
                multiplier =
                    cls.strong * (1.35 + aggressionRate * 0.30) +
                    cls.draw * (1.05 + aggressionRate * 0.40) +
                    cls.medium * 0.78 +
                    cls.air * bluffShare;
            } else if (action.action === "call") {
                multiplier =
                    cls.strong * (isStation ? 1.05 : 0.82) +
                    cls.medium * (isStation ? 1.28 : 1.12) +
                    cls.draw * 1.22 +
                    cls.air * 0.24;
            } else if (action.action === "check") {
                // Check 不等於弱。避免只因對手過牌，就把強牌與聽牌權重削得太低。
                const strongCheckWeight = isNit ? 0.86 : isLag ? 0.94 : 0.90;
                multiplier =
                    cls.strong * strongCheckWeight +
                    cls.medium * 1.00 +
                    cls.draw * 0.98 +
                    cls.air * 1.06;
            } else if (action.action === "fold") {
                multiplier = 0.0;
            }

            if (!Number.isFinite(multiplier)) multiplier = 1.0;

            weights[notation] *= Math.max(0.03, Math.min(1.75, multiplier));
            weights[notation] = Math.max(0, Math.min(2.5, weights[notation]));
        }
    }

    return weights;
}

function estimateOpponentRange(opponentIndex) {
    const weights = initializeDefaultRange();
    applyPreflopStatsFilter(weights, opponentIndex);
    applyPostflopHistoryFilter(weights, opponentIndex);
    return weights;
}

function getTopRangeNotations(rangeWeights, limit = 12) {
    return Object.entries(rangeWeights)
        .filter(([, weight]) => weight > 0)
        .sort((a, b) => {
            if (b[1] !== a[1]) {
                return b[1] - a[1];
            }
            return scoreStartingHandNotation(b[0]) - scoreStartingHandNotation(a[0]);
        })
        .slice(0, limit)
        .map(([notation, weight]) => notation + ":" + weight.toFixed(2));
}

function getAverageStack() {
    const alive = players.filter(p => p.chips > 0);
    if (alive.length === 0) return 0;
    return alive.reduce((sum, p) => sum + p.chips, 0) / alive.length;
}

function getBiggestStackIndex() {
    let bestIndex = -1;
    let bestChips = -1;

    for (let i = 0; i < players.length; i++) {
        if (players[i].chips > bestChips) {
            bestChips = players[i].chips;
            bestIndex = i;
        }
    }

    return bestIndex;
}

function getEffectiveStackBB(index) {
    const p = players[index];
    const opponentStacks = players
        .filter((x, i) => i !== index && x.chips > 0 && !x.folded)
        .map(x => x.chips);

    if (opponentStacks.length === 0) return p.chips / bigBlind;

    const largestOpponentStack = Math.max(...opponentStacks);
    return Math.min(p.chips, largestOpponentStack) / bigBlind;
}

function getStackProfile(index) {
    const p = players[index];
    const avg = getAverageStack();
    const stackBB = p.chips / bigBlind;
    const effectiveBB = getEffectiveStackBB(index);
    const isLeader = index === getBiggestStackIndex();

    if (stackBB <= 8) return { type: "desperate", stackBB, effectiveBB, isLeader };
    if (stackBB <= 15) return { type: "short", stackBB, effectiveBB, isLeader };
    if (avg > 0 && p.chips >= avg * 2.0) return { type: "chipLeader", stackBB, effectiveBB, isLeader: true };
    if (avg > 0 && p.chips >= avg * 1.35) return { type: "big", stackBB, effectiveBB, isLeader };
    if (avg > 0 && p.chips <= avg * 0.65) return { type: "mediumShort", stackBB, effectiveBB, isLeader };
    return { type: "normal", stackBB, effectiveBB, isLeader };
}

function countVeryShortStacks(excludeIndex = -1) {
    return players.filter((p, i) => {
        return i !== excludeIndex && p.chips > 0 && p.chips <= bigBlind * 8;
    }).length;
}

function isLateOrBlind(posCategory) {
    return posCategory === "late" || posCategory === "blinds";
}

function openRaiseTo(posCategory, stackProfile, aggression) {
    let mult = 3.0;

    if (posCategory === "late") mult = 2.5;
    if (posCategory === "blinds") mult = 3.0;
    if (stackProfile.type === "chipLeader" && posCategory === "late") mult = 2.8;
    if (stackProfile.type === "short" || stackProfile.type === "mediumShort") mult = 2.4;
    if (aggression > 0.85) mult += 0.2;

    return Math.max(bigBlind * 2, Math.floor(bigBlind * mult));
}

function threeBetTo(stackProfile, aggression) {
    let mult = 2.7;
    if (stackProfile.type === "chipLeader" || stackProfile.type === "big") mult = 3.1;
    if (stackProfile.type === "short" || stackProfile.type === "mediumShort") mult = 2.5;
    if (aggression > 0.85) mult += 0.25;
    return Math.floor(currentBet * mult);
}

function shovePlayer(index) {
    const p = players[index];
    raisePlayer(index, p.currentBet + p.chips);
}

function getStrategicAliveCount() {
    return players.filter(p => {
        return p.chips > 0 || (p.hole.length === 2 && !p.folded && p.allIn);
    }).length;
}

function shouldDesperationJam(index, notation, strength, posCategory, toCall) {
    const p = players[index];
    const bb = Math.max(1, bigBlind);
    const stackBB = p.chips / bb;
    const alive = getStrategicAliveCount();
    const facingRaise = currentBet > bigBlind;
    const firstInOrBlindPrice = !facingRaise || toCall <= bigBlind;
    const cheapPressure = toCall <= Math.max(bigBlind * 2.5, p.chips * 0.35);
    const hugePressure = toCall >= p.chips * 0.65;

    const broadwayOrAce = notation[0] === "A" || notation[0] === "K" || notation[0] === "Q" || notation[0] === "J";
    const pocketPair = notation.length === 2;
    const suited = notation.endsWith("s");
    const connectorLike = ["T9o", "98o", "87o", "76o", "JTo", "T9s", "98s", "87s", "76s", "65s", "54s", "J9s", "T8s", "97s", "86s"].includes(notation);
    const playableShort = strength >= 1 || broadwayOrAce || pocketPair || suited || connectorLike;

    if (stackBB <= 1.5) {
        if (hugePressure && strength === 0 && !broadwayOrAce && !pocketPair) {
            return { jam: false, reason: "critical-facing-huge-pressure-trash" };
        }
        return { jam: true, reason: "critical-any-playable-spot" };
    }

    if (stackBB <= 3) {
        if (firstInOrBlindPrice && playableShort) return { jam: true, reason: "very-short-first-in-playable" };
        if (cheapPressure && (strength >= 1 || broadwayOrAce || pocketPair)) return { jam: true, reason: "very-short-cheap-pressure" };
        if (alive <= 4 && strength >= 1) return { jam: true, reason: "very-short-short-table" };
        return { jam: false, reason: "very-short-too-weak-or-too-expensive" };
    }

    if (stackBB <= 6) {
        if (firstInOrBlindPrice && strength >= 1) return { jam: true, reason: "short-playable" };
        if (firstInOrBlindPrice && isLateOrBlind(posCategory) && playableShort) return { jam: true, reason: "short-late-blind-playable" };
        if (cheapPressure && strength >= 2) return { jam: true, reason: "short-strong-vs-pressure" };
        if (alive <= 3 && strength >= 1 && cheapPressure) return { jam: true, reason: "short-three-handed" };
        return { jam: false, reason: "short-not-enough" };
    }

    if (stackBB <= 10) {
        if (firstInOrBlindPrice && isLateOrBlind(posCategory) && strength >= 2) return { jam: true, reason: "ten-bb-late-strong" };
        if (alive <= 3 && strength >= 2 && cheapPressure) return { jam: true, reason: "ten-bb-short-table-strong" };
        return { jam: false, reason: "ten-bb-no-jam" };
    }

    return { jam: false, reason: "not-desperate" };
}
