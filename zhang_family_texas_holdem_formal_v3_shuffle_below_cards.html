function ensureOpponentModel(index) {
    const p = players[index];
    if (!p) return createOpponentModel();
    if (!p.opponentModel || (p.opponentModel.version !== "v34" && p.opponentModel.version !== "v34B" && p.opponentModel.version !== "v34C" && p.opponentModel.version !== "v35" && p.opponentModel.version !== "v35B" && p.opponentModel.version !== "v36A" && p.opponentModel.version !== "v36D" && p.opponentModel.version !== "v36E" && p.opponentModel.version !== "v36F" && p.opponentModel.version !== "v36G" && p.opponentModel.version !== "v36H" && p.opponentModel.version !== "v36I" && p.opponentModel.version !== "v36J" && p.opponentModel.version !== "v37" && p.opponentModel.version !== "v37B")) {
        p.opponentModel = createOpponentModel();
    }
    if (p.opponentModel.version === "v34" || p.opponentModel.version === "v34B" || p.opponentModel.version === "v34C" || p.opponentModel.version === "v35" || p.opponentModel.version === "v35B" || p.opponentModel.version === "v36A" || p.opponentModel.version === "v36D" || p.opponentModel.version === "v36E" || p.opponentModel.version === "v36F" || p.opponentModel.version === "v36G" || p.opponentModel.version === "v36H" || p.opponentModel.version === "v36I" || p.opponentModel.version === "v36J" || p.opponentModel.version === "v37") p.opponentModel.version = "v37B";
    return p.opponentModel;
}

function getRate(numerator, denominator, prior = 0.5, targetSample = 30) {
    const sample = Math.max(0, denominator || 0);
    const observed = sample > 0 ? numerator / sample : prior;
    const confidence = Math.min(1, sample / targetSample);
    const effective = prior * (1 - confidence) + observed * confidence;
    return {
        observed: Number(observed.toFixed(3)),
        effective: Number(effective.toFixed(3)),
        sample,
        confidence: Number(confidence.toFixed(2))
    };
}

function getPreviousStreetActions(streetName) {
    return handActionHistory.filter(a => a.street === streetName && !a.forcedBlind);
}

function countPreviousAggressiveActions(streetName) {
    return getPreviousStreetActions(streetName).filter(a => a.action === "bet" || a.action === "raise").length;
}

function getLastPreviousAggressor(streetName) {
    const actions = getPreviousStreetActions(streetName).filter(a => a.action === "bet" || a.action === "raise");
    return actions.length ? actions[actions.length - 1] : null;
}

function hasRespondedAfterAction(playerIndex, actionEntry, streetName) {
    const actions = getPreviousStreetActions(streetName);
    const pos = actions.indexOf(actionEntry);
    if (pos < 0) return false;
    return actions.slice(pos + 1).some(a => a.playerIndex === playerIndex);
}

function isBlindPositionIndex(index) {
    return index === getSmallBlindIndex() || index === getBigBlindIndex();
}


function initializeV34CFlopCBetTracker() {
    const pfa = getLastPreflopAggressorIndex();
    v34CFlopCBetTracker = {
        version: "v34C",
        handNumber,
        street: "flop",
        pfa,
        cBetMade: false,
        cBetActionOrdinal: null,
        blockedByRaise: false,
        directResponders: {}
    };

    if (pfa !== null && pfa !== undefined) {
        const p = players[pfa];
        if (p && !p.folded && !p.allIn && p.chips > 0) {
            const model = ensureOpponentModel(pfa);
            if (model.flop.cBetOpportunity === undefined) model.flop.cBetOpportunity = 0;
            model.flop.cBetOpportunity++;
        }
    }
}

function getV34CFlopCBetTracker() {
    if (street !== "flop") return null;
    if (!v34CFlopCBetTracker || v34CFlopCBetTracker.handNumber !== handNumber) {
        initializeV34CFlopCBetTracker();
    }
    return v34CFlopCBetTracker;
}

function isV34CTrackableCBetResponse(actionType) {
    return actionType === "fold" || actionType === "call" || actionType === "raise";
}

function applyV34CFlopCBetTracking(index, actionType, entry, previousActions) {
    const tracker = getV34CFlopCBetTracker();
    if (!tracker || tracker.pfa === null || tracker.pfa === undefined) return false;

    const previousAggressive = previousActions.filter(a => a.action === "bet" || a.action === "raise");
    const currentIsAggressive = actionType === "bet" || actionType === "raise";
    const model = ensureOpponentModel(index);

    if (!tracker.cBetMade && currentIsAggressive && previousAggressive.length === 0) {
        if (index === tracker.pfa) {
            tracker.cBetMade = true;
            tracker.cBetActionOrdinal = handActionHistory.length;
            if (model.flop.cBet === undefined) model.flop.cBet = 0;
            model.flop.cBet++;
            if (entry) {
                entry.v34CFlopCBetTracker = {
                    event: "cBetMade",
                    pfa: tracker.pfa,
                    cBetActionOrdinal: tracker.cBetActionOrdinal
                };
            }
            return true;
        }

        // First flop aggression by a non-PFA is a donk bet; after this there
        // is no standard continuation bet opportunity for the preflop aggressor.
        if (model.flop.donkBet === undefined) model.flop.donkBet = 0;
        model.flop.donkBet++;
        tracker.blockedByRaise = true;
        if (entry) {
            entry.v34CFlopCBetTracker = {
                event: "donkBlocksCBet",
                pfa: tracker.pfa
            };
        }
        return true;
    }

    if (!tracker.cBetMade || index === tracker.pfa || !isV34CTrackableCBetResponse(actionType)) return false;
    if (tracker.directResponders[index]) return false;

    if (tracker.blockedByRaise) {
        if (model.flop.cBetResponseBlockedByRaise === undefined) model.flop.cBetResponseBlockedByRaise = 0;
        model.flop.cBetResponseBlockedByRaise++;
        tracker.directResponders[index] = "blocked";
        if (entry) {
            entry.v34CFlopCBetTracker = {
                event: "blockedByRaiseAfterCBet",
                pfa: tracker.pfa
            };
        }
        return true;
    }

    if (model.flop.facedCBet === undefined) model.flop.facedCBet = 0;
    if (model.flop.facedCBetDirect === undefined) model.flop.facedCBetDirect = 0;
    model.flop.facedCBet++;
    model.flop.facedCBetDirect++;

    if (actionType === "fold") model.flop.foldToCBet++;
    if (actionType === "call") model.flop.callCBet++;
    if (actionType === "raise") {
        model.flop.raiseCBet++;
        tracker.blockedByRaise = true;
    }

    tracker.directResponders[index] = actionType;
    if (entry) {
        entry.v34CFlopCBetTracker = {
            event: "directResponseToCBet",
            pfa: tracker.pfa,
            response: actionType
        };
    }
    return true;
}

function updateOpponentModelOnAction(index, actionType, amountPaid, extra = {}, entry = null) {
    const p = players[index];
    if (!p) return;
    const model = ensureOpponentModel(index);
    model.handsSeen = Math.max(model.handsSeen || 0, p.stats ? (p.stats.handsPlayed || 0) : 0);

    if (street === "preflop") {
        const previousAggressive = countPreviousAggressiveActions("preflop");
        const posCategory = getPositionCategory(index);
        const lastAgg = getLastPreviousAggressor("preflop");

        if ((extra && extra.becameAllIn) || p.chips === 0) model.preflop.allInPreflop++;

        if (actionType === "call" && amountPaid > 0) {
            if (previousAggressive === 0 && currentBet <= bigBlind) model.preflop.limp++;
            if (previousAggressive > 0 || currentBet > bigBlind) model.preflop.callRaise++;
            if (isBlindPositionIndex(index) && previousAggressive > 0) model.preflop.defendBlind++;
        }

        if (actionType === "bet" || actionType === "raise") {
            if (previousAggressive === 0) model.preflop.openRaise++;
            else if (previousAggressive === 1) model.preflop.threeBet++;
            else model.preflop.fourBet++;
            if (isBlindPositionIndex(index) && previousAggressive > 0) model.preflop.defendBlind++;
        }

        if (actionType === "fold" && isBlindPositionIndex(index) && lastAgg) {
            const raiserPos = getPositionCategory(lastAgg.playerIndex);
            if (raiserPos === "late" || getStrategicAliveCount() <= 4) {
                model.preflop.foldToSteal++;
            }
        }
    }

    if (street === "flop") {
        const previousActions = getPreviousStreetActions("flop");
        applyV34CFlopCBetTracking(index, actionType, entry, previousActions);

        const checkedBefore = previousActions.some(a => a.playerIndex === index && a.action === "check");
        if (checkedBefore) {
            if (actionType === "fold") model.flop.checkFold++;
            if (actionType === "call") model.flop.checkCall++;
            if (actionType === "raise") model.flop.checkRaise++;
        }
    }

    if (street === "turn") {
        const pfa = getLastPreflopAggressorIndex();
        const previousActions = getPreviousStreetActions("turn");
        const previousAggressive = previousActions.filter(a => a.action === "bet" || a.action === "raise");
        const wasFirstTurnBet = (actionType === "bet" || actionType === "raise") && previousAggressive.length === 0;

        if (wasFirstTurnBet && index === pfa && didStreetCheckThrough("flop")) model.turn.delayedCBet++;
        if (wasFirstTurnBet && index === pfa && getStreetAggressorCount("flop") > 0) model.turn.secondBarrel++;

        const lastAgg = previousAggressive.length ? previousAggressive[previousAggressive.length - 1] : null;
        if (lastAgg && lastAgg.playerIndex !== index && !hasRespondedAfterAction(index, lastAgg, "turn")) {
            if (actionType === "fold" || actionType === "call" || actionType === "raise") {
                model.turn.facedTurnBet++;
                if (actionType === "fold") model.turn.foldToTurnBet++;
                if (actionType === "call") model.turn.callTurnBet++;
                if (actionType === "raise") model.turn.raiseTurnBet++;
            }
        }
    }

    if (street === "river") {
        const previousActions = getPreviousStreetActions("river");
        const previousAggressive = previousActions.filter(a => a.action === "bet" || a.action === "raise");
        const lastAgg = previousAggressive.length ? previousAggressive[previousAggressive.length - 1] : null;

        if (actionType === "bet" || actionType === "raise") model.river.riverAggression++;

        if (lastAgg && lastAgg.playerIndex !== index && !hasRespondedAfterAction(index, lastAgg, "river")) {
            if (actionType === "fold" || actionType === "call" || actionType === "raise") {
                model.river.facedRiverBet++;
                if (actionType === "fold") model.river.foldToRiverBet++;
                if (actionType === "call") model.river.callRiverBet++;
            }
        }
    }

    model.tags = buildOpponentModelTags(index);
    model.lastRead = buildOpponentModelRead(index);
}

function updateOpponentModelOnShowdown(winnings, showdownParticipants = null) {
    const participantSet = showdownParticipants instanceof Set ? showdownParticipants : null;

    for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (!p || p.folded || !p.hole || p.hole.length !== 2) continue;
        if (participantSet && !participantSet.has(i)) continue;

        const model = ensureOpponentModel(i);
        const result = p.showdownResult || bestOfSeven(p.hole.concat(board));
        model.showdown.wentToShowdown++;

        // v34B: only a real payout from a contested showdown counts as
        // wonAtShowdown. Returned uncalled chips and fold-wins do not count.
        if ((winnings.get(i) || 0) > 0) model.showdown.wonAtShowdown++;

        const riverAgg = handActionHistory.some(a => a.playerIndex === i && a.street === "river" && (a.action === "bet" || a.action === "raise"));
        const checkedThenRaised = handActionHistory.some(a => a.playerIndex === i && (a.street === "flop" || a.street === "turn" || a.street === "river") && a.action === "check") &&
            handActionHistory.some(a => a.playerIndex === i && (a.street === "flop" || a.street === "turn" || a.street === "river") && a.action === "raise");

        if (riverAgg && result.category <= 0) {
            model.river.bluffShown++;
            model.showdown.showedBluff++;
        }
        if (riverAgg && result.category >= 1 && result.category <= 2) {
            model.river.showedThinValue++;
            model.showdown.showedThinValue++;
        }
        if (checkedThenRaised && result.category >= 3) {
            model.showdown.showedTrap++;
        }

        model.tags = buildOpponentModelTags(i);
        model.lastRead = buildOpponentModelRead(i);
    }
}

function getOpponentStreetConfidence(index) {
    const model = ensureOpponentModel(index);
    const p = players[index];
    const hands = Math.max(0, p && p.stats ? (p.stats.handsPlayed || 0) : (model.handsSeen || 0));
    const preflop = Math.min(1, hands / 60);
    const flop = Math.min(1, Math.max(model.flop.facedCBet, model.flop.cBet, model.flop.donkBet, model.flop.checkCall + model.flop.checkFold + model.flop.checkRaise) / 20);
    const turn = Math.min(1, Math.max(model.turn.facedTurnBet, model.turn.delayedCBet + model.turn.secondBarrel) / 18);
    const river = Math.min(1, Math.max(model.river.facedRiverBet, model.river.riverAggression) / 18);
    const showdown = Math.min(1, (model.showdown.wentToShowdown || 0) / 20);
    return {
        preflop: Number(preflop.toFixed(2)),
        flop: Number(flop.toFixed(2)),
        turn: Number(turn.toFixed(2)),
        river: Number(river.toFixed(2)),
        showdown: Number(showdown.toFixed(2))
    };
}

function buildOpponentModelTags(index) {
    const p = players[index];
    const m = ensureOpponentModel(index);
    const hands = Math.max(1, p && p.stats ? (p.stats.handsPlayed || 0) : (m.handsSeen || 0));
    const vpip = p && p.stats ? (p.stats.vpipHands || 0) / hands : 0;
    const pfr = p && p.stats ? (p.stats.pfrHands || 0) / hands : 0;
    const postTotal = p && p.stats ? (p.stats.postflopAggressiveActions || 0) + (p.stats.postflopPassiveActions || 0) + (p.stats.postflopChecks || 0) : 0;
    const postAgg = postTotal > 0 ? (p.stats.postflopAggressiveActions || 0) / postTotal : 0;
    const foldToCBet = getRate(m.flop.foldToCBet, m.flop.facedCBet, 0.45, 20);
    const callCBet = getRate(m.flop.callCBet, m.flop.facedCBet, 0.35, 20);
    const foldTurn = getRate(m.turn.foldToTurnBet, m.turn.facedTurnBet, 0.42, 18);
    const callRiver = getRate(m.river.callRiverBet, m.river.facedRiverBet, 0.42, 18);
    const showdownWinRate = getRate(m.showdown.wonAtShowdown, m.showdown.wentToShowdown, 0.5, 20);
    const allInRate = p && p.stats ? (p.stats.allInCount || 0) / hands : 0;
    const profileName = p && p.profile ? p.profile.name : "";
    const profileStation = profileName === "跟注站";
    const softCallingStation = !!(
        (profileStation && (
            callCBet.effective >= 0.45 ||
            (foldTurn.sample >= 2 && foldTurn.effective <= 0.38) ||
            (postTotal >= 8 && postAgg <= 0.26)
        )) ||
        (callCBet.sample >= 3 && callCBet.effective >= 0.47) ||
        (hands >= 35 && vpip >= 0.24 && postAgg <= 0.24 && callCBet.effective >= 0.42)
    );
    const stickyStrongStation = !!(
        softCallingStation &&
        showdownWinRate.confidence >= 0.55 &&
        showdownWinRate.effective >= 0.62
    );
    const strongShowdownRegular = !!(
        !softCallingStation && (
            (showdownWinRate.confidence >= 0.60 && showdownWinRate.effective >= 0.62) ||
            (showdownWinRate.sample >= 10 && showdownWinRate.observed >= 0.68)
        )
    );

    return {
        loosePreflop: hands >= 25 && vpip >= 0.30,
        tightPreflop: hands >= 25 && vpip <= 0.17,
        passivePostflop: postTotal >= 12 && postAgg <= 0.22,
        aggressivePostflop: postTotal >= 12 && postAgg >= 0.34,
        overfoldsFlop: foldToCBet.confidence >= 0.35 && foldToCBet.effective >= 0.62,
        callsTooMuch: callCBet.confidence >= 0.35 && callCBet.effective >= 0.52,
        softCallingStation,
        stickyStrongStation,
        strongShowdownRegular,
        foldsTurnTooMuch: foldTurn.confidence >= 0.35 && foldTurn.effective >= 0.60,
        riverStation: callRiver.confidence >= 0.35 && callRiver.effective >= 0.55,
        riverHonest: m.river.riverAggression >= 4 && m.showdown.wentToShowdown >= 6 && m.showdown.showedBluff <= 1,
        shortStackManiac: hands >= 25 && allInRate >= 0.075,
        trapper: m.showdown.wentToShowdown >= 6 && m.showdown.showedTrap >= 2,
        bluffHeavy: m.showdown.wentToShowdown >= 6 && (m.showdown.showedBluff >= 2 || (m.river.bluffShown >= 2))
    };
}

function getOpponentModelExport(index) {
    const model = ensureOpponentModel(index);
    return {
        version: model.version,
        handsSeen: model.handsSeen,
        preflop: model.preflop,
        flop: model.flop,
        turn: model.turn,
        river: model.river,
        showdown: model.showdown,
        tags: buildOpponentModelTags(index),
        rates: getOpponentModelRates(index),
        streetConfidence: getOpponentStreetConfidence(index),
        lastRead: model.lastRead || buildOpponentModelRead(index)
    };
}

function getOpponentModelRates(index) {
    const p = players[index];
    const model = ensureOpponentModel(index);
    const hands = Math.max(1, p && p.stats ? (p.stats.handsPlayed || 0) : model.handsSeen || 1);
    return {
        vpip: getRate(p && p.stats ? p.stats.vpipHands || 0 : 0, hands, 0.25, 60),
        pfr: getRate(p && p.stats ? p.stats.pfrHands || 0 : 0, hands, 0.16, 60),
        foldToCBet: getRate(model.flop.foldToCBet, model.flop.facedCBet, 0.45, 20),
        callCBet: getRate(model.flop.callCBet, model.flop.facedCBet, 0.35, 20),
        raiseCBet: getRate(model.flop.raiseCBet, model.flop.facedCBet, 0.10, 20),
        foldToTurnBet: getRate(model.turn.foldToTurnBet, model.turn.facedTurnBet, 0.42, 18),
        callRiverBet: getRate(model.river.callRiverBet, model.river.facedRiverBet, 0.42, 18),
        showdownWinRate: getRate(model.showdown.wonAtShowdown, model.showdown.wentToShowdown, 0.50, 20)
    };
}

function buildOpponentModelRead(index) {
    const p = players[index];
    if (!p) return null;
    const model = ensureOpponentModel(index);
    const rates = getOpponentModelRates(index);
    const tags = buildOpponentModelTags(index);
    const activeTags = Object.entries(tags).filter(([k, v]) => !!v).map(([k]) => k);
    const streetConfidence = getOpponentStreetConfidence(index);

    let label = p.profile ? p.profile.name : "未知型";
    if (tags.stickyStrongStation) label = "動態強攤牌跟注站";
    else if (tags.strongShowdownRegular) label = "動態強攤牌常規型";
    else if (tags.callsTooMuch || tags.softCallingStation || (tags.loosePreflop && tags.passivePostflop)) label = "動態跟注站";
    else if (tags.overfoldsFlop || tags.foldsTurnTooMuch) label = "動態過度棄牌";
    else if (tags.aggressivePostflop || tags.shortStackManiac) label = "動態高壓進攻";
    else if (tags.tightPreflop) label = "動態偏緊";
    else if (tags.loosePreflop) label = "動態偏鬆";

    let exploitPlan = "樣本不足，維持標準策略";
    let exploitConfidence = Math.max(0.15, streetConfidence.preflop * 0.35);

    if (tags.stickyStrongStation) {
        exploitPlan = "少 bluff，但不要過度 thin value；river 尤其尊重其攤牌強度";
        exploitConfidence = Math.max(rates.showdownWinRate.confidence, rates.callCBet.confidence, streetConfidence.showdown);
    } else if (tags.strongShowdownRegular) {
        exploitPlan = "攤牌勝率偏高；river bluff-catcher 與薄價值都收緊";
        exploitConfidence = Math.max(rates.showdownWinRate.confidence, streetConfidence.showdown);
    } else if (tags.callsTooMuch || tags.softCallingStation || tags.riverStation) {
        exploitPlan = "少 bluff，多做 value / thin value；可略放大 value sizing";
        exploitConfidence = Math.max(rates.callCBet.confidence, rates.callRiverBet.confidence, streetConfidence.flop * 0.5);
    } else if (tags.overfoldsFlop || tags.foldsTurnTooMuch) {
        exploitPlan = "提高 c-bet / delayed c-bet；小尺度 bluff 即可";
        exploitConfidence = Math.max(rates.foldToCBet.confidence, rates.foldToTurnBet.confidence);
    } else if (tags.aggressivePostflop || tags.bluffHeavy) {
        exploitPlan = "少純 bluff，增加 bluff-catcher 與誘導下注";
        exploitConfidence = Math.max(streetConfidence.flop, streetConfidence.river, streetConfidence.showdown);
    } else if (tags.riverHonest) {
        exploitPlan = "尊重 river 大注；對 check 可增加偷取";
        exploitConfidence = Math.max(streetConfidence.river, streetConfidence.showdown);
    } else if (tags.shortStackManiac) {
        exploitPlan = "放寬 call shove，但多人 overcall 仍收緊";
        exploitConfidence = streetConfidence.preflop;
    }

    return {
        playerName: p.name,
        dynamicLabel: label,
        profilePrior: p.profile ? p.profile.name : "human/unknown",
        activeTags,
        rates,
        streetConfidence,
        modelSamples: {
            facedCBet: model.flop.facedCBet,
            facedTurnBet: model.turn.facedTurnBet,
            facedRiverBet: model.river.facedRiverBet,
            showdown: model.showdown.wentToShowdown
        },
        exploitPlan,
        confidence: Number(Math.min(1, exploitConfidence).toFixed(2)),
        confidenceNote: "v37B keeps postflop unchanged; adds early-sample big human-all-in guard; logs all players hole cards in debug export; keeps v37 delayed-c-bet / strongShowdownRegular / fake semi-bluff safeguards; debug separates actualNuts / nearNutsMade from legacy nutLikeMade"
    };
}

function buildV34OpponentModelReads(index, opponentRanges) {
    const activeOpponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt);

    const order = Array.isArray(opponentRanges) && opponentRanges.length > 0
        ? opponentRanges.map(r => players.findIndex(p => p && p.name === r.name)).filter(i => i >= 0)
        : activeOpponents.map(x => x.i);

    return order.slice(0, 4).map(i => buildOpponentModelRead(i)).filter(Boolean);
}


function parseWeightedNotationEntry(entry) {
    const raw = String(entry || "");
    const parts = raw.split(":");
    return {
        notation: parts[0],
        weight: parts.length > 1 ? Number(parts[1]) || 0 : 0
    };
}

function getRankHighLowFromNotation(notation) {
    if (!notation) return { high: 0, low: 0, pair: false, suited: false, gap: 0 };
    const pair = notation.length === 2;
    const suited = notation.endsWith("s");
    const high = rangeRankValue(notation[0]);
    const low = rangeRankValue(notation[1]);
    return { high, low, pair, suited, gap: Math.abs(high - low) };
}

function getNotationGroupLabel(notation) {
    const f = getRankHighLowFromNotation(notation);
    if (!notation) return "未知牌型";
    if (f.pair) {
        if (f.high >= 11) return "高口袋對";
        if (f.high >= 7) return "中口袋對";
        return "小口袋對";
    }
    if (f.high === 14 && f.low >= 10) return "強 Ax / Broadway";
    if (f.high === 14) return "弱 Ax";
    if (f.high >= 13 && f.low >= 10) return "Broadway";
    if (f.suited && f.gap <= 2 && f.low >= 5) return "同花連張 / 近連張";
    if (f.suited) return "同花邊緣牌";
    if (f.gap <= 2 && f.high <= 11) return "非同花連張";
    return "邊緣高張 / 空氣";
}

function getRangeWeightEntries(rangeWeights) {
    if (!rangeWeights) return [];
    return Object.entries(rangeWeights)
        .filter(([, weight]) => Number(weight) > 0)
        .map(([notation, weight]) => ({ notation, weight: Number(weight) || 0 }));
}

function summarizePreflopRangeShape(rangeWeights) {
    const entries = getRangeWeightEntries(rangeWeights);
    let total = 0;
    const out = {
        premium: 0,
        pair: 0,
        broadway: 0,
        aceX: 0,
        speculative: 0,
        suited: 0,
        trash: 0
    };

    for (const { notation, weight } of entries) {
        if (weight <= 0) continue;
        total += weight;
        const f = getRankHighLowFromNotation(notation);
        const rankPct = getStartingHandRankPercent(notation);
        if (rankPct <= 0.08 || isPremiumNotation(notation)) out.premium += weight;
        if (f.pair) out.pair += weight;
        if (!f.pair && f.high >= 13 && f.low >= 10) out.broadway += weight;
        if (!f.pair && f.high === 14) out.aceX += weight;
        if (isSpeculativeNotation(notation) || (f.suited && f.gap <= 3)) out.speculative += weight;
        if (f.suited) out.suited += weight;
        if (rankPct >= 0.72 && !isSpeculativeNotation(notation)) out.trash += weight;
    }

    if (total <= 0) return Object.fromEntries(Object.keys(out).map(k => [k, 0]));
    for (const key of Object.keys(out)) out[key] = Number((out[key] / total).toFixed(3));
    return out;
}

function summarizePostflopRangeDistribution(rangeWeights, boardCards) {
    const entries = getRangeWeightEntries(rangeWeights);
    let total = 0;
    const out = {
        strongMade: 0,
        mediumMade: 0,
        draw: 0,
        air: 0
    };

    for (const { notation, weight } of entries) {
        if (weight <= 0) continue;
        const cls = classifyNotationOnBoard(notation, boardCards);
        const clsTotal = cls.strong + cls.medium + cls.draw + cls.air;
        if (clsTotal <= 0) continue;
        total += weight;
        out.strongMade += weight * cls.strong;
        out.mediumMade += weight * cls.medium;
        out.draw += weight * cls.draw;
        out.air += weight * cls.air;
    }

    if (total <= 0) return { strongMade: 0, mediumMade: 0, draw: 0, air: 0 };
    for (const key of Object.keys(out)) out[key] = Number((out[key] / total).toFixed(3));
    return out;
}

function getRangeBucketFromDistribution(dist, stage) {
    if (!dist) return "未知 range";
    if (stage === "postflop") {
        if ((dist.strongMade || 0) >= 0.30) return "強成牌密度高";
        if ((dist.strongMade || 0) + (dist.draw || 0) >= 0.45) return "強牌 / 強抽牌混合";
        if ((dist.mediumMade || 0) >= 0.42) return "中等成牌偏多";
        if ((dist.draw || 0) >= 0.30) return "抽牌偏多";
        if ((dist.air || 0) >= 0.45) return "空氣與弱牌偏多";
        return "range 分布平均";
    }

    if ((dist.premium || 0) >= 0.28) return "翻前強 range";
    if ((dist.pair || 0) + (dist.broadway || 0) >= 0.48) return "口袋對 / Broadway 偏多";
    if ((dist.speculative || 0) >= 0.36) return "投機牌偏多";
    if ((dist.trash || 0) >= 0.38) return "弱牌仍很多";
    return "翻前中寬 range";
}

function getLikelyHoldingGroupsFromRange(rangeWeights, boardCards, limit = 8) {
    const top = getTopRangeNotations(rangeWeights, Math.max(12, limit * 2));
    const seen = new Set();
    const groups = [];

    for (const entry of top) {
        const notation = parseWeightedNotationEntry(entry).notation;
        const group = boardCards && boardCards.length >= 3
            ? getNotationGroupLabel(notation) + "（" + notation + "）"
            : getNotationGroupLabel(notation) + "（" + notation + "）";
        if (!seen.has(group)) {
            seen.add(group);
            groups.push(group);
        }
        if (groups.length >= limit) break;
    }

    return groups.length ? groups : ["未知 range"];
}

function getV35StreetConfidenceForRange(playerIndex) {
    const read = buildOpponentModelRead(playerIndex);
    const conf = read && read.streetConfidence ? read.streetConfidence : getOpponentStreetConfidence(playerIndex);
    const current = street === "flop" ? conf.flop : street === "turn" ? conf.turn : street === "river" ? conf.river : conf.preflop;
    const preflop = conf.preflop ?? 0.3;
    const showdown = conf.showdown ?? 0;
    const blended = board.length >= 3
        ? Math.max(0.12, Math.min(1, preflop * 0.35 + current * 0.45 + showdown * 0.20))
        : Math.max(0.12, Math.min(1, preflop));
    return Number(blended.toFixed(2));
}

function buildV35ActionRead(playerIndex, actionSummary, currentStreetRead, bucket, distribution, rangeStage) {
    const p = players[playerIndex];
    const modelRead = buildOpponentModelRead(playerIndex);
    const name = p ? p.name : "對手";
    const preflopText = getReadableActionSummary(actionSummary);

    if (rangeStage === "postflop") {
        const strong = Math.round((distribution.strongMade || 0) * 100);
        const medium = Math.round((distribution.mediumMade || 0) * 100);
        const draw = Math.round((distribution.draw || 0) * 100);
        const air = Math.round((distribution.air || 0) * 100);
        let response = name + "：" + currentStreetRead + "；" + bucket + "。估計強成牌 " + strong + "%、中等成牌 " + medium + "%、抽牌 " + draw + "%、空氣 " + air + "%。";
        if (modelRead && modelRead.activeTags && modelRead.activeTags.length) response += " 動態標籤：" + modelRead.activeTags.slice(0, 3).join("、") + "。";
        return response;
    }

    const premium = Math.round((distribution.premium || 0) * 100);
    const spec = Math.round((distribution.speculative || 0) * 100);
    return name + "：" + preflopText + "；" + bucket + "。估計 premium 約 " + premium + "%、投機牌約 " + spec + "% 。";
}

function buildV35BRangeModelSummary(rangeReads) {
    const reads = Array.isArray(rangeReads) ? rangeReads : [];
    const buckets = {};
    const stageCounts = {};
    let totalConfidence = 0;

    for (const read of reads) {
        const bucket = read.rangeBucket || "unknown";
        const stage = read.rangeStage || "unknown";
        buckets[bucket] = (buckets[bucket] || 0) + 1;
        stageCounts[stage] = (stageCounts[stage] || 0) + 1;
        totalConfidence += Number(read.rangeConfidence || 0);
    }

    const averageRangeConfidence = reads.length ? Number((totalConfidence / reads.length).toFixed(2)) : 0;

    return {
        version: "v35B-range-summary",
        mode: "compact-summary",
        totalReads: reads.length,
        averageRangeConfidence,
        buckets,
        stageCounts,
        topTargets: reads.slice(0, 3).map(r => ({
            playerName: r.playerName,
            playerIndex: r.playerIndex,
            rangeBucket: r.rangeBucket,
            rangeConfidence: r.rangeConfidence,
            preflopRangeSource: r.preflopRangeSource,
            currentStreetAction: r.currentStreetAction,
            likelyHoldings: (r.likelyHoldings || []).slice(0, 4)
        })),
        note: "Full per-opponent reads are stored in opponentRangeReads; this summary avoids duplicating the full array."
    };
}

function buildV35RangeReads(index, opponentRanges, texture, hero, plan, equity, toCall) {
    const activeOpponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt && x.p.hole && x.p.hole.length === 2);

    const ordered = Array.isArray(opponentRanges) && opponentRanges.length > 0
        ? opponentRanges.map(r => {
            const i = players.findIndex(p => p && p.name === r.name);
            return { rangeDebug: r, index: i };
        }).filter(x => x.index >= 0)
        : activeOpponents.map(x => ({ rangeDebug: null, index: x.i }));

    return ordered.slice(0, 4).map(item => {
        const oppIndex = item.index;
        const p = players[oppIndex];
        const rangeWeights = estimateOpponentRange(oppIndex);
        const preflopRangeSource = getPreflopActionSummary(oppIndex);
        const preflopRangeSourceLabel = getPreflopRangeSourceLabel(preflopRangeSource);
        const preflopRangeSourceRead = getReadableActionSummary(preflopRangeSource);
        const currentStreetAction = getCurrentStreetOpponentActionCode(oppIndex);
        const currentStreetActionLabel = getCurrentStreetOpponentActionLabel(currentStreetAction);
        const currentStreetActionRead = getCurrentStreetOpponentActionRead(oppIndex);
        const rangeStage = board.length >= 3 ? "postflop" : "preflop";
        const rangeDistribution = rangeStage === "postflop"
            ? summarizePostflopRangeDistribution(rangeWeights, board)
            : summarizePreflopRangeShape(rangeWeights);
        const rangeBucket = getRangeBucketFromDistribution(rangeDistribution, rangeStage);
        const likelyHoldings = getLikelyHoldingGroupsFromRange(rangeWeights, board, 7);
        const rangeConfidence = getV35StreetConfidenceForRange(oppIndex);
        const modelRead = buildOpponentModelRead(oppIndex);
        const actionRead = buildV35ActionRead(oppIndex, preflopRangeSource, currentStreetActionRead, rangeBucket, rangeDistribution, rangeStage);
        const topWeighted = getTopRangeNotations(rangeWeights, 10);

        return {
            version: "v35B-range-model",
            playerName: p ? p.name : "未知對手",
            playerIndex: oppIndex,
            rangeStage,
            preflopRangeSource,
            preflopRangeSourceLabel,
            preflopRangeSourceRead,
            currentStreetAction,
            currentStreetActionLabel,
            currentStreetActionRead,
            actionSummary: preflopRangeSource,
            legacyActionSummaryNote: "Deprecated in v35B: actionSummary is the preflop range source. Use preflopRangeSource and currentStreetAction separately.",
            rangeBucket,
            rangeDistribution,
            likelyHoldings,
            topWeighted,
            actionRead,
            rangeConfidence,
            confidenceBreakdown: modelRead ? modelRead.streetConfidence : getOpponentStreetConfidence(oppIndex),
            modelTags: modelRead ? modelRead.activeTags : [],
            exploitPlanContext: modelRead ? modelRead.exploitPlan : "標準策略",
            note: "v35B only logs range inference; it separates preflop range source from current-street action and does not directly change decisions"
        };
    });
}

function getLikelyHoldingTextFromRange(oppRange) {
    if (!oppRange || !Array.isArray(oppRange.top) || oppRange.top.length === 0) return ["未知 range"];
    return oppRange.top.slice(0, 6).map(x => String(x).split(":")[0]);
}

function inferOpponentStrengthRead(oppRange, texture, toCall) {
    const actionSummary = oppRange ? oppRange.actionSummary : "none";
    const currentStreetRead = oppRange && Number.isInteger(oppRange.index) ? getCurrentStreetOpponentActionRead(oppRange.index) : "本街資訊不足";

    if (currentStreetRead.includes("加注")) return "強牌或強 draw 比例明顯上升";
    if (currentStreetRead.includes("主動下注")) return texture.wetness === "wet" ? "可能是保護下注、強 draw 或 value" : "可能是 c-bet、薄價值或 bluff";
    if (currentStreetRead.includes("跟注")) return "多為中等牌力、抽牌或 bluff-catcher";
    if (currentStreetRead.includes("過牌")) return texture.aceHighDry ? "在乾燥高牌面過牌，強牌比例下降" : "過牌削弱主動強牌比例，但仍可能慢打";
    if (actionSummary === "raised") return "翻前強 range，仍保有高牌和 overpair 優勢";
    if (actionSummary === "called") return "中等成牌、口袋對、同花連張與部分 Broadway 較多";
    if (actionSummary === "checkedBlind" || actionSummary === "onlyBlind") return "range 很寬，空氣牌和弱對比例較高";
    return "牌力未明，需要依後續行動判斷";
}

function inferPsychologicalState(playerIndex) {
    const p = players[playerIndex];
    if (!p) return "未知";
    const stackBB = p.chips / Math.max(1, bigBlind);
    const style = classifyPlayerStyleFromStats(playerIndex);
    if (stackBB <= 6) return "極短碼壓力，容易被迫 push/fold";
    if (stackBB <= 15) return "短碼壓力，可能擴大 all-in 或 resteal";
    if (p.chips >= Math.max(...players.map(x => x ? x.chips : 0)) && activePlayerCount() <= 4) return "大籌碼壓迫位，可能用籌碼施壓";
    if (style.allInRate >= 0.07) return "近期 All-in 偏多，波動和壓迫性較高";
    if (style.foldRate >= 0.58) return "棄牌率偏高，容易被持續下注施壓";
    if (style.vpip >= 0.42 && style.postflopAggression < 0.24) return "入池寬但翻後偏被動，像 calling station";
    return "狀態正常，沒有明顯 tilt 或短碼壓力";
}

function buildV32OpponentRead(index, texture, hero, plan, equity, toCall, opponentRanges) {
    const ranges = Array.isArray(opponentRanges) ? opponentRanges : [];
    const activeOpponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt);

    const source = ranges.length > 0 ? ranges.map(r => ({
        ...r,
        index: players.findIndex(p => p && p.name === r.name)
    })) : activeOpponents.map(x => ({
        name: x.p.name,
        index: x.i,
        actionSummary: getPreflopActionSummary(x.i),
        top: []
    }));

    return source.slice(0, 4).map(r => {
        const oppIndex = Number.isInteger(r.index) ? r.index : players.findIndex(p => p && p.name === r.name);
        const style = classifyPlayerStyleFromStats(oppIndex);
        const modelRead = buildOpponentModelRead(oppIndex);
        const likely = getLikelyHoldingTextFromRange(r);
        const modelLabel = modelRead ? modelRead.dynamicLabel : style.label;
        const tagsText = modelRead && modelRead.activeTags.length ? "｜tags " + modelRead.activeTags.slice(0, 4).join(",") : "";
        const styleRead = modelLabel + "｜先驗 " + (modelRead ? modelRead.profilePrior : "-") + "｜VPIP " + Math.round(style.vpip * 100) + "%｜PFR " + Math.round(style.pfr * 100) + "%" + tagsText;
        const rangeRead = getReadableActionSummary(r.actionSummary) + "；可能牌型集中在：" + likely.join("、");
        const strengthRead = inferOpponentStrengthRead({ ...r, index: oppIndex }, texture, toCall);
        const psychologicalState = inferPsychologicalState(oppIndex);
        let exploitPlan = modelRead ? modelRead.exploitPlan : "標準觀察，避免過度解讀單一行動";
        if (!modelRead) {
            if (style.label.includes("跟注站")) exploitPlan = "少 bluff，多做 value / thin value";
            else if (style.foldRate >= 0.58) exploitPlan = "可增加 c-bet / delayed c-bet 壓力";
            else if (style.postflopAggression >= 0.38) exploitPlan = "面對小中注保留更多 bluff-catcher";
            else if (style.allInRate >= 0.07) exploitPlan = "降低邊緣 bluff，等待可攤牌牌力抓過度進攻";
        }

        return {
            playerName: r.name,
            styleRead,
            rangeRead,
            strengthRead,
            likelyHoldings: likely,
            psychologicalState,
            exploitPlan,
            v34Model: modelRead,
            confidence: Number(Math.max(style.confidence, modelRead ? modelRead.confidence : 0).toFixed(2))
        };
    });
}

function buildV32PostflopPlanRead(index, plan, equity, toCall, texture, hero) {
    const pfa = getLastPreflopAggressorIndex() === index;
    const isFlop = board.length === 3;
    const isTurn = board.length === 4;
    const isRiver = board.length >= 5;
    const flopCheckedThrough = isTurn && didStreetCheckThrough("flop");
    const madeCategory = hero.made ? hero.made.category : 0;
    const drawing = !isRiver && (hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot || hero.hasComboDraw || hero.hasOvercards);
    const reasons = [];

    if (pfa) reasons.push("翻前主動者");
    if (isFlop && pfa && toCall === 0 && (texture.aceHighDry || texture.wetness === "dry" || texture.paired)) reasons.push("c-bet 候選：乾燥或高牌面");
    if (flopCheckedThrough && toCall === 0) reasons.push("delayed c-bet 候選：flop check-through");
    if (hero.hasTopPair || hero.hasOverPair || madeCategory >= 2) reasons.push("有 value / protection 來源");
    if (drawing) reasons.push("有 draw，可半詐唬或跟注實現 equity");
    if (toCall > 0 && (madeCategory >= 1 || drawing)) reasons.push("bluff-catcher / draw call 候選");
    if (plan.v32PostflopUpgrade && plan.v32PostflopUpgrade !== "none") reasons.push("v32B 覆蓋原計畫：" + plan.v32PostflopUpgrade);
    if (reasons.length === 0) reasons.push("無明顯主動下注理由，維持原策略");

    return {
        version: "v32B-postflop",
        planType: plan.type,
        amount: plan.amount ?? null,
        purpose: plan.v32Purpose || plan.purpose || (lastSizingDebug ? lastSizingDebug.purpose : "-"),
        cBetCandidate: !!(isFlop && pfa && toCall === 0),
        delayedCBetCandidate: !!(flopCheckedThrough && toCall === 0),
        thinValueCandidate: !!(toCall === 0 && (hero.hasTopPair || hero.hasOverPair || (madeCategory >= 1 && equity >= 0.48))),
        bluffCatcherCandidate: !!(toCall > 0 && (madeCategory >= 1 || drawing || equity >= 0.28)),
        boardRead: texture.wetness + (texture.aceHighDry ? "／A-high dry" : "") + (texture.paired ? "／paired" : ""),
        reasons
    };
}

function buildV32DecisionNarrative(index, planRead, opponentRead, equity, toCall) {
    const p = players[index];
    const opp = opponentRead && opponentRead.length > 0 ? opponentRead[0] : null;
    const actionText = planRead.planType === "bet" ? "下注" : planRead.planType === "raise" ? "加注" : planRead.planType === "call" ? "跟注" : planRead.planType === "fold" ? "棄牌" : "過牌";
    const oppText = opp ? "主要對手「" + opp.playerName + "」被判讀為「" + opp.styleRead + "」，" + opp.strengthRead + "。" : "目前沒有足夠對手資料。";
    return p.name + " 決定" + actionText + "。Equity 約 " + Math.round(equity * 100) + "%；需跟注 " + money(toCall) + "。" + oppText + "理由：" + planRead.reasons.join("；") + "。";
}

function getV32ActiveOpponentProfileFlags(index) {
    const opponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt && !x.p.allIn && x.p.chips > 0);

    if (opponents.length === 0) {
        return {
            count: 0,
            callingStation: false,
            overfolder: false,
            aggressive: false,
            veryLoose: false,
            maxFoldRate: 0,
            maxFoldToCBet: 0,
            maxFoldToTurnBet: 0,
            maxCallCBet: 0,
            maxVpip: 0,
            maxAggression: 0,
            labelSummary: "無主要對手"
        };
    }

    const styles = opponents.map(x => {
        const style = classifyPlayerStyleFromStats(x.i);
        const rates = getOpponentModelRates(x.i);
        const tags = buildOpponentModelTags(x.i);
        const profile = x.p.profile ? x.p.profile.name : "";
        return { index: x.i, name: x.p.name, style, profile, rates, tags };
    });

    const hardCallingStation = styles.some(x =>
        x.tags.callsTooMuch ||
        x.tags.riverStation ||
        (x.rates.callCBet.confidence >= 0.35 && x.rates.callCBet.effective >= 0.52) ||
        (x.rates.callRiverBet && x.rates.callRiverBet.confidence >= 0.35 && x.rates.callRiverBet.effective >= 0.55)
    );

    const softCallingStation = styles.some(x =>
        x.tags.softCallingStation ||
        (x.profile === "跟注站" && (
            x.rates.callCBet.effective >= 0.43 ||
            x.rates.foldToTurnBet.effective <= 0.38 ||
            x.tags.passivePostflop ||
            x.style.postflopAggression < 0.27
        )) ||
        (x.rates.callCBet.sample >= 3 && x.rates.callCBet.effective >= 0.47) ||
        (x.style.vpip >= 0.30 && x.style.postflopAggression < 0.24 && x.style.confidence >= 0.45)
    );

    const stickyStrongStation = styles.some(x => x.tags.stickyStrongStation);
    const strongShowdownRegular = styles.some(x => x.tags.strongShowdownRegular);
    const callingStation = hardCallingStation || softCallingStation || stickyStrongStation;

    const overfolder = styles.some(x =>
        x.tags.overfoldsFlop ||
        x.tags.foldsTurnTooMuch ||
        (x.rates.foldToCBet.confidence >= 0.25 && x.rates.foldToCBet.effective >= 0.58) ||
        (x.rates.foldToTurnBet.confidence >= 0.30 && x.rates.foldToTurnBet.effective >= 0.58) ||
        (x.profile === "極緊型" && x.style.foldRate >= 0.62 && x.style.confidence >= 0.70)
    );

    const aggressive = styles.some(x =>
        x.tags.aggressivePostflop ||
        x.tags.bluffHeavy ||
        x.style.postflopAggression >= 0.36 ||
        x.style.label.includes("鬆凶")
    );

    const veryLoose = styles.some(x => x.style.vpip >= 0.40 || x.style.label.includes("鬆"));
    const maxFoldRate = Math.max(...styles.map(x => x.style.foldRate || 0));
    const maxFoldToCBet = Math.max(...styles.map(x => x.rates.foldToCBet ? x.rates.foldToCBet.effective : 0));
    const maxFoldToTurnBet = Math.max(...styles.map(x => x.rates.foldToTurnBet ? x.rates.foldToTurnBet.effective : 0));
    const maxCallCBet = Math.max(...styles.map(x => x.rates.callCBet ? x.rates.callCBet.effective : 0));
    const maxVpip = Math.max(...styles.map(x => x.style.vpip || 0));
    const maxAggression = Math.max(...styles.map(x => x.style.postflopAggression || 0));
    const labelSummary = styles.slice(0, 3).map(x => {
        const tags = Object.entries(x.tags).filter(([k, v]) => !!v).map(([k]) => k).slice(0, 2).join(",");
        return x.name + ":" + x.style.label + (tags ? "(" + tags + ")" : "");
    }).join("｜");

    return {
        count: opponents.length,
        callingStation,
        hardCallingStation,
        softCallingStation,
        stickyStrongStation,
        strongShowdownRegular,
        overfolder,
        aggressive,
        veryLoose,
        maxFoldRate,
        maxFoldToCBet,
        maxFoldToTurnBet,
        maxCallCBet,
        maxVpip,
        maxAggression,
        labelSummary
    };
}


function clampNumber(value, min, max) {
    const n = Number(value);
    if (!Number.isFinite(n)) return min;
    return Math.max(min, Math.min(max, n));
}

function buildV36ARangeImpact(index, opponentRanges, texture, hero, equity, toCall, basePlan) {
    const reads = buildV35RangeReads(index, opponentRanges || [], texture, hero, basePlan || {}, equity, toCall)
        .filter(r => r && r.rangeStage === "postflop");

    const aggressiveReads = reads.filter(r => r.currentStreetAction === "bet" || r.currentStreetAction === "raise");
    const targetReads = toCall > 0 && aggressiveReads.length ? aggressiveReads : reads;
    const totalWeight = targetReads.reduce((sum, r) => sum + Math.max(0.15, Number(r.rangeConfidence || 0.15)), 0);

    const avg = { strongMade: 0, mediumMade: 0, draw: 0, air: 0 };
    let maxStrongMade = 0;
    let maxAir = 0;
    let maxDraw = 0;
    const bucketCounts = {};
    const tagSet = new Set();
    const reasons = [];

    for (const r of targetReads) {
        const w = totalWeight > 0 ? Math.max(0.15, Number(r.rangeConfidence || 0.15)) / totalWeight : 0;
        const d = r.rangeDistribution || {};
        avg.strongMade += (Number(d.strongMade || 0) * w);
        avg.mediumMade += (Number(d.mediumMade || 0) * w);
        avg.draw += (Number(d.draw || 0) * w);
        avg.air += (Number(d.air || 0) * w);
        maxStrongMade = Math.max(maxStrongMade, Number(d.strongMade || 0));
        maxAir = Math.max(maxAir, Number(d.air || 0));
        maxDraw = Math.max(maxDraw, Number(d.draw || 0));
        const bucket = r.rangeBucket || "unknown";
        bucketCounts[bucket] = (bucketCounts[bucket] || 0) + 1;
        (r.modelTags || []).forEach(t => tagSet.add(t));
    }

    const hasOverfolderTag = tagSet.has("overfoldsFlop") || tagSet.has("foldsTurnTooMuch");
    const hasStickyStrongStationTag = tagSet.has("stickyStrongStation");
    const hasStrongShowdownRegularTag = tagSet.has("strongShowdownRegular");
    const hasStationTag = tagSet.has("callsTooMuch") || tagSet.has("softCallingStation") || tagSet.has("riverStation") || tagSet.has("passivePostflop") || hasStickyStrongStationTag;
    const hasAggressiveTag = tagSet.has("aggressivePostflop") || tagSet.has("bluffHeavy");
    const dryPressure = texture && (texture.aceHighDry || texture.wetness === "dry" || texture.paired) ? 0.06 : 0;

    const foldPressure = clampNumber((avg.air * 0.34) + (maxAir * 0.12) + (hasOverfolderTag ? 0.16 : 0) + dryPressure - (hasStationTag ? 0.06 : 0), 0, 0.36);
    const strongRisk = clampNumber((maxStrongMade * 0.34) + (avg.strongMade >= 0.30 ? 0.10 : 0) + ((texture && texture.wetness === "wet") ? 0.04 : 0) + (hasStrongShowdownRegularTag ? 0.06 : 0), 0, 0.38);
    const valuePressure = clampNumber((avg.mediumMade * 0.18) + (avg.draw * 0.10) + (hasStationTag ? 0.16 : 0) - (hasStickyStrongStationTag ? 0.14 : 0) - (hasStrongShowdownRegularTag ? 0.08 : 0) - (strongRisk * 0.35), -0.14, 0.34);
    const bluffCatcherSupport = clampNumber((toCall > 0 ? (avg.air * 0.22 + avg.draw * 0.14) : 0) + (hasAggressiveTag ? 0.12 : 0) - (maxStrongMade * 0.18) - (hasStrongShowdownRegularTag ? 0.10 : 0), -0.16, 0.30);

    if (foldPressure >= 0.16) reasons.push("range 空氣 / 棄牌壓力偏高，可提高 c-bet 或 delayed c-bet");
    if (valuePressure >= 0.14) reasons.push("對手 range 中等成牌或跟注傾向偏多，可增加 thin value");
    if (strongRisk >= 0.18) reasons.push("對手強成牌密度偏高，降低純 bluff 與薄價值頻率");
    if (hasStrongShowdownRegularTag) reasons.push("對手攤牌勝率偏高，river bluff-catcher 與 thin value 收緊");
    if (bluffCatcherSupport >= 0.10) reasons.push("下注 range 含抽牌 / 空氣，可放寬 bluff-catcher");
    if (!reasons.length) reasons.push("range read 無明顯偏移，維持 v32B 基準頻率");

    const averageRangeConfidence = targetReads.length
        ? Number((targetReads.reduce((sum, r) => sum + Number(r.rangeConfidence || 0), 0) / targetReads.length).toFixed(2))
        : 0;

    return {
        version: "v37-range-impact",
        mode: "postflop-only",
        readCount: reads.length,
        targetReadCount: targetReads.length,
        averageRangeConfidence,
        averageStrongMade: Number(avg.strongMade.toFixed(3)),
        averageMediumMade: Number(avg.mediumMade.toFixed(3)),
        averageDraw: Number(avg.draw.toFixed(3)),
        averageAir: Number(avg.air.toFixed(3)),
        maxStrongMade: Number(maxStrongMade.toFixed(3)),
        maxAir: Number(maxAir.toFixed(3)),
        maxDraw: Number(maxDraw.toFixed(3)),
        bucketCounts,
        modelTags: Array.from(tagSet),
        rangeWeak: foldPressure >= 0.18 || avg.air >= 0.38,
        rangeStrong: strongRisk >= 0.20 || maxStrongMade >= 0.34,
        rangeValueTarget: valuePressure >= 0.14,
        rangeBluffCatcherSupport: bluffCatcherSupport >= 0.10,
        foldPressure: Number(foldPressure.toFixed(3)),
        strongRisk: Number(strongRisk.toFixed(3)),
        valuePressure: Number(valuePressure.toFixed(3)),
        bluffCatcherSupport: Number(bluffCatcherSupport.toFixed(3)),
        cBetFreqDelta: Number(clampNumber(foldPressure - strongRisk * 0.55, -0.22, 0.28).toFixed(3)),
        delayedCBetFreqDelta: Number(clampNumber(foldPressure * 0.90 - strongRisk * 0.50, -0.20, 0.26).toFixed(3)),
        thinValueFreqDelta: Number(clampNumber(valuePressure - strongRisk * 0.35, -0.18, 0.28).toFixed(3)),
        semiBluffFreqDelta: Number(clampNumber(foldPressure * 0.65 - strongRisk * 0.45, -0.18, 0.22).toFixed(3)),
        bluffCatcherThresholdMultiplier: Number(clampNumber(1 - bluffCatcherSupport + strongRisk * 0.32, 0.78, 1.16).toFixed(3)),
        reasons,
        note: "v37 uses range impact only for postflop; low-confidence range still cannot create heavy exploit, but standard c-bet/delayed-c-bet and risk-control overrides may apply"
    };
}


function buildV36DConfidenceGate(rangeImpact) {
    const confidence = Number(rangeImpact && rangeImpact.averageRangeConfidence || 0);
    let confidenceBand = "none";
    let frequencyScale = 0.25;
    let allowedImpact = "tiny";
    let allowOverride = false;
    let allowStrongExploit = false;
    const reasons = [];

    if (confidence < 0.25) {
        confidenceBand = "low";
        frequencyScale = 0;
        allowedImpact = "baseline-only";
        reasons.push("range confidence 低於 0.25，不允許正式 range exploit；只保留 baseline 翻後行為");
    } else if (confidence < 0.45) {
        confidenceBand = "medium-low";
        frequencyScale = 0.55;
        allowedImpact = "small";
        allowOverride = true;
        reasons.push("range confidence 介於 0.25–0.45，只允許小幅 postflop 調整");
    } else if (confidence < 0.65) {
        confidenceBand = "medium";
        frequencyScale = 0.85;
        allowedImpact = "normal";
        allowOverride = true;
        reasons.push("range confidence 介於 0.45–0.65，允許正常但有限的 postflop exploit");
    } else {
        confidenceBand = "high";
        frequencyScale = 1.05;
        allowedImpact = "strong-postflop-only";
        allowOverride = true;
        allowStrongExploit = true;
        reasons.push("range confidence 高於 0.65，允許較明顯但仍限於 postflop 的 exploit");
    }

    return {
        version: "v37-confidence-gate",
        rangeConfidence: Number(confidence.toFixed(2)),
        confidenceBand,
        frequencyScale,
        allowedImpact,
        allowOverride,
        allowStrongExploit,
        reason: reasons.join("；"),
        untouched: ["preflop-short-stack-chart", "all-in-call-range"]
    };
}

function buildV36DDelayedCBetPlan(args) {
    const impact = args.v36ARangeImpact || {};
    const gate = args.v36DConfidenceGate || {};
    const hero = args.hero || {};
    const texture = args.texture || {};
    const madeCategory = hero.made ? hero.made.category : 0;
    const equity = Number(args.equity || 0);
    const hasRealDraw = !!(!args.isRiver && (hero.hasComboDraw || hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot));
    const hasShowdownOrProtection = !!(
        madeCategory >= 1 || hero.hasTopPair || hero.hasOverPair || hero.hasSecondPair ||

function chooseMixedTier(weightedTiers) {
    const total = weightedTiers.reduce((sum, item) => sum + item.weight, 0);
    if (total <= 0) return weightedTiers[0]?.tier || "medium";

    let r = Math.random() * total;

    for (const item of weightedTiers) {
        r -= item.weight;
        if (r <= 0) return item.tier;
    }

    return weightedTiers[weightedTiers.length - 1].tier;
}

function adjustTier(tier, steps) {
    const order = ["micro", "small", "medium", "large", "polar", "overbet", "jam"];
    const idx = order.indexOf(tier);
    if (idx === -1) return tier;
    const next = Math.max(0, Math.min(order.length - 1, idx + steps));
    return order[next];
}

function chooseSizingTier(context) {
    const { equity, texture, hero, purpose, spr, opponents } = context;
    const multiway = opponents >= 2;
    const lowSPR = spr <= 1.5;
    const midLowSPR = spr > 1.5 && spr <= 3;
    const deepSPR = spr >= 8;

    let tier = "medium";

    if (purpose === "value") {
        if (texture.wetness === "dry") {
            tier = chooseMixedTier([
                { tier: "small", weight: 70 },
                { tier: "medium", weight: 25 },
                { tier: "large", weight: 5 }
            ]);
        } else if (texture.wetness === "medium") {
            tier = chooseMixedTier([
                { tier: "medium", weight: 65 },
                { tier: "large", weight: 30 },
                { tier: "small", weight: 5 }
            ]);
        } else if (texture.wetness === "wet") {
            tier = chooseMixedTier([
                { tier: "large", weight: 70 },
                { tier: "polar", weight: 20 },
                { tier: "medium", weight: 10 }
            ]);
        } else if (texture.wetness === "dangerous") {
            tier = hero.hasEffectiveStrongMade
                ? chooseMixedTier([{ tier: "large", weight: 50 }, { tier: "polar", weight: 40 }, { tier: "overbet", weight: 10 }])
                : chooseMixedTier([{ tier: "medium", weight: 60 }, { tier: "large", weight: 35 }, { tier: "small", weight: 5 }]);
        } else if (texture.wetness === "locked") {
            tier = (hero.hasFlush || hero.hasEffectiveStrongMade || hero.hasNutLikeMade)
                ? chooseMixedTier([{ tier: "large", weight: 45 }, { tier: "polar", weight: 45 }, { tier: "overbet", weight: 10 }])
                : chooseMixedTier([{ tier: "small", weight: 60 }, { tier: "medium", weight: 40 }]);
        }
    }

    if (purpose === "protection") {
        if (texture.wetness === "wet") tier = chooseMixedTier([{ tier: "medium", weight: 50 }, { tier: "large", weight: 45 }, { tier: "polar", weight: 5 }]);
        else if (texture.wetness === "dangerous") tier = chooseMixedTier([{ tier: "medium", weight: 45 }, { tier: "large", weight: 50 }, { tier: "polar", weight: 5 }]);
        else if (texture.wetness === "locked") tier = chooseMixedTier([{ tier: "small", weight: 25 }, { tier: "medium", weight: 60 }, { tier: "large", weight: 15 }]);
        else tier = chooseMixedTier([{ tier: "small", weight: 35 }, { tier: "medium", weight: 55 }, { tier: "large", weight: 10 }]);

        } else if (texture.wetness === "medium") {

        } else if (texture.wetness === "medium") {
            tier = chooseMixedTier([{ tier: "small", weight: 50 }, { tier: "medium", weight: 45 }, { tier: "large", weight: 5 }]);

        if (purpose === "thinValue") tier = adjustTier(tier, -1);

function tierToPotRatio(tier) {
    const ratios = {
        micro: 0.25,
        small: 0.33,
        medium: 0.50,
        large: 0.75,
        polar: 1.00,
        overbet: 1.25
    };

    return ratios[tier] || 0.50;
}

function roundToBlindUnit(amount) {
    const unit = Math.max(1, Math.floor(smallBlind));
    return Math.max(unit, Math.round(amount / unit) * unit);
}

function sizingToBetAmount(tier, index) {
    const p = players[index];

    if (tier === "jam") return p.chips;

    let amount = roundToBlindUnit(pot * tierToPotRatio(tier));
    amount = Math.max(minRaise, amount);

    if (amount >= p.chips * 0.92) return p.chips;

    return Math.min(amount, p.chips);
}

function sizingToRaiseTo(tier, index, toCall) {
    const p = players[index];
    const maxRaiseTo = p.currentBet + p.chips;

    if (tier === "jam") return maxRaiseTo;

    let raiseExtra = roundToBlindUnit((pot + toCall) * tierToPotRatio(tier));
    raiseExtra = Math.max(minRaise, raiseExtra);

    let raiseTo = currentBet + raiseExtra;
    const legalMinRaiseTo = getLegalMinRaiseTo();

    if (raiseTo >= maxRaiseTo * 0.92) return maxRaiseTo;

    if (raiseTo < legalMinRaiseTo && raiseTo < maxRaiseTo) {
        return null;
    }

    return Math.min(raiseTo, maxRaiseTo);
}

function chooseBetSize(index, equity, texture, hero, purpose) {

function applyRangeMcDefensiveOverlay(index, plan, rawMonteCarloEquity, toCall) {
    if (!plan || toCall <= 0 || !Number.isFinite(rawMonteCarloEquity)) {
        return plan;
    }

    const p = players[index];
    const currentPot = Math.max(1, pot);
    const potOdds = toCall / Math.max(1, currentPot + toCall);
    const opponentCount = Math.max(1, getShowdownOpponentCount(index));
    const isRiver = board.length >= 5;
    const multiway = opponentCount >= 2;
    const severePressure = toCall > currentPot * 0.85;
    const purpose = plan.v32Purpose || plan.purpose || (lastSizingDebug ? lastSizingDebug.purpose : null) || "-";

    // Monte Carlo is noisy. Require a small edge before it is allowed to
    // rescue a fold, and give river/multiway/large-bet spots a wider guard.
    let safetyMargin = 0.025;
    if (isRiver) safetyMargin += 0.015;
    if (multiway) safetyMargin += 0.020;
    if (severePressure) safetyMargin += 0.015;

    const callFloor = potOdds + safetyMargin;
    const foldFloor = Math.max(0, potOdds - safetyMargin);
    const originalType = plan.type;
    let finalType = originalType;
    let reason = "no-change";

    // Raw MC can improve defensive accuracy, but it is not allowed to invent
    // new aggression. A fold may become a call; a loose call may become a fold.
    if (originalType === "fold" && rawMonteCarloEquity >= callFloor) {
        finalType = "call";
        reason = "raw-mc-rescues-fold";
    } else if (originalType === "call" && rawMonteCarloEquity < foldFloor) {
        finalType = "fold";
        reason = "raw-mc-rejects-negative-call";
    } else if (originalType === "raise") {
        const isBluffPurpose =
            purpose === "bluff" ||
            purpose === "semiBluff" ||
            purpose === "blockerBluff" ||
            purpose === "rangeProbe";

        // Do not use showdown equity to suppress intentional bluffs.
        // For value/protection raises, however, a clearly negative defensive
        // equity estimate downgrades the action instead of stacking off.
        if (!isBluffPurpose && rawMonteCarloEquity < foldFloor) {
            finalType = "fold";
            reason = "raw-mc-blocks-negative-value-raise";
        } else if (!isBluffPurpose && rawMonteCarloEquity < callFloor) {
            finalType = "call";
            reason = "raw-mc-downgrades-thin-raise";
        }
    }

    return {
        ...plan,
        type: finalType,
        defensiveMcOverlay: {
            version: "v38-defensive-range-mc",
            originalType,
            finalType,
            purpose,
            rawMonteCarloEquity,
            potOdds,
            safetyMargin,
            callFloor,
            foldFloor,
            opponentCount,
            multiway,
            severePressure,
            reason,
            aggressionCanOnlyDecrease: true
        }
    };
}

    if (plan.type === "check" || plan.type === "call") {
        callPlayer(index);
        return;
    }

    if (plan.type === "bet") {
        if (plan.amount === null || plan.amount === undefined || !Number.isFinite(plan.amount) || plan.amount <= 0) {
            callPlayer(index);
        } else {
            raisePlayer(index, currentBet + plan.amount);
        }
        return;
    }

    if (plan.type === "raise") {
        if (plan.amount === null || plan.amount === undefined || !Number.isFinite(plan.amount)) {
            callPlayer(index);
        } else {
            raisePlayer(index, plan.amount);
        }
        return;
    }

    foldPlayer(index);
}
