            console.warn("estimateOpponentRange failed; Monte Carlo will use fallback random cards", x.player.name, err);
            return {};
        }
    });

    return {
        indices: opponents.map(x => x.index),
        names: opponents.map(x => x.player.name),
        ranges
    };
}

function estimateRangeAwarePostflopEquity(index, options = {}) {
    const p = players[index];
    const heuristicEquity = estimateHeuristicPostflopEquity(index);
    const timeLimitMs = Math.max(50, Number(options.timeLimitMs) || (autoPlayMode ? 55 : 180));
    const timeoutMs = Math.max(timeLimitMs + 300, Number(options.timeoutMs) || (autoPlayMode ? 450 : 800));

    if (!p || !p.hole || p.hole.length !== 2 || board.length < 3) {
        return Promise.resolve({
            equity: heuristicEquity,
            trials: 0,
            source: "heuristic-invalid-state",
            opponentCount: 0,
            opponentNames: [],
            timeLimitMs,
            heuristicEquity
        });
    }

    const opponentData = getMonteCarloOpponentData(index);

    if (opponentData.indices.length === 0) {
        return Promise.resolve({
            equity: heuristicEquity,
            trials: 0,
            source: "heuristic-no-opponent",
            opponentCount: 0,
            opponentNames: [],
            timeLimitMs,
            heuristicEquity
        });
    }

    let worker;

    try {
        worker = createGtoWorker();
    } catch (err) {
        console.warn("Monte Carlo worker creation failed; using heuristic equity", err);
        return Promise.resolve({
            equity: heuristicEquity,
            trials: 0,
            source: "heuristic-worker-create-fallback",
            opponentCount: opponentData.indices.length,
            opponentNames: opponentData.names,
            timeLimitMs,
            heuristicEquity
        });
    }

    return new Promise(resolve => {
        let settled = false;

        function finish(result) {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            try {
                worker.terminate();
            } catch (err) {
                console.warn("Monte Carlo worker terminate failed", err);
            }
            resolve(result);
        }

        const timeoutId = setTimeout(() => {
            finish({
                equity: heuristicEquity,
                trials: 0,
                source: "heuristic-monte-carlo-timeout",
                opponentCount: opponentData.indices.length,
                opponentNames: opponentData.names,
                timeLimitMs,
                heuristicEquity
            });
        }, timeoutMs);

        worker.onmessage = event => {
            const result = event && event.data ? event.data : {};
            const equity = Number(result.equity);
            const trials = Number(result.trials) || 0;

            if (!Number.isFinite(equity) || trials <= 0) {
                finish({
                    equity: heuristicEquity,
                    trials,
                    source: "heuristic-invalid-monte-carlo-result",
                    opponentCount: opponentData.indices.length,
                    opponentNames: opponentData.names,
                    timeLimitMs,
                    heuristicEquity
                });
                return;
            }

            finish({
                equity: Math.max(0, Math.min(1, equity)),
                trials,
                source: "range-aware-monte-carlo",
                opponentCount: opponentData.indices.length,
                opponentNames: opponentData.names,
                timeLimitMs,
                heuristicEquity
            });
        };

        worker.onerror = err => {
            console.warn("Monte Carlo worker failed; using heuristic equity", err);
            finish({
                equity: heuristicEquity,
                trials: 0,
                source: "heuristic-monte-carlo-error",
                opponentCount: opponentData.indices.length,
                opponentNames: opponentData.names,
                timeLimitMs,
                heuristicEquity
            });
        };

        worker.postMessage({
            holeCards: p.hole.map(card => ({ rank: card.rank, suit: card.suit })),
            currentBoard: board.map(card => ({ rank: card.rank, suit: card.suit })),
            opponentRanges: opponentData.ranges,
            opponentsCount: opponentData.indices.length,
            timeLimitMs,
            deckContext: getUnknownDeckForGto(p)
        });
    });
}


function performGTODecision(index) {
    const p = players[index];

    if (!p || !canAct(p)) {
        actionIndex = nextPlayableIndex(index >= 0 ? index : dealerIndex);
        proceedTurn();
        return;
    }

    const actingIndex = index;
    const actionToken = ++pendingAiActionToken;
    pendingAiActionIndex = actingIndex;
    pendingAiActionHandId = handLifecycleId;
    startTurnWatchdog(actingIndex, actionToken);

    p.lastAction = "思考中";
    log(p.name + " 思考中。");
    render();

    const humanDelay = autoPlayMode ? 0 : randomInt(650, 1500);

    if (p.isHuman && humanTestMode !== "none") {
        setTimeout(() => {
            if (!isPendingAiAction(actingIndex, actionToken)) return;

            try {
                executeHumanTestAction(actingIndex);
                finishAiTurn(actingIndex);
            } catch (err) {
                console.error("human test decision failed", err);
                safeFallbackAiAction(actingIndex, "human-test-exception");
            }
        }, humanDelay);
        return;
    }

    if (street === "preflop") {
        setTimeout(() => {
            if (!isPendingAiAction(actingIndex, actionToken)) return;

            try {
                executePreflopAction(actingIndex);
                finishAiTurn(actingIndex);
            } catch (err) {
                console.error("preflop AI decision failed", err);
                safeFallbackAiAction(actingIndex, "preflop-exception");
            }
        }, humanDelay);
        return;
    }

    const toCall = Math.max(0, currentBet - p.currentBet);

    setTimeout(async () => {
        if (!isPendingAiAction(actingIndex, actionToken)) return;

        try {
            pendingAiDebugInfo[actingIndex] = {
                aiName: p.name,
                street,
                toCall,
                opponentRanges: getSafeOpponentRangeDebug(actingIndex)
            };

            if (street === "flop") {
                const flopCfrResult = await requestFlopDepthCfrDecision(
                    actingIndex,
                    {
                        timeLimitMs: autoPlayMode ? 80 : 260,
                        minIterations: autoPlayMode ? 400 : 1200,
                        maxIterations: autoPlayMode ? 6000 : 20000,
                        timeoutMs: autoPlayMode ? 750 : 1100
                    }
                );

                if (!isPendingAiAction(actingIndex, actionToken)) return;

                pendingAiDebugInfo[actingIndex] = {
                    ...(pendingAiDebugInfo[actingIndex] || {}),
                    flopCfrAttempt: flopCfrResult.reason || "none",
                    flopCfrNode: flopCfrResult.nodeId || null,
                    flopCfrIterations: flopCfrResult.iterations || 0,
                    flopCfrBucketVisits: flopCfrResult.bucketVisits || 0
                };

                if (flopCfrResult.handled) {
                    const executed = executeFlopDepthCfrAction(
                        actingIndex,
                        flopCfrResult.action
                    );

                    if (executed) {
                        recordFlopCfrDecisionDebug(
                            actingIndex,
                            flopCfrResult
                        );
                        finishAiTurn(actingIndex);
                        return;
                    }

                    pendingAiDebugInfo[actingIndex] = {
                        ...(pendingAiDebugInfo[actingIndex] || {}),
                        flopCfrAttempt: "flop-cfr-action-execution-failed"
                    };
                }
            }

            const equityResult = await estimateRangeAwarePostflopEquity(actingIndex, {
                timeLimitMs: autoPlayMode ? 55 : 180,
                timeoutMs: autoPlayMode ? 450 : 800
            });

            // Worker 回來時，牌局可能已被重開、watchdog 接管或 action token 已失效。
            if (!isPendingAiAction(actingIndex, actionToken)) return;

            const rawMonteCarloEquity = equityResult.equity;
            const heuristicEquity = equityResult.heuristicEquity;
            const strategyEquity = equityResult.source === "range-aware-monte-carlo"
                ? heuristicEquity + RANGE_MC_STRATEGY_ALPHA * (rawMonteCarloEquity - heuristicEquity)
                : rawMonteCarloEquity;

            pendingAiDebugInfo[actingIndex] = {
                ...(pendingAiDebugInfo[actingIndex] || {}),
                equitySource: equityResult.source,
                monteCarloTrials: equityResult.trials,
                monteCarloOpponents: equityResult.opponentCount,
                monteCarloOpponentNames: equityResult.opponentNames,
                monteCarloTimeLimitMs: equityResult.timeLimitMs,
                rawMonteCarloEquity,
                strategyEquity,
                strategyEquityAlpha: equityResult.source === "range-aware-monte-carlo" ? RANGE_MC_STRATEGY_ALPHA : 0,
                heuristicEquity
            };

            executeGTOAction(actingIndex, strategyEquity, toCall);
            finishAiTurn(actingIndex);
        } catch (err) {
            console.error("range-aware postflop AI decision failed", err);
            recordAiRuntimeError(actingIndex, "postflop-range-aware", err);

            try {
                const equity = estimateHeuristicPostflopEquity(actingIndex);

                pendingAiDebugInfo[actingIndex] = {
                    ...(pendingAiDebugInfo[actingIndex] || {}),
                    equitySource: "heuristic-exception-fallback",
                    monteCarloTrials: 0,
                    heuristicEquity: equity
                };

                executeGTOAction(actingIndex, equity, toCall);
                finishAiTurn(actingIndex);
            } catch (innerErr) {
                console.error("secondary postflop fallback failed", innerErr);
                recordAiRuntimeError(actingIndex, "postflop-secondary-fallback", innerErr);
                safeFallbackAiAction(actingIndex, "postflop-range-aware-exception");
            }
        }
    }, humanDelay);
}

function getUnknownDeckForGto(aiPlayer) {
    const used = [];

    for (const c of aiPlayer.hole) used.push(cardKey(c));
    for (const c of board) used.push(cardKey(c));

    const full = createDeck();

    return full.filter(c => !used.includes(cardKey(c)));
}

function analyzeBoardTexture(boardCards) {
    const result = {
        streetCards: boardCards.length,
        paired: false,
        tripsOnBoard: false,
        twoPairOnBoard: false,
        twoTone: false,
        monotone: false,
        fourFlush: false,
        rainbow: false,
        connected: false,
        semiConnected: false,
        broadwayHeavy: false,
        lowConnected: false,
        aceHighDry: false,
        wetness: "none",
        score: 0
    };

    if (boardCards.length < 3) return result;

    const ranks = boardCards.map(c => c.rank).sort((a, b) => b - a);
    const suits = boardCards.map(c => c.suit);

    const rankCounts = {};
    const suitCounts = {};

    for (const r of ranks) rankCounts[r] = (rankCounts[r] || 0) + 1;
    for (const s of suits) suitCounts[s] = (suitCounts[s] || 0) + 1;

    const rankCountValues = Object.values(rankCounts);
    const suitCountValues = Object.values(suitCounts);
    const maxSuitCount = Math.max(...suitCountValues);

    result.paired = rankCountValues.some(x => x >= 2);
    result.tripsOnBoard = rankCountValues.some(x => x >= 3);
    result.twoPairOnBoard = rankCountValues.filter(x => x >= 2).length >= 2;
    result.twoTone = maxSuitCount === 2;
    result.monotone = maxSuitCount >= 3;
    result.fourFlush = maxSuitCount >= 4;
    result.rainbow = boardCards.length >= 3 && maxSuitCount === 1;
    result.broadwayHeavy = ranks.filter(r => r >= 10).length >= 2;

    const uniqueRanks = [...new Set(ranks)].sort((a, b) => b - a);
    const straightRanks = uniqueRanks.slice();
    if (straightRanks.includes(14)) straightRanks.push(1);

    let closePairs = 0;
    let directConnects = 0;

    for (let i = 0; i < straightRanks.length; i++) {
        for (let j = i + 1; j < straightRanks.length; j++) {
            const gap = Math.abs(straightRanks[i] - straightRanks[j]);
            if (gap === 1) directConnects++;
            if (gap <= 2) closePairs++;
        }
    }

    result.connected = (directConnects >= 2 || hasThreeCardStraightWindow(straightRanks)) && !result.rainbow;
    result.semiConnected = !result.connected && closePairs >= 2;
    result.lowConnected = result.connected && Math.max(...uniqueRanks) <= 10;

    const hasAce = uniqueRanks.includes(14);
    const lowSpread = uniqueRanks.length >= 3 && Math.max(...uniqueRanks) - Math.min(...uniqueRanks) >= 5;
    result.aceHighDry = hasAce && result.rainbow && !result.connected && !result.semiConnected && !result.paired && lowSpread;

    let score = 0;
    if (result.twoTone) score += 1;
    if (result.monotone) score += 3;
    if (result.fourFlush) score += 5;
    if (result.connected) score += result.rainbow ? 1 : 3;
    if (result.semiConnected) score += 2;
    if (result.lowConnected) score += 1;
    if (result.paired) score += 1;
    if (result.tripsOnBoard) score += 3;
    if (result.twoPairOnBoard) score += 2;
    if (result.broadwayHeavy) score += 1;
    if (result.aceHighDry) score -= 3;
    if (result.rainbow && !result.connected && !result.semiConnected && !result.paired) score -= 2;

    result.score = score;

    if (score <= 0) result.wetness = "dry";
    else if (score <= 2) result.wetness = "medium";
    else if (score <= 5) result.wetness = "wet";
    else result.wetness = "dangerous";

    if (result.fourFlush || result.tripsOnBoard) result.wetness = "locked";

    return result;
}

function hasThreeCardStraightWindow(ranks) {
    const unique = [...new Set(ranks)].sort((a, b) => b - a);

    for (let i = 0; i < unique.length; i++) {
        const high = unique[i];
        let count = 0;

        for (let x = high; x >= high - 4; x--) {
            if (unique.includes(x)) count++;
        }

        if (count >= 3) return true;
    }

    return false;
}

function getBestHandHoleUsage(hole, boardCards, made) {
    const allCards = hole.concat(boardCards);
    if (!made || allCards.length < 5) {
        return { min: 0, max: 0, hasBoardOnly: false, hasOneHole: false, hasTwoHole: false };
    }

    const holeKeys = new Set(hole.map(c => cardKey(c)));
    let min = 99;
    let max = -1;

    for (let a = 0; a < allCards.length - 4; a++) {
        for (let b = a + 1; b < allCards.length - 3; b++) {
            for (let c = b + 1; c < allCards.length - 2; c++) {
                for (let d = c + 1; d < allCards.length - 1; d++) {
                    for (let e = d + 1; e < allCards.length; e++) {
                        const five = [allCards[a], allCards[b], allCards[c], allCards[d], allCards[e]];
                        const val = evaluateFive(five);
                        if (compareHands(val, made) === 0) {
                            const used = five.filter(card => holeKeys.has(cardKey(card))).length;
                            min = Math.min(min, used);
                            max = Math.max(max, used);
                        }
                    }
                }
            }
        }
    }

    if (max < 0) {
        return { min: 0, max: 0, hasBoardOnly: false, hasOneHole: false, hasTwoHole: false };
    }

    return {
        min,
        max,
        hasBoardOnly: min === 0,
        hasOneHole: min <= 1 && max >= 1,
        hasTwoHole: max >= 2
    };
}

function getFlushSuitDetails(hole, boardCards) {
    const allCards = hole.concat(boardCards);
    const suits = ["S", "H", "D", "C"];
    let best = null;

    for (const suit of suits) {
        const suitCards = allCards.filter(c => c.suit === suit).sort((a, b) => b.rank - a.rank);
        if (suitCards.length < 5) continue;

        const topFive = suitCards.slice(0, 5);
        const ranks = topFive.map(c => c.rank);
        const holeCount = topFive.filter(c => hole.some(h => cardKey(h) === cardKey(c))).length;
        const boardCount = topFive.length - holeCount;
        const highestHoleRank = Math.max(0, ...topFive.filter(c => hole.some(h => cardKey(h) === cardKey(c))).map(c => c.rank));

        const candidate = { suit, ranks, holeCount, boardCount, highestHoleRank };
        if (!best) best = candidate;
        else {
            for (let i = 0; i < 5; i++) {
                if (candidate.ranks[i] > best.ranks[i]) { best = candidate; break; }
                if (candidate.ranks[i] < best.ranks[i]) break;
            }
        }
    }

    return best;
}

function analyzeHeroBoardInteraction(hole, boardCards) {
    const allCards = hole.concat(boardCards);
    const made = bestOfSeven(allCards);
    const boardMade = boardCards.length >= 5 ? bestOfSeven(boardCards) : null;
    const usage = getBestHandHoleUsage(hole, boardCards, made);
    const boardRanks = boardCards.map(c => c.rank);
    const holeRanks = hole.map(c => c.rank).sort((a, b) => b - a);
    const highestBoardRank = boardRanks.length ? Math.max(...boardRanks) : 0;

    const boardRankCounts = {};
    for (const r of boardRanks) boardRankCounts[r] = (boardRankCounts[r] || 0) + 1;

    const boardPairRanks = Object.keys(boardRankCounts)
        .map(Number)
        .filter(r => boardRankCounts[r] >= 2)
        .sort((a, b) => b - a);
    const boardTripRanks = Object.keys(boardRankCounts)
        .map(Number)
        .filter(r => boardRankCounts[r] >= 3)
        .sort((a, b) => b - a);
    const hasExactlyOneBoardPair = boardPairRanks.length === 1 && boardTripRanks.length === 0;
    const boardPairRank = hasExactlyOneBoardPair ? boardPairRanks[0] : null;
    const boardTripRank = boardTripRanks.length ? boardTripRanks[0] : null;
    const unpairedBoardRanks = Object.keys(boardRankCounts)
        .map(Number)
        .filter(r => boardRankCounts[r] === 1);
    const holePairRank = hole[0].rank === hole[1].rank ? hole[0].rank : null;
    const holeMatchesBoardPair = boardPairRank !== null && holeRanks.includes(boardPairRank);
    const holeMatchesBoardTrips = boardTripRank !== null && holeRanks.includes(boardTripRank);
    const oneCardPairRankOnPairedBoard = hasExactlyOneBoardPair && holePairRank === null
        ? holeRanks.find(r => unpairedBoardRanks.includes(r)) || null
        : null;

    const madeCategory = made ? made.category : 0;
    const boardOnlySameBest = !!(boardMade && made && compareHands(boardMade, made) === 0);
    const boardOnlySameOrBetter = !!(boardMade && made && compareHands(boardMade, made) >= 0);
    const isRiver = boardCards.length >= 5;

    const hasPair = madeCategory >= 1;
    const hasTopPair = holeRanks.some(r => r === highestBoardRank) && madeCategory >= 1;
    const hasOverPair = hole[0].rank === hole[1].rank && hole[0].rank > highestBoardRank;

    const isTripsUsingHoleCard = madeCategory === 3 && holeMatchesBoardPair;
    const isBoardTripsOnly = madeCategory === 3 && boardTripRank !== null && !holeMatchesBoardTrips;
    const isBoardTripsWithWeakKicker = isBoardTripsOnly && holeRanks[0] < 12;

    const isPocketPairOnPairedBoard = hasExactlyOneBoardPair && holePairRank !== null && holePairRank !== boardPairRank && madeCategory === 2;
    const isPocketUnderpairOnPairedBoard = isPocketPairOnPairedBoard && holePairRank < highestBoardRank;
    const isPocketOverpairOnPairedBoard = isPocketPairOnPairedBoard && holePairRank > highestBoardRank;
    const isOneCardPairOnPairedBoard = hasExactlyOneBoardPair && oneCardPairRankOnPairedBoard !== null && madeCategory === 2;
    const isTopPairOnPairedBoard = isOneCardPairOnPairedBoard && oneCardPairRankOnPairedBoard === highestBoardRank;
    const isBoardPairedWeakTwoPair = madeCategory === 2 && hasExactlyOneBoardPair && !isPocketOverpairOnPairedBoard && (isPocketUnderpairOnPairedBoard || isOneCardPairOnPairedBoard);
    const isRealTwoPair = madeCategory === 2 && !isBoardPairedWeakTwoPair && (!hasExactlyOneBoardPair || isPocketOverpairOnPairedBoard) && usage.max >= 1;

    const isBoardOnlyStraight = madeCategory === 4 && boardOnlySameBest;
    // 若最佳順子可以只靠一張手牌完成，例如公共牌 A-Q-J-T 加手牌 K，
    // 就算另一張手牌也能被納入某個等價五張組合，策略上仍應視為一張牌順子。
    const isOneCardStraight = madeCategory === 4 && !isBoardOnlyStraight && usage.min <= 1;
    const isTwoCardStraight = madeCategory === 4 && !isBoardOnlyStraight && usage.min >= 2;
    const isAmbiguousOneCardStraight = madeCategory === 4 && !isBoardOnlyStraight && usage.min <= 1 && usage.max >= 2;
    const boardSuitCounts = {};
    boardCards.forEach(c => { boardSuitCounts[c.suit] = (boardSuitCounts[c.suit] || 0) + 1; });
    const boardMaxSuitCount = Math.max(0, ...Object.values(boardSuitCounts));
    const boardHasFlushThreat = boardMaxSuitCount >= 3;
    const boardHasFullHouseThreat = boardPairRanks.length > 0 || boardTripRanks.length > 0;
    // A-Q-J-T + K 這種單張補成的 Broadway，在無同花/葫蘆威脅時是堅果或至少必分池，不能被 all-in 嚇跑。
    // 但它也很容易跟其他 K 分池，所以進攻端不應等同於兩張手牌做成的隱蔽堅果。
    const isNutOneCardStraight = isOneCardStraight && !isBoardOnlyStraight && !boardHasFlushThreat && !boardHasFullHouseThreat;
    const isChopProneNutStraight = isNutOneCardStraight && boardCards.length >= 4;

    const isBoardOnlyFlush = madeCategory === 5 && boardOnlySameBest;
    const flushDetails = getFlushSuitDetails(hole, boardCards);
    const isOneCardFlush = madeCategory === 5 && !isBoardOnlyFlush && flushDetails && flushDetails.holeCount === 1;
    const isTwoCardFlush = madeCategory === 5 && flushDetails && flushDetails.holeCount >= 2;
    const isWeakOneCardFlush = isOneCardFlush && flushDetails && flushDetails.highestHoleRank <= 10;
    const isNutLikeOneCardFlush = isOneCardFlush && flushDetails && flushDetails.highestHoleRank >= 13;

    const isBoardOnlyFullHouse = madeCategory === 6 && boardOnlySameBest;
    const isBoardOnlyQuads = madeCategory === 7 && boardOnlySameBest;
    const isBoardOnlyStraightFlush = madeCategory === 8 && boardOnlySameBest;
    const isBoardOnlyMonster = madeCategory >= 4 && boardOnlySameBest;

    const isFakeTwoPair = isBoardPairedWeakTwoPair;
    const isFakeTrips = isBoardTripsOnly;
    const isFakeStraight = isBoardOnlyStraight;
    const isFakeFlush = isBoardOnlyFlush;
    const isFakeFullHouse = isBoardOnlyFullHouse;
    const isFakeQuads = isBoardOnlyQuads;

    const flushInfo = getFlushInfo(hole, boardCards);
    const straightInfo = getStraightDrawInfo(hole, boardCards);
    const overcardCount = holeRanks.filter(r => r > highestBoardRank).length;
    const hasFlushDraw = !isRiver && flushInfo.hasFlushDraw;
    const hasOpenEndedStraightDraw = !isRiver && straightInfo.openEnded;
    const hasGutshot = !isRiver && straightInfo.gutshot;
    const hasComboDraw = hasFlushDraw && (hasOpenEndedStraightDraw || hasGutshot);

    let effectiveMadeCategory = madeCategory;

    if (isBoardOnlyMonster) effectiveMadeCategory = Math.min(effectiveMadeCategory, 1);
    if (isBoardTripsOnly) effectiveMadeCategory = Math.min(effectiveMadeCategory, holeRanks[0] >= 13 ? 2 : 1);
    if (isBoardPairedWeakTwoPair) effectiveMadeCategory = Math.min(effectiveMadeCategory, isTopPairOnPairedBoard ? 2 : 1);
    if (isWeakOneCardFlush) effectiveMadeCategory = Math.min(effectiveMadeCategory, 3);
    if (isOneCardStraight && !isTwoCardStraight && !isNutOneCardStraight) effectiveMadeCategory = Math.min(effectiveMadeCategory, 3);

    const hasTwoPairOrBetter = madeCategory >= 2;
    const hasStrongMade = madeCategory >= 3;
    const hasEffectiveStrongMade = effectiveMadeCategory >= 3 && !isBoardOnlyMonster && !isBoardTripsOnly;
    // Legacy name: historically this meant "very strong made hand", not literal nuts.
    // Keep it for decision compatibility, but expose clearer debug fields below.
    const hasNutLikeMade =
        madeCategory >= 6 && !isBoardOnlyMonster ||
        isTwoCardFlush ||
        (isTwoCardStraight && !isOneCardStraight) ||
        isNutOneCardStraight ||
        isNutLikeOneCardFlush ||
        isTripsUsingHoleCard;
    const hasVeryStrongMade = hasNutLikeMade;
    const isActualNuts = !!(hasVeryStrongMade && isActualNutsOnCurrentBoard(hole, boardCards, made));
    const hasNearNutsMade = !!(hasVeryStrongMade && !isActualNuts);
    const madeStrengthDebugLabel = isActualNuts
        ? "actualNuts"
        : (hasNearNutsMade ? "nearNutsMade" : (hasEffectiveStrongMade ? "effectiveStrongMade" : (hasStrongMade ? "strongMade" : "normalMade")));

    return {
        made,
        boardMade,
        boardOnlySameBest,
        boardOnlySameOrBetter,
        bestHandHoleUsage: usage,
        effectiveMadeCategory,
        hasPair,
        hasTopPair,
        hasOverPair,
        hasTwoPairOrBetter,
        hasStrongMade,
        hasEffectiveStrongMade,
        hasNutLikeMade, // legacy alias: means veryStrongMade, not literal nuts
        hasVeryStrongMade,
        isActualNuts,
        hasNearNutsMade,
        madeStrengthDebugLabel,
        isTripsUsingHoleCard,
        isBoardTripsOnly,
        isBoardTripsWithWeakKicker,
        isPocketPairOnPairedBoard,
        isPocketUnderpairOnPairedBoard,
        isPocketOverpairOnPairedBoard,
        isOneCardPairOnPairedBoard,
        isTopPairOnPairedBoard,
        isBoardPairedWeakTwoPair,
        isRealTwoPair,
        isFakeTwoPair,
        isBoardOnlyStraight,
        isOneCardStraight,
        isTwoCardStraight,
        isAmbiguousOneCardStraight,
        isNutOneCardStraight,
        isChopProneNutStraight,
        isFakeStraight,
        isBoardOnlyFlush,
        isOneCardFlush,
        isTwoCardFlush,
        isWeakOneCardFlush,
        isNutLikeOneCardFlush,
        isFakeFlush,
        isBoardOnlyFullHouse,
        isFakeFullHouse,
        isBoardOnlyQuads,
        isFakeQuads,
        isBoardOnlyStraightFlush,
        isBoardOnlyMonster,
        isFakeTrips,
        hasFlush: (madeCategory === 5 || madeCategory === 8) && !isBoardOnlyFlush,
        hasFlushDraw,
        hasNutFlushBlocker: flushInfo.hasNutFlushBlocker,
        hasSecondNutFlushBlocker: flushInfo.hasSecondNutFlushBlocker,
        hasOpenEndedStraightDraw,
        hasGutshot,
        hasComboDraw,
        hasOvercards: overcardCount >= 2 && !hasPair,
        overcardCount
    };
}

function getFlushInfo(hole, boardCards) {
    const suits = ["S", "H", "D", "C"];
    let hasFlushDraw = false;
    let hasNutFlushBlocker = false;
    let hasSecondNutFlushBlocker = false;

    for (const suit of suits) {
        const boardCount = boardCards.filter(c => c.suit === suit).length;
        const holeSuitCards = hole.filter(c => c.suit === suit);
        const totalCount = boardCount + holeSuitCards.length;

        if (boardCards.length < 5 && totalCount === 4 && holeSuitCards.length > 0) hasFlushDraw = true;
        if (boardCount >= 3 && holeSuitCards.some(c => c.rank === 14)) hasNutFlushBlocker = true;
        if (boardCount >= 3 && holeSuitCards.some(c => c.rank === 13)) hasSecondNutFlushBlocker = true;
    }

    return { hasFlushDraw, hasNutFlushBlocker, hasSecondNutFlushBlocker };
}

function getStraightDrawInfo(hole, boardCards) {
    if (boardCards.length >= 5) return { openEnded: false, gutshot: false };

    const ranks = [...new Set(hole.concat(boardCards).map(c => c.rank))];
    if (ranks.includes(14)) ranks.push(1);

    let openEnded = false;
    let gutshot = false;

    for (let low = 1; low <= 10; low++) {
        const window = [low, low + 1, low + 2, low + 3, low + 4];
        const present = window.filter(r => ranks.includes(r));

        if (present.length === 4) {
            const missing = window.find(r => !ranks.includes(r));
            if (missing === low || missing === low + 4) openEnded = true;
            else gutshot = true;
        }
    }

    return { openEnded, gutshot };
}

function choosePostflopPlan(index, equity, toCall) {
    const p = players[index];
    const texture = analyzeBoardTexture(board);
    const hero = analyzeHeroBoardInteraction(p.hole, board);
    const currentPot = pot;
    const potOdds = toCall > 0 ? toCall / (currentPot + toCall) : 0;
    const r = Math.random();
    const profileName = p.profile ? p.profile.name : "";
    const isLagProfile = profileName === "鬆凶型";
    const isStationProfile = profileName === "跟注站";
    const isNitProfile = profileName === "極緊型";
    const exploitInfo = getHumanPostflopExploitInfo(index);
    let profileBluffFreq = isLagProfile ? 1.35 : isNitProfile ? 0.45 : isStationProfile ? 0.55 : 1.00;
    let profileSemiBluffFreq = isLagProfile ? 1.25 : isNitProfile ? 0.65 : isStationProfile ? 0.75 : 1.00;
    let profileThinValueFreq = isLagProfile ? 1.15 : isNitProfile ? 0.75 : isStationProfile ? 0.90 : 1.00;
    let profileCallDiscipline = isStationProfile ? 0.92 : isNitProfile ? 1.12 : isLagProfile ? 1.02 : 1.00;

    const strategicActiveCount = activePlayerCount();
    const headsUpTable = strategicActiveCount <= 2;
    const shortHandedTable = strategicActiveCount <= 4;

    if (headsUpTable) {
        profileBluffFreq *= 1.28;
        profileSemiBluffFreq *= 1.22;
        profileThinValueFreq *= 1.30;
        profileCallDiscipline *= 0.92;
    } else if (shortHandedTable) {
        profileBluffFreq *= 1.12;
        profileSemiBluffFreq *= 1.10;
        profileThinValueFreq *= 1.14;
        profileCallDiscipline *= 0.96;
    }

    profileBluffFreq *= exploitInfo.bluffFactor;
    profileSemiBluffFreq *= exploitInfo.semiBluffFactor;
    profileThinValueFreq *= exploitInfo.valueFactor;
    profileCallDiscipline *= exploitInfo.callFactor;

    const isRiver = board.length >= 5;
    const madeCategory = hero.made ? hero.made.category : 0;
    const effectiveCategory = Number.isFinite(hero.effectiveMadeCategory) ? hero.effectiveMadeCategory : madeCategory;
    const boardIsPaired = texture.paired || texture.tripsOnBoard || texture.twoPairOnBoard;
    const bigBetPressure = toCall > currentPot * 0.55;
    const severeBetPressure = toCall > currentPot * 0.85;
    const opponents = getPostflopOpponentCount(index);
    const multiway = opponents >= 2;
    const weakPairedTwoPair = !!hero.isBoardPairedWeakTwoPair;
    const boardMadeOrFake = !!(hero.isBoardOnlyMonster || hero.isBoardTripsOnly || hero.isFakeTwoPair || hero.isFakeStraight || hero.isFakeFlush || hero.isFakeFullHouse || hero.isFakeQuads);
    const vulnerableOneCardMade = !!(hero.isWeakOneCardFlush || (hero.isOneCardStraight && !hero.isTwoCardStraight && !hero.isNutOneCardStraight));
    // paired board 上的「overpair + board pair」雖然技術上是真兩對，但不是可隨便加注的大牌。
    const pairedBoardCappedTwoPair = boardIsPaired && madeCategory === 2 && hero.isRealTwoPair && !hero.isTripsUsingHoleCard && !hero.hasNutLikeMade;
    const valuableTwoPairOrBetter = !boardMadeOrFake && !vulnerableOneCardMade && (
        hero.hasNutLikeMade ||
        hero.hasEffectiveStrongMade ||
        (hero.isRealTwoPair && (!pairedBoardCappedTwoPair || equity >= 0.62)) ||
        (hero.isPocketOverpairOnPairedBoard && equity >= 0.58)
    );

    // 河牌沒有 draw，也沒有 protection bet / raise。
    // 桌面自己成牌、paired board 假兩對、board trips、假同花/假順子，都不准當成 nuts 反加。
    const riverRaiseValue =
        !boardMadeOrFake && !vulnerableOneCardMade && (
            hero.hasNutLikeMade ||
            madeCategory >= 6 ||
            (madeCategory >= 4 && equity >= 0.82) ||
            (madeCategory >= 3 && equity >= 0.86) ||
            equity >= 0.92
        );

    const riverThinValue =
        !boardMadeOrFake && (
            hero.hasEffectiveStrongMade ||
            (madeCategory === 2 && !weakPairedTwoPair && equity >= 0.66 && !severeBetPressure) ||
            (weakPairedTwoPair && equity >= 0.76 && !bigBetPressure) ||
            (hero.hasTopPair && equity >= 0.70 && !bigBetPressure)
        );

    const nonRiverVeryStrong = !boardMadeOrFake && !vulnerableOneCardMade && (
        equity >= 0.82 ||
        hero.hasNutLikeMade ||
        hero.hasEffectiveStrongMade ||
        (hero.isRealTwoPair && (!pairedBoardCappedTwoPair || equity >= 0.62)) ||
        (hero.isPocketOverpairOnPairedBoard && equity >= 0.66)
    );
    const nonRiverStrong = !boardMadeOrFake && !vulnerableOneCardMade && (
        equity >= 0.70 ||
        (hero.hasTopPair && equity >= (multiway ? 0.54 : 0.50)) ||
        (hero.hasOverPair && equity >= 0.55) ||
        (hero.hasTwoPairOrBetter && !weakPairedTwoPair && !pairedBoardCappedTwoPair && equity >= 0.58)
    );
    const drawing = !isRiver && (hero.hasFlushDraw || hero.hasOpenEndedStraightDraw || hero.hasGutshot || hero.hasOvercards);
    const blockerBluff = hero.hasNutFlushBlocker || hero.hasSecondNutFlushBlocker;

    if (isRiver) {
        if (toCall > 0 && hero.isNutOneCardStraight) {
            // 無同花/葫蘆威脅的單張 Broadway 是堅果或必分池；面對 all-in 不能被嚇跑。
            // 但因為常與任一 K 分池，主動再加注仍要看 equity 與壓力。
            if (equity >= potOdds * 0.92 || toCall <= currentPot * 1.25) return { type: "call" };
        }

        if (boardMadeOrFake) {
            if (toCall === 0) return { type: "check" };
            if (equity >= potOdds * 1.12 && !severeBetPressure) return { type: "call" };
            if (equity >= 0.50 && toCall <= currentPot * 0.20) return { type: "call" };
            return { type: "fold" };
        }

        if (vulnerableOneCardMade && toCall > 0 && severeBetPressure && equity < 0.74) {
            return { type: "fold" };
        }

        if (toCall === 0) {
            if (riverRaiseValue) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "value") };
            }

            if (riverThinValue && r < 0.52 * profileThinValueFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }

            if (exploitInfo.callingStation && !boardMadeOrFake && !vulnerableOneCardMade && equity >= 0.62 && madeCategory >= 1 && !severeBetPressure) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }

            if (!boardMadeOrFake && (texture.fourFlush || texture.monotone || boardIsPaired) && blockerBluff && equity < 0.45 && r < 0.08 * profileBluffFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "blockerBluff") };
            }

            return { type: "check" };
        }

        if (riverRaiseValue) {
            if (r < 0.34) {
                return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "value", equity) };
            }
            return { type: "call" };
        }

        if (riverThinValue) {
            if (equity >= potOdds * 1.05 && (!severeBetPressure || madeCategory >= 3 || equity >= 0.76)) {
                return { type: "call" };
            }
            return { type: "fold" };
        }

        if (madeCategory >= 1 || equity >= potOdds * 1.20) {
            if (equity >= potOdds * 1.15 && !severeBetPressure) {
                return { type: "call" };
            }
        }

        if (!boardMadeOrFake && (texture.fourFlush || texture.monotone || boardIsPaired) && blockerBluff && r < 0.04 * profileBluffFreq) {
            return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "blockerBluff", equity) };
        }

        return { type: "fold" };
    }

    if (toCall === 0) {
        if (boardMadeOrFake || vulnerableOneCardMade) {
            if (!boardMadeOrFake && equity >= 0.68 && opponents <= 1 && r < 0.28) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }
            if (equity >= 0.72 && opponents <= 1 && r < 0.16) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }
            return { type: "check" };
        }

        if (weakPairedTwoPair) {
            if (equity >= 0.66 && opponents <= 1 && r < 0.45 * profileThinValueFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }
            if (equity >= 0.58 && opponents <= 1 && r < 0.20 * profileThinValueFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }
            return { type: "check" };
        }

        if (nonRiverVeryStrong) {
            return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "value") };
        }

        const v26HeadsUpProbe =
            headsUpTable &&
            opponents <= 1 &&
            !boardMadeOrFake &&
            !vulnerableOneCardMade &&
            !weakPairedTwoPair &&
            (
                (madeCategory >= 1 && equity >= 0.42) ||
                (hero.hasTopPair && equity >= 0.46) ||
                (hero.hasOverPair && equity >= 0.50) ||
                (!isRiver && drawing && equity >= 0.31)
            );

        if (v26HeadsUpProbe && r < 0.54 * profileThinValueFreq) {
            const purpose = (!isRiver && drawing && madeCategory === 0) ? "semiBluff" : "thinValue";
            return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, purpose) };
        }

        if (nonRiverStrong) {
            if (texture.wetness === "dangerous" || texture.wetness === "locked") {
                if ((hero.hasOverPair || hero.hasTopPair || hero.hasTwoPairOrBetter) && equity >= (multiway ? 0.64 : 0.60) && r < 0.72 * profileThinValueFreq) {
                    return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "protection") };
                }
                if (hero.hasTopPair && !hero.hasTwoPairOrBetter && (equity < 0.58 || r < 0.42)) return { type: "check" };
                if (!hero.hasEffectiveStrongMade && !hero.hasNutLikeMade && equity < (multiway ? 0.60 : 0.54)) return { type: "check" };
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "protection") };
            }

            if (equity < (multiway ? 0.52 : 0.48) && !hero.hasTwoPairOrBetter) return { type: "check" };
            if ((exploitInfo.callingStation || exploitInfo.veryLoose) && equity >= (multiway ? 0.56 : 0.52) && madeCategory >= 1) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            }
            if ((hero.hasTopPair || hero.hasOverPair) && equity >= (multiway ? 0.60 : 0.55) && r < 0.74 * profileThinValueFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "protection") };
            }
            if (r < (multiway ? 0.60 : 0.76) * profileThinValueFreq) return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "thinValue") };
            return { type: "check" };
        }

        if (drawing) {
            const strongDraw = hero.hasComboDraw || (hero.hasFlushDraw && hero.hasOpenEndedStraightDraw);
            const drawSemiBluffFloor = multiway ? 0.34 : 0.28;
            const drawSemiBluffFreq = (multiway ? 0.42 : 0.62) * profileSemiBluffFreq;
            const v24PressureDraw = strongDraw && equity >= (multiway ? 0.38 : 0.31) && (exploitInfo.overfolder || isLagProfile);

            if (strongDraw && equity >= drawSemiBluffFloor && (r < drawSemiBluffFreq || v24PressureDraw)) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "semiBluff") };
            }

            if ((texture.wetness === "dry" || texture.aceHighDry || texture.paired) && equity >= 0.24 && r < (multiway ? 0.12 : 0.28) * profileBluffFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "bluff") };
            }

            return { type: "check" };
        }

        if (equity < 0.32) {
            if ((texture.aceHighDry || texture.paired || texture.wetness === "dry") && r < 0.24 * profileBluffFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "bluff") };
            }

            if (texture.monotone && blockerBluff && r < 0.28 * profileBluffFreq) {
                return { type: "bet", amount: chooseBetSize(index, equity, texture, hero, "blockerBluff") };
            }
        }

        return { type: "check" };
    }

    if (boardMadeOrFake || vulnerableOneCardMade || weakPairedTwoPair) {
        if (equity >= potOdds * 1.22 * profileCallDiscipline && !severeBetPressure) return { type: "call" };
        if (equity >= potOdds * 1.05 * profileCallDiscipline && toCall <= currentPot * 0.25) return { type: "call" };
        if (hero.hasNutLikeMade && equity >= potOdds * 1.10 * profileCallDiscipline && !bigBetPressure) return { type: "call" };
        return { type: "fold" };
    }

    if (nonRiverVeryStrong) {
        if (texture.wetness === "wet" || texture.wetness === "dangerous") {
            if (valuableTwoPairOrBetter && equity >= (multiway ? 0.66 : 0.58) && r < 0.42) {
                return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "protection", equity) };
            }
            return { type: "call" };
        }

        if (valuableTwoPairOrBetter && equity >= (multiway ? 0.64 : 0.56) && r < 0.34) {
            return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "value", equity) };
        }
        return { type: "call" };
    }

    if (nonRiverStrong) {
        if (equity >= potOdds * 1.25 * profileCallDiscipline) {
            if (hero.hasComboDraw && r < 0.30) return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "semiBluff", equity) };
            return { type: "call" };
        }

        if (equity >= potOdds * profileCallDiscipline && !(texture.wetness === "locked" && !blockerBluff && !hero.hasFlush)) return { type: "call" };

        return { type: "fold" };
    }

    if (drawing) {
        if (equity >= potOdds * profileCallDiscipline) {
            if (hero.hasComboDraw && r < 0.22 * profileSemiBluffFreq) return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "semiBluff", equity) };
            return { type: "call" };
        }

        if ((hero.hasFlushDraw || hero.hasOpenEndedStraightDraw) && toCall <= currentPot * 0.35 && r < 0.55 * profileCallDiscipline) {
            return { type: "call" };
        }

        if (blockerBluff && texture.monotone && r < 0.10 * profileBluffFreq) {
            return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "blockerBluff", equity) };
        }

        return { type: "fold" };
    }

    if (exploitInfo.aggressive && madeCategory >= 1 && equity >= potOdds * 0.96 && !severeBetPressure && toCall <= currentPot * 0.55) {
        return { type: "call" };
    }

    if (equity > potOdds * 1.15 * profileCallDiscipline && toCall <= currentPot * 0.30) {
        return { type: "call" };
    }

    if ((texture.aceHighDry || texture.paired) && blockerBluff && r < 0.08) {
        return { type: "raise", amount: chooseRaiseTo(index, toCall, texture, hero, "blockerBluff", equity) };
    }

    return { type: "fold" };
}


function getLastPreflopAggressorIndex() {
    let last = null;
    for (const a of handActionHistory) {
        if (a.street !== "preflop") continue;
        if (a.forcedBlind) continue;
        if (a.action === "raise" || a.action === "bet") last = a.playerIndex;
    }
    return last;
}

function didStreetCheckThrough(streetName) {
    const actions = handActionHistory.filter(a => a.street === streetName && !a.forcedBlind);
    if (actions.length === 0) return false;
    return !actions.some(a => a.action === "bet" || a.action === "raise" || a.action === "call");
}

function getStreetAggressorCount(streetName) {
    return handActionHistory.filter(a => a.street === streetName && (a.action === "bet" || a.action === "raise")).length;
}

function getReadableActionSummary(actionSummary) {
    if (actionSummary === "raised") return "翻前主動加注，range 較強且有主動權";
    if (actionSummary === "called") return "翻前跟注，range 多為中等牌、口袋對、同花連張或部分慢打強牌";
    if (actionSummary === "checkedBlind") return "大盲過牌入池，range 很寬且強牌比例較低";
    if (actionSummary === "onlyBlind") return "只投入盲注，range 未被主動收窄";
    if (actionSummary === "folded") return "已棄牌";
    return "目前資訊不足，range 仍偏寬";
}

function getCurrentStreetOpponentActionRead(playerIndex) {
    const actions = handActionHistory.filter(a => a.playerIndex === playerIndex && a.street === street && !a.forcedBlind);
    if (actions.length === 0) return "本街尚未明確行動";
    const last = actions[actions.length - 1];
    if (last.action === "bet") return "本街主動下注，可能是 value、保護或 bluff";
    if (last.action === "raise") return "本街加注，強牌與強 draw 比例上升";
    if (last.action === "call") return "本街跟注，常見為中等成牌、抽牌或 bluff-catcher";
    if (last.action === "check") return "本街過牌，通常削弱強牌比例，但可能有陷阱";
    if (last.action === "fold") return "本街棄牌";
    return "本街行動訊息有限";
}

function getCurrentStreetOpponentActionCode(playerIndex) {
    const actions = handActionHistory.filter(a => a.playerIndex === playerIndex && a.street === street && !a.forcedBlind);
    if (actions.length === 0) return "none";
    const last = actions[actions.length - 1];
    return last && last.action ? last.action : "unknown";
}

function getCurrentStreetOpponentActionLabel(actionCode) {
    if (actionCode === "bet") return "本街下注";
    if (actionCode === "raise") return "本街加注";
    if (actionCode === "call") return "本街跟注";
    if (actionCode === "check") return "本街過牌";
    if (actionCode === "fold") return "本街棄牌";
    if (actionCode === "none") return "本街未行動";
    return "本街行動未知";
}

function getPreflopRangeSourceLabel(source) {
    if (source === "raised") return "翻前主動加注";
    if (source === "called") return "翻前跟注";
    if (source === "checkedBlind") return "大盲過牌入池";
    if (source === "onlyBlind") return "只投入盲注";
    if (source === "folded") return "已棄牌";
    return "翻前來源不足";
}

function classifyPlayerStyleFromStats(playerIndex) {
    const p = players[playerIndex];
    if (!p) {
        return {
            label: "未知",
            vpip: 0,
            pfr: 0,
            postflopAggression: 0,
            foldRate: 0,
            allInRate: 0,
            confidence: 0
        };
    }

    const hands = Math.max(1, p.stats.handsPlayed || 0);
    const vpip = (p.stats.vpipHands || 0) / hands;
    const pfr = (p.stats.pfrHands || 0) / hands;
    const foldRate = (p.stats.foldCount || 0) / hands;
    const allInRate = (p.stats.allInCount || 0) / hands;
    const postTotal = (p.stats.postflopAggressiveActions || 0) + (p.stats.postflopPassiveActions || 0) + (p.stats.postflopChecks || 0);
    const postflopAggression = postTotal > 0 ? (p.stats.postflopAggressiveActions || 0) / postTotal : 0;
    const confidence = Math.min(1, hands / 80);

    let label = p.profile ? p.profile.name : "未知型";
    if (vpip >= 0.42 && postflopAggression < 0.24) label = "偏跟注站";
    else if (vpip >= 0.36 && pfr >= 0.22) label = "偏鬆凶";
    else if (vpip <= 0.18 && pfr <= 0.13) label = "偏極緊";
    else if (pfr >= 0.18 && postflopAggression >= 0.30) label = "偏緊凶";
    if (allInRate >= 0.07) label += "／高頻 All-in";

    return { label, vpip, pfr, postflopAggression, foldRate, allInRate, confidence };
}


function createOpponentModel() {
    return {
        version: "v37B",
        handsSeen: 0,
        preflop: {
            limp: 0,
            openRaise: 0,
            threeBet: 0,
            fourBet: 0,
            callRaise: 0,
            foldToSteal: 0,
            defendBlind: 0,
            allInPreflop: 0
        },
        flop: {
            cBetOpportunity: 0,
            cBet: 0,
            facedCBet: 0,
            facedCBetDirect: 0,
            foldToCBet: 0,
            callCBet: 0,
            raiseCBet: 0,
            cBetResponseBlockedByRaise: 0,
            donkBet: 0,
            checkFold: 0,
            checkCall: 0,
            checkRaise: 0
        },
        turn: {
            delayedCBet: 0,
            facedTurnBet: 0,
            foldToTurnBet: 0,
            callTurnBet: 0,
            raiseTurnBet: 0,
            secondBarrel: 0
        },
        river: {
            facedRiverBet: 0,
            foldToRiverBet: 0,
            callRiverBet: 0,
            riverAggression: 0,
            valueBetShown: 0,
            bluffShown: 0,
            showedThinValue: 0
        },
        showdown: {
            wentToShowdown: 0,
            wonAtShowdown: 0,
            showedBluff: 0,
            showedThinValue: 0,
            showedTrap: 0
        },
        tags: {},
        lastRead: null
    };
}

function ensureOpponentModel(index) {
    const p = players[index];
    if (!p) return createOpponentModel();
    if (!p.opponentModel || (p.opponentModel.version !== "v34" && p.opponentModel.version !== "v34B" && p.opponentModel.version !== "v34C" && p.opponentModel.version !== "v35" && p.opponentModel.version !== "v35B" && p.opponentModel.version !== "v36A" && p.opponentModel.version !== "v36D" && p.opponentModel.version !== "v36E" && p.opponentModel.version !== "v36F" && p.opponentModel.version !== "v36G" && p.opponentModel.version !== "v36H" && p.opponentModel.version !== "v36I" && p.opponentModel.version !== "v36J" && p.opponentModel.version !== "v37" && p.opponentModel.version !== "v37B")) {
        p.opponentModel = createOpponentModel();
    }
    if (p.opponentModel.version === "v34" || p.opponentModel.version === "v34B" || p.opponentModel.version === "v34C" || p.opponentModel.version === "v35" || p.opponentModel.version === "v35B" || p.opponentModel.version === "v36A" || p.opponentModel.version === "v36D" || p.opponentModel.version === "v36E" || p.opponentModel.version === "v36F" || p.opponentModel.version === "v36G" || p.opponentModel.version === "v36H" || p.opponentModel.version === "v36I" || p.opponentModel.version === "v36J" || p.opponentModel.version === "v37") p.opponentModel.version = "v37B";
    return p.opponentModel;
}

function getRate(numerator, denominator, prior = 0.5, targetSample = 30) {
    const sample = Math.max(0, denominator || 0);
    const observed = sample > 0 ? numerator / sample : prior;
    const confidence = Math.min(1, sample / targetSample);
    const effective = prior * (1 - confidence) + observed * confidence;
    return {
        observed: Number(observed.toFixed(3)),
        effective: Number(effective.toFixed(3)),
        sample,
        confidence: Number(confidence.toFixed(2))
    };
}

function getPreviousStreetActions(streetName) {
    return handActionHistory.filter(a => a.street === streetName && !a.forcedBlind);
}

function countPreviousAggressiveActions(streetName) {
    return getPreviousStreetActions(streetName).filter(a => a.action === "bet" || a.action === "raise").length;
}

function getLastPreviousAggressor(streetName) {
    const actions = getPreviousStreetActions(streetName).filter(a => a.action === "bet" || a.action === "raise");
    return actions.length ? actions[actions.length - 1] : null;
}

function hasRespondedAfterAction(playerIndex, actionEntry, streetName) {
    const actions = getPreviousStreetActions(streetName);
    const pos = actions.indexOf(actionEntry);
    if (pos < 0) return false;
    return actions.slice(pos + 1).some(a => a.playerIndex === playerIndex);
}

function isBlindPositionIndex(index) {
    return index === getSmallBlindIndex() || index === getBigBlindIndex();
}


function initializeV34CFlopCBetTracker() {
    const pfa = getLastPreflopAggressorIndex();
    v34CFlopCBetTracker = {
        version: "v34C",
        handNumber,
        street: "flop",
        pfa,
        cBetMade: false,
        cBetActionOrdinal: null,
        blockedByRaise: false,
        directResponders: {}
    };

    if (pfa !== null && pfa !== undefined) {
        const p = players[pfa];
        if (p && !p.folded && !p.allIn && p.chips > 0) {
            const model = ensureOpponentModel(pfa);
            if (model.flop.cBetOpportunity === undefined) model.flop.cBetOpportunity = 0;
            model.flop.cBetOpportunity++;
        }
    }
}

function getV34CFlopCBetTracker() {
    if (street !== "flop") return null;
    if (!v34CFlopCBetTracker || v34CFlopCBetTracker.handNumber !== handNumber) {
        initializeV34CFlopCBetTracker();
    }
    return v34CFlopCBetTracker;
}

function isV34CTrackableCBetResponse(actionType) {
    return actionType === "fold" || actionType === "call" || actionType === "raise";
}

function applyV34CFlopCBetTracking(index, actionType, entry, previousActions) {
    const tracker = getV34CFlopCBetTracker();
    if (!tracker || tracker.pfa === null || tracker.pfa === undefined) return false;

    const previousAggressive = previousActions.filter(a => a.action === "bet" || a.action === "raise");
    const currentIsAggressive = actionType === "bet" || actionType === "raise";
    const model = ensureOpponentModel(index);

    if (!tracker.cBetMade && currentIsAggressive && previousAggressive.length === 0) {
        if (index === tracker.pfa) {
            tracker.cBetMade = true;
            tracker.cBetActionOrdinal = handActionHistory.length;
            if (model.flop.cBet === undefined) model.flop.cBet = 0;
            model.flop.cBet++;
            if (entry) {
                entry.v34CFlopCBetTracker = {
                    event: "cBetMade",
                    pfa: tracker.pfa,
                    cBetActionOrdinal: tracker.cBetActionOrdinal
                };
            }
            return true;
        }

        // First flop aggression by a non-PFA is a donk bet; after this there
        // is no standard continuation bet opportunity for the preflop aggressor.
        if (model.flop.donkBet === undefined) model.flop.donkBet = 0;
        model.flop.donkBet++;
        tracker.blockedByRaise = true;
        if (entry) {
            entry.v34CFlopCBetTracker = {
                event: "donkBlocksCBet",
                pfa: tracker.pfa
            };
        }
        return true;
    }

    if (!tracker.cBetMade || index === tracker.pfa || !isV34CTrackableCBetResponse(actionType)) return false;
    if (tracker.directResponders[index]) return false;

    if (tracker.blockedByRaise) {
        if (model.flop.cBetResponseBlockedByRaise === undefined) model.flop.cBetResponseBlockedByRaise = 0;
        model.flop.cBetResponseBlockedByRaise++;
        tracker.directResponders[index] = "blocked";
        if (entry) {
            entry.v34CFlopCBetTracker = {
                event: "blockedByRaiseAfterCBet",
                pfa: tracker.pfa
            };
        }
        return true;
    }

    if (model.flop.facedCBet === undefined) model.flop.facedCBet = 0;
    if (model.flop.facedCBetDirect === undefined) model.flop.facedCBetDirect = 0;
    model.flop.facedCBet++;
    model.flop.facedCBetDirect++;

    if (actionType === "fold") model.flop.foldToCBet++;
    if (actionType === "call") model.flop.callCBet++;
    if (actionType === "raise") {
        model.flop.raiseCBet++;
        tracker.blockedByRaise = true;
    }

    tracker.directResponders[index] = actionType;
    if (entry) {
        entry.v34CFlopCBetTracker = {
            event: "directResponseToCBet",
            pfa: tracker.pfa,
            response: actionType
        };
    }
    return true;
}

function updateOpponentModelOnAction(index, actionType, amountPaid, extra = {}, entry = null) {
    const p = players[index];
    if (!p) return;
    const model = ensureOpponentModel(index);
    model.handsSeen = Math.max(model.handsSeen || 0, p.stats ? (p.stats.handsPlayed || 0) : 0);

    if (street === "preflop") {
        const previousAggressive = countPreviousAggressiveActions("preflop");
        const posCategory = getPositionCategory(index);
        const lastAgg = getLastPreviousAggressor("preflop");

        if ((extra && extra.becameAllIn) || p.chips === 0) model.preflop.allInPreflop++;

        if (actionType === "call" && amountPaid > 0) {
            if (previousAggressive === 0 && currentBet <= bigBlind) model.preflop.limp++;
            if (previousAggressive > 0 || currentBet > bigBlind) model.preflop.callRaise++;
            if (isBlindPositionIndex(index) && previousAggressive > 0) model.preflop.defendBlind++;
        }

        if (actionType === "bet" || actionType === "raise") {
            if (previousAggressive === 0) model.preflop.openRaise++;
            else if (previousAggressive === 1) model.preflop.threeBet++;
            else model.preflop.fourBet++;
            if (isBlindPositionIndex(index) && previousAggressive > 0) model.preflop.defendBlind++;
        }

        if (actionType === "fold" && isBlindPositionIndex(index) && lastAgg) {
            const raiserPos = getPositionCategory(lastAgg.playerIndex);
            if (raiserPos === "late" || getStrategicAliveCount() <= 4) {
                model.preflop.foldToSteal++;
            }
        }
    }

    if (street === "flop") {
        const previousActions = getPreviousStreetActions("flop");
        applyV34CFlopCBetTracking(index, actionType, entry, previousActions);

        const checkedBefore = previousActions.some(a => a.playerIndex === index && a.action === "check");
        if (checkedBefore) {
            if (actionType === "fold") model.flop.checkFold++;
            if (actionType === "call") model.flop.checkCall++;
            if (actionType === "raise") model.flop.checkRaise++;
        }
    }

    if (street === "turn") {
        const pfa = getLastPreflopAggressorIndex();
        const previousActions = getPreviousStreetActions("turn");
        const previousAggressive = previousActions.filter(a => a.action === "bet" || a.action === "raise");
        const wasFirstTurnBet = (actionType === "bet" || actionType === "raise") && previousAggressive.length === 0;

        if (wasFirstTurnBet && index === pfa && didStreetCheckThrough("flop")) model.turn.delayedCBet++;
        if (wasFirstTurnBet && index === pfa && getStreetAggressorCount("flop") > 0) model.turn.secondBarrel++;

        const lastAgg = previousAggressive.length ? previousAggressive[previousAggressive.length - 1] : null;
        if (lastAgg && lastAgg.playerIndex !== index && !hasRespondedAfterAction(index, lastAgg, "turn")) {
            if (actionType === "fold" || actionType === "call" || actionType === "raise") {
                model.turn.facedTurnBet++;
                if (actionType === "fold") model.turn.foldToTurnBet++;
                if (actionType === "call") model.turn.callTurnBet++;
                if (actionType === "raise") model.turn.raiseTurnBet++;
            }
        }
    }

    if (street === "river") {
        const previousActions = getPreviousStreetActions("river");
        const previousAggressive = previousActions.filter(a => a.action === "bet" || a.action === "raise");
        const lastAgg = previousAggressive.length ? previousAggressive[previousAggressive.length - 1] : null;

        if (actionType === "bet" || actionType === "raise") model.river.riverAggression++;

        if (lastAgg && lastAgg.playerIndex !== index && !hasRespondedAfterAction(index, lastAgg, "river")) {
            if (actionType === "fold" || actionType === "call" || actionType === "raise") {
                model.river.facedRiverBet++;
                if (actionType === "fold") model.river.foldToRiverBet++;
                if (actionType === "call") model.river.callRiverBet++;
            }
        }
    }

    model.tags = buildOpponentModelTags(index);
    model.lastRead = buildOpponentModelRead(index);
}

function updateOpponentModelOnShowdown(winnings, showdownParticipants = null) {
    const participantSet = showdownParticipants instanceof Set ? showdownParticipants : null;

    for (let i = 0; i < players.length; i++) {
        const p = players[i];
        if (!p || p.folded || !p.hole || p.hole.length !== 2) continue;
        if (participantSet && !participantSet.has(i)) continue;

        const model = ensureOpponentModel(i);
        const result = p.showdownResult || bestOfSeven(p.hole.concat(board));
        model.showdown.wentToShowdown++;

        // v34B: only a real payout from a contested showdown counts as
        // wonAtShowdown. Returned uncalled chips and fold-wins do not count.
        if ((winnings.get(i) || 0) > 0) model.showdown.wonAtShowdown++;

        const riverAgg = handActionHistory.some(a => a.playerIndex === i && a.street === "river" && (a.action === "bet" || a.action === "raise"));
        const checkedThenRaised = handActionHistory.some(a => a.playerIndex === i && (a.street === "flop" || a.street === "turn" || a.street === "river") && a.action === "check") &&
            handActionHistory.some(a => a.playerIndex === i && (a.street === "flop" || a.street === "turn" || a.street === "river") && a.action === "raise");

        if (riverAgg && result.category <= 0) {
            model.river.bluffShown++;
            model.showdown.showedBluff++;
        }
        if (riverAgg && result.category >= 1 && result.category <= 2) {
            model.river.showedThinValue++;
            model.showdown.showedThinValue++;
        }
        if (checkedThenRaised && result.category >= 3) {
            model.showdown.showedTrap++;
        }

        model.tags = buildOpponentModelTags(i);
        model.lastRead = buildOpponentModelRead(i);
    }
}

function getOpponentStreetConfidence(index) {
    const model = ensureOpponentModel(index);
    const p = players[index];
    const hands = Math.max(0, p && p.stats ? (p.stats.handsPlayed || 0) : (model.handsSeen || 0));
    const preflop = Math.min(1, hands / 60);
    const flop = Math.min(1, Math.max(model.flop.facedCBet, model.flop.cBet, model.flop.donkBet, model.flop.checkCall + model.flop.checkFold + model.flop.checkRaise) / 20);
    const turn = Math.min(1, Math.max(model.turn.facedTurnBet, model.turn.delayedCBet + model.turn.secondBarrel) / 18);
    const river = Math.min(1, Math.max(model.river.facedRiverBet, model.river.riverAggression) / 18);
    const showdown = Math.min(1, (model.showdown.wentToShowdown || 0) / 20);
    return {
        preflop: Number(preflop.toFixed(2)),
        flop: Number(flop.toFixed(2)),
        turn: Number(turn.toFixed(2)),
        river: Number(river.toFixed(2)),
        showdown: Number(showdown.toFixed(2))
    };
}

function buildOpponentModelTags(index) {
    const p = players[index];
    const m = ensureOpponentModel(index);
    const hands = Math.max(1, p && p.stats ? (p.stats.handsPlayed || 0) : (m.handsSeen || 0));
    const vpip = p && p.stats ? (p.stats.vpipHands || 0) / hands : 0;
    const pfr = p && p.stats ? (p.stats.pfrHands || 0) / hands : 0;
    const postTotal = p && p.stats ? (p.stats.postflopAggressiveActions || 0) + (p.stats.postflopPassiveActions || 0) + (p.stats.postflopChecks || 0) : 0;
    const postAgg = postTotal > 0 ? (p.stats.postflopAggressiveActions || 0) / postTotal : 0;
    const foldToCBet = getRate(m.flop.foldToCBet, m.flop.facedCBet, 0.45, 20);
    const callCBet = getRate(m.flop.callCBet, m.flop.facedCBet, 0.35, 20);
    const foldTurn = getRate(m.turn.foldToTurnBet, m.turn.facedTurnBet, 0.42, 18);
    const callRiver = getRate(m.river.callRiverBet, m.river.facedRiverBet, 0.42, 18);
    const showdownWinRate = getRate(m.showdown.wonAtShowdown, m.showdown.wentToShowdown, 0.5, 20);
    const allInRate = p && p.stats ? (p.stats.allInCount || 0) / hands : 0;
    const profileName = p && p.profile ? p.profile.name : "";
    const profileStation = profileName === "跟注站";
    const softCallingStation = !!(
        (profileStation && (
            callCBet.effective >= 0.45 ||
            (foldTurn.sample >= 2 && foldTurn.effective <= 0.38) ||
            (postTotal >= 8 && postAgg <= 0.26)
        )) ||
        (callCBet.sample >= 3 && callCBet.effective >= 0.47) ||
        (hands >= 35 && vpip >= 0.24 && postAgg <= 0.24 && callCBet.effective >= 0.42)
    );
    const stickyStrongStation = !!(
        softCallingStation &&
        showdownWinRate.confidence >= 0.55 &&
        showdownWinRate.effective >= 0.62
    );
    const strongShowdownRegular = !!(
        !softCallingStation && (
            (showdownWinRate.confidence >= 0.60 && showdownWinRate.effective >= 0.62) ||
            (showdownWinRate.sample >= 10 && showdownWinRate.observed >= 0.68)
        )
    );

    return {
        loosePreflop: hands >= 25 && vpip >= 0.30,
        tightPreflop: hands >= 25 && vpip <= 0.17,
        passivePostflop: postTotal >= 12 && postAgg <= 0.22,
        aggressivePostflop: postTotal >= 12 && postAgg >= 0.34,
        overfoldsFlop: foldToCBet.confidence >= 0.35 && foldToCBet.effective >= 0.62,
        callsTooMuch: callCBet.confidence >= 0.35 && callCBet.effective >= 0.52,
        softCallingStation,
        stickyStrongStation,
        strongShowdownRegular,
        foldsTurnTooMuch: foldTurn.confidence >= 0.35 && foldTurn.effective >= 0.60,
        riverStation: callRiver.confidence >= 0.35 && callRiver.effective >= 0.55,
        riverHonest: m.river.riverAggression >= 4 && m.showdown.wentToShowdown >= 6 && m.showdown.showedBluff <= 1,
        shortStackManiac: hands >= 25 && allInRate >= 0.075,
        trapper: m.showdown.wentToShowdown >= 6 && m.showdown.showedTrap >= 2,
        bluffHeavy: m.showdown.wentToShowdown >= 6 && (m.showdown.showedBluff >= 2 || (m.river.bluffShown >= 2))
    };
}

function getOpponentModelExport(index) {
    const model = ensureOpponentModel(index);
    return {
        version: model.version,
        handsSeen: model.handsSeen,
        preflop: model.preflop,
        flop: model.flop,
        turn: model.turn,
        river: model.river,
        showdown: model.showdown,
        tags: buildOpponentModelTags(index),
        rates: getOpponentModelRates(index),
        streetConfidence: getOpponentStreetConfidence(index),
        lastRead: model.lastRead || buildOpponentModelRead(index)
    };
}

function getOpponentModelRates(index) {
    const p = players[index];
    const model = ensureOpponentModel(index);
    const hands = Math.max(1, p && p.stats ? (p.stats.handsPlayed || 0) : model.handsSeen || 1);
    return {
        vpip: getRate(p && p.stats ? p.stats.vpipHands || 0 : 0, hands, 0.25, 60),
        pfr: getRate(p && p.stats ? p.stats.pfrHands || 0 : 0, hands, 0.16, 60),
        foldToCBet: getRate(model.flop.foldToCBet, model.flop.facedCBet, 0.45, 20),
        callCBet: getRate(model.flop.callCBet, model.flop.facedCBet, 0.35, 20),
        raiseCBet: getRate(model.flop.raiseCBet, model.flop.facedCBet, 0.10, 20),
        foldToTurnBet: getRate(model.turn.foldToTurnBet, model.turn.facedTurnBet, 0.42, 18),
        callRiverBet: getRate(model.river.callRiverBet, model.river.facedRiverBet, 0.42, 18),
        showdownWinRate: getRate(model.showdown.wonAtShowdown, model.showdown.wentToShowdown, 0.50, 20)
    };
}

function buildOpponentModelRead(index) {
    const p = players[index];
    if (!p) return null;
    const model = ensureOpponentModel(index);
    const rates = getOpponentModelRates(index);
    const tags = buildOpponentModelTags(index);
    const activeTags = Object.entries(tags).filter(([k, v]) => !!v).map(([k]) => k);
    const streetConfidence = getOpponentStreetConfidence(index);

    let label = p.profile ? p.profile.name : "未知型";
    if (tags.stickyStrongStation) label = "動態強攤牌跟注站";
    else if (tags.strongShowdownRegular) label = "動態強攤牌常規型";
    else if (tags.callsTooMuch || tags.softCallingStation || (tags.loosePreflop && tags.passivePostflop)) label = "動態跟注站";
    else if (tags.overfoldsFlop || tags.foldsTurnTooMuch) label = "動態過度棄牌";
    else if (tags.aggressivePostflop || tags.shortStackManiac) label = "動態高壓進攻";
    else if (tags.tightPreflop) label = "動態偏緊";
    else if (tags.loosePreflop) label = "動態偏鬆";

    let exploitPlan = "樣本不足，維持標準策略";
    let exploitConfidence = Math.max(0.15, streetConfidence.preflop * 0.35);

    if (tags.stickyStrongStation) {
        exploitPlan = "少 bluff，但不要過度 thin value；river 尤其尊重其攤牌強度";
        exploitConfidence = Math.max(rates.showdownWinRate.confidence, rates.callCBet.confidence, streetConfidence.showdown);
    } else if (tags.strongShowdownRegular) {
        exploitPlan = "攤牌勝率偏高；river bluff-catcher 與薄價值都收緊";
        exploitConfidence = Math.max(rates.showdownWinRate.confidence, streetConfidence.showdown);
    } else if (tags.callsTooMuch || tags.softCallingStation || tags.riverStation) {
        exploitPlan = "少 bluff，多做 value / thin value；可略放大 value sizing";
        exploitConfidence = Math.max(rates.callCBet.confidence, rates.callRiverBet.confidence, streetConfidence.flop * 0.5);
    } else if (tags.overfoldsFlop || tags.foldsTurnTooMuch) {
        exploitPlan = "提高 c-bet / delayed c-bet；小尺度 bluff 即可";
        exploitConfidence = Math.max(rates.foldToCBet.confidence, rates.foldToTurnBet.confidence);
    } else if (tags.aggressivePostflop || tags.bluffHeavy) {
        exploitPlan = "少純 bluff，增加 bluff-catcher 與誘導下注";
        exploitConfidence = Math.max(streetConfidence.flop, streetConfidence.river, streetConfidence.showdown);
    } else if (tags.riverHonest) {
        exploitPlan = "尊重 river 大注；對 check 可增加偷取";
        exploitConfidence = Math.max(streetConfidence.river, streetConfidence.showdown);
    } else if (tags.shortStackManiac) {
        exploitPlan = "放寬 call shove，但多人 overcall 仍收緊";
        exploitConfidence = streetConfidence.preflop;
    }

    return {
        playerName: p.name,
        dynamicLabel: label,
        profilePrior: p.profile ? p.profile.name : "human/unknown",
        activeTags,
        rates,
        streetConfidence,
        modelSamples: {
            facedCBet: model.flop.facedCBet,
            facedTurnBet: model.turn.facedTurnBet,
            facedRiverBet: model.river.facedRiverBet,
            showdown: model.showdown.wentToShowdown
        },
        exploitPlan,
        confidence: Number(Math.min(1, exploitConfidence).toFixed(2)),
        confidenceNote: "v37B keeps postflop unchanged; adds early-sample big human-all-in guard; logs all players hole cards in debug export; keeps v37 delayed-c-bet / strongShowdownRegular / fake semi-bluff safeguards; debug separates actualNuts / nearNutsMade from legacy nutLikeMade"
    };
}

function buildV34OpponentModelReads(index, opponentRanges) {
    const activeOpponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt);

    const order = Array.isArray(opponentRanges) && opponentRanges.length > 0
        ? opponentRanges.map(r => players.findIndex(p => p && p.name === r.name)).filter(i => i >= 0)
        : activeOpponents.map(x => x.i);

    return order.slice(0, 4).map(i => buildOpponentModelRead(i)).filter(Boolean);
}


function parseWeightedNotationEntry(entry) {
    const raw = String(entry || "");
    const parts = raw.split(":");
    return {
        notation: parts[0],
        weight: parts.length > 1 ? Number(parts[1]) || 0 : 0
    };
}

function getRankHighLowFromNotation(notation) {
    if (!notation) return { high: 0, low: 0, pair: false, suited: false, gap: 0 };
    const pair = notation.length === 2;
    const suited = notation.endsWith("s");
    const high = rangeRankValue(notation[0]);
    const low = rangeRankValue(notation[1]);
    return { high, low, pair, suited, gap: Math.abs(high - low) };
}

function getNotationGroupLabel(notation) {
    const f = getRankHighLowFromNotation(notation);
    if (!notation) return "未知牌型";
    if (f.pair) {
        if (f.high >= 11) return "高口袋對";
        if (f.high >= 7) return "中口袋對";
        return "小口袋對";
    }
    if (f.high === 14 && f.low >= 10) return "強 Ax / Broadway";
    if (f.high === 14) return "弱 Ax";
    if (f.high >= 13 && f.low >= 10) return "Broadway";
    if (f.suited && f.gap <= 2 && f.low >= 5) return "同花連張 / 近連張";
    if (f.suited) return "同花邊緣牌";
    if (f.gap <= 2 && f.high <= 11) return "非同花連張";
    return "邊緣高張 / 空氣";
}

function getRangeWeightEntries(rangeWeights) {
    if (!rangeWeights) return [];
    return Object.entries(rangeWeights)
        .filter(([, weight]) => Number(weight) > 0)
        .map(([notation, weight]) => ({ notation, weight: Number(weight) || 0 }));
}

function summarizePreflopRangeShape(rangeWeights) {
    const entries = getRangeWeightEntries(rangeWeights);
    let total = 0;
    const out = {
        premium: 0,
        pair: 0,
        broadway: 0,
        aceX: 0,
        speculative: 0,
        suited: 0,
        trash: 0
    };

    for (const { notation, weight } of entries) {
        if (weight <= 0) continue;
        total += weight;
        const f = getRankHighLowFromNotation(notation);
        const rankPct = getStartingHandRankPercent(notation);
        if (rankPct <= 0.08 || isPremiumNotation(notation)) out.premium += weight;
        if (f.pair) out.pair += weight;
        if (!f.pair && f.high >= 13 && f.low >= 10) out.broadway += weight;
        if (!f.pair && f.high === 14) out.aceX += weight;
        if (isSpeculativeNotation(notation) || (f.suited && f.gap <= 3)) out.speculative += weight;
        if (f.suited) out.suited += weight;
        if (rankPct >= 0.72 && !isSpeculativeNotation(notation)) out.trash += weight;
    }

    if (total <= 0) return Object.fromEntries(Object.keys(out).map(k => [k, 0]));
    for (const key of Object.keys(out)) out[key] = Number((out[key] / total).toFixed(3));
    return out;
}

function summarizePostflopRangeDistribution(rangeWeights, boardCards) {
    const entries = getRangeWeightEntries(rangeWeights);
    let total = 0;
    const out = {
        strongMade: 0,
        mediumMade: 0,
        draw: 0,
        air: 0
    };

    for (const { notation, weight } of entries) {
        if (weight <= 0) continue;
        const cls = classifyNotationOnBoard(notation, boardCards);
        const clsTotal = cls.strong + cls.medium + cls.draw + cls.air;
        if (clsTotal <= 0) continue;
        total += weight;
        out.strongMade += weight * cls.strong;
        out.mediumMade += weight * cls.medium;
        out.draw += weight * cls.draw;
        out.air += weight * cls.air;
    }

    if (total <= 0) return { strongMade: 0, mediumMade: 0, draw: 0, air: 0 };
    for (const key of Object.keys(out)) out[key] = Number((out[key] / total).toFixed(3));
    return out;
}

function getRangeBucketFromDistribution(dist, stage) {
    if (!dist) return "未知 range";
    if (stage === "postflop") {
        if ((dist.strongMade || 0) >= 0.30) return "強成牌密度高";
        if ((dist.strongMade || 0) + (dist.draw || 0) >= 0.45) return "強牌 / 強抽牌混合";
        if ((dist.mediumMade || 0) >= 0.42) return "中等成牌偏多";
        if ((dist.draw || 0) >= 0.30) return "抽牌偏多";
        if ((dist.air || 0) >= 0.45) return "空氣與弱牌偏多";
        return "range 分布平均";
    }

    if ((dist.premium || 0) >= 0.28) return "翻前強 range";
    if ((dist.pair || 0) + (dist.broadway || 0) >= 0.48) return "口袋對 / Broadway 偏多";
    if ((dist.speculative || 0) >= 0.36) return "投機牌偏多";
    if ((dist.trash || 0) >= 0.38) return "弱牌仍很多";
    return "翻前中寬 range";
}

function getLikelyHoldingGroupsFromRange(rangeWeights, boardCards, limit = 8) {
    const top = getTopRangeNotations(rangeWeights, Math.max(12, limit * 2));
    const seen = new Set();
    const groups = [];

    for (const entry of top) {
        const notation = parseWeightedNotationEntry(entry).notation;
        const group = boardCards && boardCards.length >= 3
            ? getNotationGroupLabel(notation) + "（" + notation + "）"
            : getNotationGroupLabel(notation) + "（" + notation + "）";
        if (!seen.has(group)) {
            seen.add(group);
            groups.push(group);
        }
        if (groups.length >= limit) break;
    }

    return groups.length ? groups : ["未知 range"];
}

function getV35StreetConfidenceForRange(playerIndex) {
    const read = buildOpponentModelRead(playerIndex);
    const conf = read && read.streetConfidence ? read.streetConfidence : getOpponentStreetConfidence(playerIndex);
    const current = street === "flop" ? conf.flop : street === "turn" ? conf.turn : street === "river" ? conf.river : conf.preflop;
    const preflop = conf.preflop ?? 0.3;
    const showdown = conf.showdown ?? 0;
    const blended = board.length >= 3
        ? Math.max(0.12, Math.min(1, preflop * 0.35 + current * 0.45 + showdown * 0.20))
        : Math.max(0.12, Math.min(1, preflop));
    return Number(blended.toFixed(2));
}

function buildV35ActionRead(playerIndex, actionSummary, currentStreetRead, bucket, distribution, rangeStage) {
    const p = players[playerIndex];
    const modelRead = buildOpponentModelRead(playerIndex);
    const name = p ? p.name : "對手";
    const preflopText = getReadableActionSummary(actionSummary);

    if (rangeStage === "postflop") {
        const strong = Math.round((distribution.strongMade || 0) * 100);
        const medium = Math.round((distribution.mediumMade || 0) * 100);
        const draw = Math.round((distribution.draw || 0) * 100);
        const air = Math.round((distribution.air || 0) * 100);
        let response = name + "：" + currentStreetRead + "；" + bucket + "。估計強成牌 " + strong + "%、中等成牌 " + medium + "%、抽牌 " + draw + "%、空氣 " + air + "%。";
        if (modelRead && modelRead.activeTags && modelRead.activeTags.length) response += " 動態標籤：" + modelRead.activeTags.slice(0, 3).join("、") + "。";
        return response;
    }

    const premium = Math.round((distribution.premium || 0) * 100);
    const spec = Math.round((distribution.speculative || 0) * 100);
    return name + "：" + preflopText + "；" + bucket + "。估計 premium 約 " + premium + "%、投機牌約 " + spec + "% 。";
}

function buildV35BRangeModelSummary(rangeReads) {
    const reads = Array.isArray(rangeReads) ? rangeReads : [];
    const buckets = {};
    const stageCounts = {};
    let totalConfidence = 0;

    for (const read of reads) {
        const bucket = read.rangeBucket || "unknown";
        const stage = read.rangeStage || "unknown";
        buckets[bucket] = (buckets[bucket] || 0) + 1;
        stageCounts[stage] = (stageCounts[stage] || 0) + 1;
        totalConfidence += Number(read.rangeConfidence || 0);
    }

    const averageRangeConfidence = reads.length ? Number((totalConfidence / reads.length).toFixed(2)) : 0;

    return {
        version: "v35B-range-summary",
        mode: "compact-summary",
        totalReads: reads.length,
        averageRangeConfidence,
        buckets,
        stageCounts,
        topTargets: reads.slice(0, 3).map(r => ({
            playerName: r.playerName,
            playerIndex: r.playerIndex,
            rangeBucket: r.rangeBucket,
            rangeConfidence: r.rangeConfidence,
            preflopRangeSource: r.preflopRangeSource,
            currentStreetAction: r.currentStreetAction,
            likelyHoldings: (r.likelyHoldings || []).slice(0, 4)
        })),
        note: "Full per-opponent reads are stored in opponentRangeReads; this summary avoids duplicating the full array."
    };
}

function buildV35RangeReads(index, opponentRanges, texture, hero, plan, equity, toCall) {
    const activeOpponents = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p && x.i !== index && !x.p.folded && !x.p.bankrupt && x.p.hole && x.p.hole.length === 2);

    const ordered = Array.isArray(opponentRanges) && opponentRanges.length > 0
        ? opponentRanges.map(r => {
            const i = players.findIndex(p => p && p.name === r.name);
            return { rangeDebug: r, index: i };
