function getShortStackCallShoveGrade(ctx, strength) {
    const f = ctx.features;
    const band = getShortStackBand(ctx.stackBB);
    const cost = ctx.costRatio;

    if (band === "15-20BB") {
        if (strength >= 3 || (f.pocketPair && f.high >= 9) || (f.ace && f.low >= 12) || f.suitedBroadway) return 3;
        if (cost <= 0.45 && ((f.pocketPair && f.high >= 7) || (f.ace && f.low >= 10) || (f.broadway && f.high >= 13))) return 2;
        if (ctx.headsUp && cost <= 0.38 && ((f.pocketPair && f.high >= 5) || (f.ace && f.low >= 8) || isDecentShortStackKing(f, 9))) return 1;
        return 0;
    }

    if (band === "10-15BB") {
        if (strength >= 2 || (f.pocketPair && f.high >= 6) || (f.ace && f.low >= 9) || f.suitedBroadway || (f.broadway && f.high >= 13)) return 3;
        if (cost <= 0.50 && (f.pocketPair || (f.ace && f.low >= 5) || f.broadway || isDecentShortStackSuitedConnector(f, 7))) return 2;
        if (ctx.headsUp && cost <= 0.45 && (isDecentShortStackKing(f, 7) || isDecentShortStackQueen(f, 9) || (f.suited && f.high >= 10 && f.low >= 5))) return 1;
        return 0;
    }

    if (band === "6-10BB") {
        if (strength >= 1 || f.pocketPair || f.ace || f.broadway || isDecentShortStackSuitedConnector(f, 6) || (f.suited && f.high >= 12 && f.low >= 5)) return 3;
        if (cost <= 0.55 && (isDecentShortStackKing(f, 6) || isDecentShortStackQueen(f, 8) || (f.suited && f.high >= 10 && f.low >= 5) || isDecentShortStackSuitedConnector(f, 7))) return 2;
        if (ctx.headsUp && cost <= 0.50 && (f.high >= 12 && f.low >= 5 || f.suited && f.high >= 9 && f.low >= 5)) return 1;
        return 0;
    }

    if (band === "3-6BB") {
        if (strength >= 1 || f.pocketPair || f.ace || f.high >= 11 || isDecentShortStackSuitedConnector(f, 5) || (f.suited && f.high >= 8) || f.gap <= 1) return 3;
        if (cost <= 0.62 && (f.high >= 9 || f.suited || f.gap <= 2 || ctx.headsUp)) return 2;
        if (ctx.headsUp || ctx.shortHanded) return 1;
        return 0;
    }

    if (band === "0-3BB") return 3;

    return 0;
}

function getShortStackChartDecision(index, notation, strength, posCategory, toCall) {
    const ctx = getShortStackTableContext(index, notation, strength, posCategory, toCall);
    const p = ctx.p;
    const stackBB = ctx.stackBB;
    const band = getShortStackBand(stackBB);

    if (stackBB >= 20) {
        return {
            handled: false,
            band,
            action: null,
            reason: "not-under-20bb"
        };
    }

    const r = Math.random();
    const facingRaise = ctx.facingRaise;
    const firstIn = !facingRaise && ctx.unopened && toCall > 0;
    const freeOption = toCall === 0;
    const limpedPot = !facingRaise && !ctx.unopened;
    const canRaise = playerCanRaise(index);
    const openGrade = getShortStackOpenJamGrade(ctx, strength);
    const reshoveGrade = getShortStackReshoveGrade(ctx, strength);
    const callShoveGrade = getShortStackCallShoveGrade(ctx, strength);
    const openJamThreshold = band === "15-20BB" ? 0.42 : band === "10-15BB" ? 0.68 : band === "6-10BB" ? 0.86 : 0.98;
    const shortHandBoost = ctx.veryShortHanded ? 0.16 : ctx.shortHanded ? 0.08 : 0;
    const lateBoost = ctx.lateOrBlind ? 0.10 : 0;

    if (ctx.facingAllIn) {
        if (callShoveGrade >= 3) return { handled: true, action: "call", band, mode: "call-shove", reason: "v30-call-shove-grade3", openGrade, reshoveGrade, callShoveGrade };
        if (callShoveGrade === 2 && r < 0.62 + shortHandBoost) return { handled: true, action: "call", band, mode: "call-shove", reason: "v30-call-shove-grade2-mixed", openGrade, reshoveGrade, callShoveGrade };
        if (callShoveGrade === 1 && r < 0.24 + shortHandBoost && ctx.costRatio <= 0.50) return { handled: true, action: "call", band, mode: "call-shove", reason: "v30-call-shove-grade1-cheap", openGrade, reshoveGrade, callShoveGrade };
        return { handled: true, action: "fold", band, mode: "call-shove", reason: "v30-call-shove-fold", openGrade, reshoveGrade, callShoveGrade };
    }

    if (facingRaise) {
        if (canRaise && reshoveGrade >= 3) return { handled: true, action: "jam", band, mode: "reshove", reason: "v30-reshove-grade3", openGrade, reshoveGrade, callShoveGrade };
        if (canRaise && reshoveGrade === 2 && r < 0.64 + shortHandBoost + lateBoost) return { handled: true, action: "jam", band, mode: "reshove", reason: "v30-reshove-grade2-mixed", openGrade, reshoveGrade, callShoveGrade };
        if (canRaise && reshoveGrade === 1 && ctx.costRatio <= 0.28 && r < 0.26 + shortHandBoost) return { handled: true, action: "jam", band, mode: "reshove", reason: "v30-reshove-grade1-cheap", openGrade, reshoveGrade, callShoveGrade };

        if (callShoveGrade >= 2 && ctx.costRatio <= 0.22) return { handled: true, action: "call", band, mode: "vs-raise-call", reason: "v30-call-small-raise", openGrade, reshoveGrade, callShoveGrade };
        return { handled: true, action: "fold", band, mode: "vs-raise", reason: "v30-reshove-fold", openGrade, reshoveGrade, callShoveGrade };
    }

    if (firstIn || limpedPot) {
        if (canRaise && openGrade >= 3 && r < openJamThreshold + shortHandBoost + lateBoost) return { handled: true, action: "jam", band, mode: "open-jam", reason: "v30-open-jam-grade3", openGrade, reshoveGrade, callShoveGrade };
        if (canRaise && openGrade === 2 && r < openJamThreshold * 0.72 + shortHandBoost + lateBoost) return { handled: true, action: "jam", band, mode: "open-jam", reason: "v30-open-jam-grade2-mixed", openGrade, reshoveGrade, callShoveGrade };
        if (canRaise && openGrade === 1 && ctx.lateOrBlind && r < openJamThreshold * 0.36 + shortHandBoost) return { handled: true, action: "jam", band, mode: "open-jam", reason: "v30-open-jam-grade1-late", openGrade, reshoveGrade, callShoveGrade };

        if (band === "15-20BB" && strength >= 2 && !limpedPot) return { handled: true, action: "raise", band, mode: "open-raise", reason: "v30-18bb-raise-not-jam", openGrade, reshoveGrade, callShoveGrade };
        if (toCall <= ctx.bb && openGrade >= 1 && r < 0.18) return { handled: true, action: "call", band, mode: "complete", reason: "v30-short-complete-mixed", openGrade, reshoveGrade, callShoveGrade };
        return { handled: true, action: "fold", band, mode: firstIn ? "first-in" : "limped-pot", reason: "v30-open-fold", openGrade, reshoveGrade, callShoveGrade };
    }

    if (freeOption) {
        if (canRaise && openGrade >= 3 && band !== "15-20BB" && r < 0.34 + shortHandBoost) return { handled: true, action: "jam", band, mode: "bb-punish-limp", reason: "v30-bb-free-option-jam", openGrade, reshoveGrade, callShoveGrade };
        return { handled: true, action: "call", band, mode: "free-option", reason: "v30-free-option-check", openGrade, reshoveGrade, callShoveGrade };
    }

    return { handled: false, action: null, band, mode: "none", reason: "v30-no-chart-match", openGrade, reshoveGrade, callShoveGrade };
}

function executeShortStackChartAction(index, decision, stack, aggression) {
    annotatePreflopDecisionDebug(index, {
        shortStackDecision: decision.handled ? "handled" : "not-handled",
        shortStackBand: decision.band || "-",
        shortStackChartAction: decision.action || "none",
        shortStackMode: decision.mode || "none",
        shortStackReason: decision.reason || "none",
        shortStackOpenGrade: decision.openGrade ?? null,
        shortStackReshoveGrade: decision.reshoveGrade ?? null,
        shortStackCallShoveGrade: decision.callShoveGrade ?? null
    });

    if (!decision.handled) return false;

    if (decision.action === "jam") {
        shovePlayer(index);
        return true;
    }

    if (decision.action === "raise") {
        raisePlayer(index, openRaiseTo(getPositionCategory(index), stack, aggression));
        return true;
    }

    if (decision.action === "call") {
        callPlayer(index);
        return true;
    }

    if (decision.action === "fold") {
        foldPlayer(index);
        return true;
    }

    return false;
}

function classifyHumanAllInAdaptationLevel(lifetimeRate, recentAggressiveAllIns, lifetimeSampleReady) {
    // 只用「已完成的歷史手牌」來判斷，不把當前這一手剛剛 All-in 的動作算進適應層級。
    // lifetime 條件要有足夠樣本才啟用；recent 條件則看過去 8 手，不含當前手。
    const lifetimeLevel3 = lifetimeSampleReady && lifetimeRate >= 0.65;
    const lifetimeLevel2 = lifetimeSampleReady && lifetimeRate >= 0.45;
    const lifetimeLevel1 = lifetimeSampleReady && lifetimeRate >= 0.25;

    if (lifetimeLevel3 || recentAggressiveAllIns >= 4) {
        return {
            level: 3,
            trigger: lifetimeLevel3 ? "history-lifetime>=65%" : "history-recent>=4/8",
            band: "level3: previous lifetime >= 65% with enough sample OR previous 8 hands all-in >= 4"
        };
    }

    if (lifetimeLevel2 || recentAggressiveAllIns >= 3) {
        return {
            level: 2,
            trigger: lifetimeLevel2 ? "history-lifetime>=45%" : "history-recent>=3/8",
            band: "level2: previous lifetime >= 45% with enough sample OR previous 8 hands all-in = 3"
        };
    }

    if (lifetimeLevel1 || recentAggressiveAllIns >= 2) {
        return {
            level: 1,
            trigger: lifetimeLevel1 ? "history-lifetime>=25%" : "history-recent>=2/8",
            band: "level1: previous lifetime >= 25% with enough sample OR previous 8 hands all-in = 2"
        };
    }

    return {
        level: 0,
        trigger: lifetimeSampleReady ? "normal-history" : "sample-too-small",
        band: "level0: not enough historical all-in evidence yet"
    };
}

function getHumanAllInAdaptation() {
    const humanIndex = players.findIndex(p => p.isHuman);

    if (humanIndex < 0) {
        return {
            humanIndex: -1,
            level: 0,
            lifetimeRate: 0,
            priorHands: 0,
            priorLifetimeAllIns: 0,
            lifetimeSampleReady: false,
            recentAggressiveAllIns: 0,
            trigger: "no-human",
            band: "no human player"
        };
    }

    const human = players[humanIndex];

    const currentHandAggressiveAllIns = globalActionHistory.filter(a => {
        return a.playerIndex === humanIndex &&
            a.handNumber === handNumber &&
            a.isAllIn &&
            (a.action === "bet" || a.action === "raise");
    }).length;

    // handsPlayed 在新一手開始時已經 +1，所以評估對手傾向時要扣掉當前手。
    const priorHands = Math.max(0, (human.stats.handsPlayed || 0) - 1);
    const priorLifetimeAllIns = Math.max(0, (human.stats.allInCount || 0) - currentHandAggressiveAllIns);
    const lifetimeRate = priorHands > 0 ? priorLifetimeAllIns / priorHands : 0;
    const lifetimeSampleReady = priorHands >= 8;

    const recentAggressiveAllIns = globalActionHistory.filter(a => {
        return a.playerIndex === humanIndex &&
            a.handNumber < handNumber &&
            a.isAllIn &&
            (a.action === "bet" || a.action === "raise") &&
            handNumber - a.handNumber <= 8;
    }).length;

    const classified = classifyHumanAllInAdaptationLevel(lifetimeRate, recentAggressiveAllIns, lifetimeSampleReady);

    return {
        humanIndex,
        level: classified.level,
        lifetimeRate,
        priorHands,
        priorLifetimeAllIns,
        lifetimeSampleReady,
        recentAggressiveAllIns,
        trigger: classified.trigger,
        band: classified.band
    };
}

function isFacingHumanAllIn(index) {
    const info = getHumanAllInAdaptation();

    if (info.humanIndex < 0 || info.humanIndex === index) return false;

    const human = players[info.humanIndex];
    const p = players[index];
    const toCall = currentBet - p.currentBet;

    if (toCall <= 0 || !human || human.folded || !human.allIn || human.currentBet !== currentBet) {
        return false;
    }

    return handActionHistory.some(a => {
        return a.handNumber === handNumber &&
            a.street === street &&
            a.playerIndex === info.humanIndex &&
            a.isAllIn &&
            (a.action === "bet" || a.action === "raise");
    });
}

function getHumanAllInContestInfo(index, info) {
    const humanIndex = info && Number.isInteger(info.humanIndex) ? info.humanIndex : players.findIndex(p => p.isHuman);
    const committedNonHumanOpponents = players.filter((p, i) => {
        if (!p || i === index || i === humanIndex) return false;
        if (p.folded || p.bankrupt) return false;
        if (p.currentBet <= 0) return false;
        return p.allIn || p.currentBet >= currentBet;
    });

    const priorNonHumanCallers = handActionHistory.filter(a => {
        return a.handNumber === handNumber &&
            a.street === street &&
            a.playerIndex !== index &&
            a.playerIndex !== humanIndex &&
            (a.action === "call" || a.action === "raise") &&
            a.currentBetAfterAction >= currentBet &&
            a.amountPaid > 0;
    });

    return {
        committedNonHumanOpponents: committedNonHumanOpponents.length,
        priorNonHumanCallers: priorNonHumanCallers.length,
        overcallPressure: committedNonHumanOpponents.length >= 1,
        multiwayAllInPressure: committedNonHumanOpponents.length >= 2
    };
}

function shouldCallHumanAllIn(index, notation, strength, toCall) {
    if (!isFacingHumanAllIn(index)) {
        return { decisive: false, call: false, reason: "not-facing-human-allin" };
    }

    const p = players[index];
    const info = getHumanAllInAdaptation();
    const contest = getHumanAllInContestInfo(index, info);
    const costRatio = toCall / Math.max(1, p.chips + toCall);
    const high = rangeRankValue(notation[0]);
    const low = notation.length === 2 ? high : rangeRankValue(notation[1]);
    const pocketPair = notation.length === 2;
    const suited = notation.endsWith("s");
    const ace = high === 14;
    const broadway = high >= 11 && low >= 10;
    const kingHighGood = high === 13 && low >= 10;
    const queenJackOrBetter = high === 12 && low >= 11;
    const suitedAce = ace && suited;
    const premiumAce = ace && low >= 12;
    const strongAce = ace && low >= 10;
    const premiumBroadway = broadway && (high === 14 || (high === 13 && low >= 12));
    const strongPocket = pocketPair && high >= 9;
    const mediumPocket = pocketPair && high >= 6;

    const earlySampleBigJamGuard = (!info.lifetimeSampleReady || info.priorHands < 12) && costRatio >= 0.45;
    const earlySamplePremiumPair = pocketPair && high >= 12; // QQ+
    const earlySampleVeryStrongPair = pocketPair && high >= 11 && costRatio <= 0.42; // JJ only if price is not too high
    const earlySampleAceKing = ace && low === 13;
    const earlySampleAceQueenSuited = notation === "AQs" && costRatio <= 0.38;

    if (earlySampleBigJamGuard) {
        const earlyCall = earlySamplePremiumPair ||
            earlySampleVeryStrongPair ||
            earlySampleAceKing ||
            earlySampleAceQueenSuited;

        return {
            decisive: true,
            call: earlyCall,
            reason: "human-allin-early-sample-big-jam-guard",
            adaptationLevel: info.level,
            lifetimeRate: info.lifetimeRate,
            priorHands: info.priorHands,
            priorLifetimeAllIns: info.priorLifetimeAllIns,
            lifetimeSampleReady: info.lifetimeSampleReady,
            recentAggressiveAllIns: info.recentAggressiveAllIns,
            adaptationTrigger: info.trigger,
            adaptationBand: info.band,
            costRatio,
            callBand: "early-sample-big-jam-premium-only",
            earlySampleAllInGuard: true,
            earlySampleAllInGuardReason: "樣本不足且面對超大 human all-in；只用 QQ+ / AK，較便宜時才用 JJ 或 AQs 跟注",
            overcallPressure: contest.overcallPressure,
            multiwayAllInPressure: contest.multiwayAllInPressure,
            committedNonHumanOpponents: contest.committedNonHumanOpponents,
            priorNonHumanCallers: contest.priorNonHumanCallers
        };
    }

    let call = false;
    let callBand = "single-caller";

    // 如果已經有人跟了玩家的 All-in，後面的 AI 不能再用「單挑抓 bluff」範圍 overcall。
    // 多方 all-in 時，QTo / A6o 這類牌即使對亂推玩家有單挑勝率，也會被嚴重反向隱含賠率懲罰。
    if (contest.multiwayAllInPressure) {
        callBand = "multiway-overcall-tight";
        if (info.level <= 0) {
            call = strength >= 3 && (pocketPair || premiumAce || (suited && premiumBroadway));
        } else if (info.level === 1) {
            call = strength >= 3 && (pocketPair || premiumAce || premiumBroadway || (suitedAce && low >= 11));
        } else if (info.level === 2) {
            call = (strength >= 3 && (pocketPair || strongAce || premiumBroadway || (suited && kingHighGood))) ||
                (pocketPair && high >= 10 && costRatio <= 0.55);
        } else {
            call = strength >= 3 ||
                (strongPocket && costRatio <= 0.62) ||
                (ace && low >= 10 && costRatio <= 0.62) ||
                (suited && premiumBroadway && costRatio <= 0.64);
        }
    } else if (contest.overcallPressure) {
        callBand = "one-overcaller-tightened";
        if (info.level <= 0) {
            call = strength >= 3 ||
                (pocketPair && high >= 12 && costRatio <= 0.55) ||
                (premiumAce && costRatio <= 0.52);
        } else if (info.level === 1) {
            call = strength >= 3 ||
                (pocketPair && high >= 10 && costRatio <= 0.58) ||
                (premiumAce && costRatio <= 0.56) ||
                (suited && premiumBroadway && costRatio <= 0.54);
        } else if (info.level === 2) {
            call = strength >= 3 ||
                (pocketPair && high >= 8 && costRatio <= 0.60) ||
                (ace && low >= 11 && costRatio <= 0.58) ||
                (suited && broadway && high >= 13 && costRatio <= 0.56);
        } else {
            call = strength >= 2 ||
                (mediumPocket && costRatio <= 0.66) ||
                (ace && low >= 8 && costRatio <= 0.64) ||
                (broadway && costRatio <= 0.60) ||
                (suited && high >= 10 && low >= 8 && costRatio <= 0.55);
        }
    } else {
        // 第一個抓你的人可以放寬，但仍受樣本數與適應等級控制。
        if (info.level <= 0) {
            // 未建立玩家亂推樣本時，面對 100BB 左右的開局 All-in 必須極緊。
            // v14 只用 strength >= 3，會讓 KQo 這種非 premium 牌在第 1 手跟注，太鬆。
            const level0HugeJam = costRatio >= 0.45;
            const level0PremiumPair = pocketPair && high >= 12; // QQ+
            const level0VeryStrongPair = pocketPair && high >= 11 && costRatio <= 0.42; // JJ 在較低代價才跟
            const level0AceKing = ace && low === 13;
            const level0AceQueenSuited = notation === "AQs" && costRatio <= 0.42;

            if (level0HugeJam) {
                callBand = "single-caller-level0-huge-jam-premium-only";
                call = level0PremiumPair || level0AceKing;
            } else {
                call = level0PremiumPair ||
                    level0VeryStrongPair ||
                    level0AceKing ||
                    level0AceQueenSuited ||
                    (strength >= 3 && costRatio <= 0.35) ||
                    (strength >= 2 && costRatio <= 0.30);
            }
        } else if (info.level === 1) {
            call = strength >= 2 ||
                (pocketPair && high >= 8 && costRatio <= 0.58) ||
                (ace && low >= 11 && costRatio <= 0.55) ||
                (broadway && costRatio <= 0.48);
        } else if (info.level === 2) {
            // v15 問題：level 2 曾經把「strength >= 1 且 costRatio <= 0.58」直接放行，
            // 導致 75s / 98o 這類投機牌面對 100BB 級別 open jam 也會跟。
            // level 2 代表「開始相信玩家在亂推」，但還不是可以用邊緣投機牌抓光的程度。
            callBand = "single-caller-level2-value-heavy";
            call = strength >= 2 ||
                (pocketPair && high >= 5 && costRatio <= 0.64) ||
                (ace && low >= 8 && costRatio <= 0.62) ||
                (strongAce && costRatio <= 0.66) ||
                (broadway && costRatio <= 0.58) ||
                (suited && high >= 11 && low >= 10 && costRatio <= 0.54);
        } else {
            // level 3 仍然要反制每手 All-in 的玩家，但不能「任何 strength >= 1」都跟。
            // 投機型 suited connector 只有在代價明顯較低時才跟；深碼大額 jam 仍以對子、A high、Broadway 為主。
            callBand = "single-caller-level3-anti-maniac-filtered";
            call = strength >= 2 ||
                pocketPair ||
                (ace && low >= 2 && costRatio <= 0.72) ||
                broadway ||
                kingHighGood ||
                (queenJackOrBetter && costRatio <= 0.68) ||
                (suited && high >= 10 && low >= 8 && costRatio <= 0.58) ||
                (suited && high >= 8 && low >= 7 && costRatio <= 0.38);
        }
    }

    return {
        decisive: true,
        call,
        reason: "human-allin-adapt-level-" + info.level,
        adaptationLevel: info.level,
        lifetimeRate: info.lifetimeRate,
        priorHands: info.priorHands,
        priorLifetimeAllIns: info.priorLifetimeAllIns,
        lifetimeSampleReady: info.lifetimeSampleReady,
        recentAggressiveAllIns: info.recentAggressiveAllIns,
        adaptationTrigger: info.trigger,
        adaptationBand: info.band,
        costRatio,
        callBand,
        earlySampleAllInGuard: false,
        earlySampleAllInGuardReason: null,
        overcallPressure: contest.overcallPressure,
        multiwayAllInPressure: contest.multiwayAllInPressure,
        committedNonHumanOpponents: contest.committedNonHumanOpponents,
        priorNonHumanCallers: contest.priorNonHumanCallers
    };
}


function executeHeadsUpPreflopAction(index, notation, strength, posCategory, toCall, profile, stack, aggression, tightness, randomValue) {
    if (activePlayerCount() !== 2) {
        return { handled: false, reason: "not-heads-up" };
    }

    const p = players[index];
    const r = randomValue;
    const bb = Math.max(1, bigBlind);
    const stackBB = p.chips / bb;
    const costRatio = toCall / Math.max(1, p.chips + toCall);
    const facingRaise = currentBet > bigBlind;
    const huStrength = getHeadsUpNotationStrength(notation, strength);
    const playable = isHeadsUpPlayableNotation(notation, strength);
    const high = rangeRankValue(notation[0]);
    const low = notation.length === 2 ? high : rangeRankValue(notation[1]);
    const suited = notation.endsWith("s");
    const pocketPair = notation.length === 2;
    const gap = pocketPair ? 0 : high - low;
    const isSmallBlindFirstIn = toCall > 0 && toCall <= bb && !facingRaise;
    const canJamOver = p.chips > toCall;

    function headsUpOpenRaise() {
        const target = Math.max(bb * 2, Math.floor(bb * (stackBB <= 12 ? 2.2 : 2.5)));
        raisePlayer(index, Math.min(p.currentBet + p.chips, target));
    }

    function jamOrCall() {
        if (canJamOver && p.chips <= bb * 12) {
            shovePlayer(index);
        } else {
            callPlayer(index);
        }
    }

    // 12BB 以下進入 heads-up push/fold。這裡不再受「極緊型」個性過度束縛。
    if (stackBB <= 15) {
        if (toCall === 0) {
            if (huStrength >= 1 && r < 0.72 + aggression * 0.18) shovePlayer(index);
            else callPlayer(index);
            return { handled: true, reason: "v26-heads-up-short-check-or-jam" };
        }

        if (isSmallBlindFirstIn) {
            if (huStrength >= 1 || (playable && r < 0.90) || r < 0.62) {
                if ((huStrength >= 1 || playable) && r < 0.78) shovePlayer(index);
                else callPlayer(index);
            } else {
                foldPlayer(index);
            }
            return { handled: true, reason: "v26-heads-up-short-small-blind" };
        }

        if (facingRaise) {
            if (
                huStrength >= 2 ||
                pocketPair ||
                high === 14 ||
                (high === 13 && low >= 4) ||
                (high === 12 && low >= 6) ||
                (suited && high >= 7) ||
                (gap <= 2 && high >= 7) ||
                costRatio <= 0.32
            ) {
                jamOrCall();
            } else {
                foldPlayer(index);
            }
            return { handled: true, reason: "v26-heads-up-short-facing-raise" };
        }
    }

    // 小盲第一個進池：heads-up 不應該像九人桌那樣大量 open-fold。
    if (isSmallBlindFirstIn) {
        if (huStrength >= 2) {
            if (r < 0.72 + aggression * 0.12) headsUpOpenRaise();
            else callPlayer(index);
        } else if (huStrength === 1 || playable) {
            if (r < 0.38 + aggression * 0.16) headsUpOpenRaise();
            else callPlayer(index);
        } else {
            if (r < 0.68 - tightness * 0.12) callPlayer(index);
            else foldPlayer(index);
        }
        return { handled: true, reason: "heads-up-small-blind-first-in" };
    }

    // 大盲無人加注時，適度主動壓迫；但不亂 All-in。
    if (toCall === 0) {
        if (huStrength >= 2 && r < 0.45 + aggression * 0.15) {
            headsUpOpenRaise();
        } else if (huStrength === 1 && r < 0.16 + aggression * 0.10) {
            headsUpOpenRaise();
        } else {
            callPlayer(index);
        }
        return { handled: true, reason: "heads-up-free-option" };
    }

    // 面對玩家 2.2x～3x steal，防守範圍要比多人桌寬很多，否則會被盲注磨死。
    if (facingRaise) {
        if (huStrength >= 3) {
            if (r < 0.55 + aggression * 0.18 && canJamOver && stackBB <= 28) shovePlayer(index);
            else raisePlayer(index, threeBetTo(stack, aggression));
        } else if (huStrength >= 2) {
            if (canJamOver && stackBB <= 18 && r < 0.42 + aggression * 0.18) shovePlayer(index);
            else callPlayer(index);
        } else if (huStrength === 1 || playable) {
            if (costRatio <= 0.24 || toCall <= bb * 2) {
                if (canJamOver && stackBB <= 14 && r < 0.24 + aggression * 0.14) shovePlayer(index);
                else callPlayer(index);
            } else if (suited && high >= 10 && costRatio <= 0.30 && r < 0.45) {
                callPlayer(index);
            } else {
                foldPlayer(index);
            }
        } else {
            if (toCall <= bb && r < 0.45 - tightness * 0.10) callPlayer(index);
            else foldPlayer(index);
        }
        return { handled: true, reason: "heads-up-facing-raise" };
    }

    return { handled: false, reason: "heads-up-no-match" };
}


function executePreflopAction(index) {
    const p = players[index];

    if (!p.hole || p.hole.length < 2) {
        foldPlayer(index);
        return;
    }

    const toCall = currentBet - p.currentBet;
    const notation = getHandNotation(p.hole[0], p.hole[1]);
    const posCategory = getPositionCategory(index);
    const activeCountForDecision = activePlayerCount();
    const strength = getDynamicPreflopStrength(notation, posCategory, activeCountForDecision);
    const baseStrength = getPreflopStrength(notation);
    const premiumReraiseTier = getPremiumReraiseTier(notation);
    const humanAllInResponse = shouldCallHumanAllIn(index, notation, strength, toCall);
    const desperationCheck = shouldDesperationJam(index, notation, strength, posCategory, toCall);
    recordPreflopDecisionDebug(index, notation, strength, posCategory, toCall, {
        ...desperationCheck,
        humanAllInResponse
    });
    annotatePreflopDecisionDebug(index, {
        baseStrength,
        premiumReraiseTier,
        v25DynamicStrengthNote: strength > baseStrength ? "dynamic-upgraded" : "base-strength",
        v27PremiumStackOffTier: premiumReraiseTier
    });

    if (humanAllInResponse.decisive) {
        if (humanAllInResponse.call) {
            callPlayer(index);
        } else {
            foldPlayer(index);
        }
        return;
    }

    const profile = p.profile || aiProfiles.TAG;
    const stack = getStackProfile(index);
    let aggression = profile.aggression;
    let tightness = profile.tightness;

    if (profile.name === "鬆凶型") {
        tightness -= 0.30;
        aggression += 0.20;

        if (isLateOrBlind(posCategory) || activePlayerCount() <= 2) {
            tightness -= 0.20;
            aggression += 0.25;
        }
    }

    if (stack.type === "chipLeader") {
        aggression += 0.22;
        tightness -= 0.20;
    } else if (stack.type === "big") {
        aggression += 0.14;
        tightness -= 0.12;
    } else if (stack.type === "desperate") {
        aggression += 0.12;
        tightness += 0.08;
    } else if (stack.type === "short") {
        aggression += 0.05;
        tightness += 0.10;
    }

    aggression = Math.max(0.05, Math.min(1.25, aggression));
    tightness = Math.max(0.05, Math.min(1.10, tightness));

    const shortStackChartDecision = getShortStackChartDecision(index, notation, strength, posCategory, toCall);
    if (executeShortStackChartAction(index, shortStackChartDecision, stack, aggression)) {
        return;
    }

    if (desperationCheck.jam) {
        raisePlayer(index, p.currentBet + p.chips);
        return;
    }
    const facingRaise = currentBet > bigBlind;
    const headsUp = activePlayerCount() <= 2;
    const veryShortStacks = countVeryShortStacks(index);

    const r = Math.random();
    const cheapCall = toCall <= bigBlind * 1.5;
    const moderateCall = toCall <= bigBlind * 3;
    const bigStackPressureSpot =
        (stack.type === "chipLeader" || stack.type === "big") &&
        (isLateOrBlind(posCategory) || headsUp || veryShortStacks >= 2);

    const pressurePlan = getTournamentPressurePlan(index, notation, strength, posCategory, stack, profile, aggression, tightness, toCall);
    annotatePreflopDecisionDebug(index, { pressurePlanReason: pressurePlan.reason || "none" });
    if (pressurePlan.action === "jam") {
        shovePlayer(index);
        return;
    }
    if (pressurePlan.action === "raise") {
        raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
        return;
    }
    if (pressurePlan.action === "threebet") {
        const deepGuard = getDeepStackReraiseGuard(notation, strength, posCategory, activeCountForDecision, p.chips / Math.max(1, bigBlind), toCall);
        annotatePreflopDecisionDebug(index, {
            v25DeepStackReraiseGuard: deepGuard.reason,
            v25DeepStackReraiseAction: deepGuard.action || "allow"
        });
        if (deepGuard.block) {
            if (deepGuard.action === "call") callPlayer(index);
            else foldPlayer(index);
            return;
        }
        raisePlayer(index, threeBetTo(stack, aggression));
        return;
    }

    const headsUpDecision = executeHeadsUpPreflopAction(index, notation, strength, posCategory, toCall, profile, stack, aggression, tightness, r);
    if (headsUpDecision.handled) {
        return;
    }

    // 8BB 以下：接近 push/fold。避免短碼用平跟慢慢被盲注磨死。
    if (stack.type === "desperate") {
        if (toCall === 0) {
            if (strength >= 1 && r < 0.45 + aggression * 0.25) shovePlayer(index);
            else callPlayer(index);
            return;
        }

        if (strength >= 2) {
            shovePlayer(index);
            return;
        }

        if (strength === 1 && isLateOrBlind(posCategory) && toCall <= p.chips * 0.35 && r < 0.55) {
            shovePlayer(index);
            return;
        }

        if (headsUp && strength === 1 && r < 0.35) {
            shovePlayer(index);
            return;
        }

        foldPlayer(index);
        return;
    }

    // 9–15BB：少做尷尬跟注，偏向全推或棄牌。
    if (stack.type === "short") {
        if (strength === 3) {
            if (facingRaise || toCall >= p.chips * 0.18 || r < 0.65) shovePlayer(index);
            else raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            return;
        }

        if (strength === 2) {
            if (facingRaise) {
                if (toCall <= p.chips * 0.22 && r < 0.55 + aggression * 0.20) shovePlayer(index);
                else if (toCall <= bigBlind * 2 && r < 0.35) callPlayer(index);
                else foldPlayer(index);
            } else {
                if (r < 0.45 + aggression * 0.25) shovePlayer(index);
                else raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            }
            return;
        }

        if (strength === 1) {
            if (!facingRaise && isLateOrBlind(posCategory) && r < 0.22 + aggression * 0.22) {
                shovePlayer(index);
            } else if (cheapCall && r < 0.25) {
                callPlayer(index);
            } else {
                foldPlayer(index);
            }
            return;
        }

        if (toCall === 0) callPlayer(index);
        else foldPlayer(index);
        return;
    }

    // 深碼與大籌碼：用籌碼壓迫，尤其翻前不因小額跟注輕易放棄。
    if (strength === 3) {
        if (facingRaise) {
            const deepGuard = getDeepStackReraiseGuard(notation, strength, posCategory, activeCountForDecision, p.chips / Math.max(1, bigBlind), toCall);
            annotatePreflopDecisionDebug(index, {
                v25DeepStackReraiseGuard: deepGuard.reason,
                v25DeepStackReraiseAction: deepGuard.action || "allow"
            });
            if (deepGuard.block) {
                if (deepGuard.action === "call") callPlayer(index);
                else foldPlayer(index);
                return;
            }

            if (currentBet >= p.chips * 0.28) {
                if (isNutPremiumReraiseTier(premiumReraiseTier) || p.chips / Math.max(1, bigBlind) <= 22) shovePlayer(index);
                else callPlayer(index);
            } else if (r < 0.80 + aggression * 0.12) raisePlayer(index, threeBetTo(stack, aggression));
            else callPlayer(index);
        } else {
            if (r < 0.82 + aggression * 0.10) raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            else callPlayer(index);
        }
        return;
    }

    if (strength === 2) {
        if (facingRaise) {
            if (currentBet >= p.chips * 0.35) {
                if (isNutPremiumReraiseTier(premiumReraiseTier) && r < 0.30 + aggression * 0.25) shovePlayer(index);
                else foldPlayer(index);
            } else if (bigStackPressureSpot && r < 0.28 + aggression * 0.22) {
                const deepGuard = getDeepStackReraiseGuard(notation, strength, posCategory, activeCountForDecision, p.chips / Math.max(1, bigBlind), toCall);
                annotatePreflopDecisionDebug(index, {
                    v25DeepStackReraiseGuard: deepGuard.reason,
                    v25DeepStackReraiseAction: deepGuard.action || "allow"
                });
                if (deepGuard.block) {
                    if (deepGuard.action === "call") callPlayer(index);
                    else foldPlayer(index);
                } else {
                    raisePlayer(index, threeBetTo(stack, aggression));
                }
            } else if (toCall <= p.chips * 0.18 || (bigStackPressureSpot && toCall <= p.chips * 0.28)) {
                callPlayer(index);
            } else {
                foldPlayer(index);
            }
        } else {
            if (r < 0.70 + aggression * 0.18) raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            else callPlayer(index);
        }
        return;
    }

    if (strength === 1) {
        if (facingRaise) {
            if (profile.name === "鬆凶型" && moderateCall && r < 0.65 - tightness * 0.10) {
                if (r < 0.25 + aggression * 0.10) {
                    raisePlayer(index, threeBetTo(stack, aggression));
                } else {
                    callPlayer(index);
                }
                return;
            }
            if (bigStackPressureSpot && moderateCall && r < 0.55 - tightness * 0.12) {
                callPlayer(index);
            } else if (profile.name === "跟注站" && cheapCall && r < 0.55) {
                callPlayer(index);
            } else if (bigStackPressureSpot && isLateOrBlind(posCategory) && r < 0.10 + aggression * 0.07) {
                raisePlayer(index, threeBetTo(stack, aggression));
            } else if (isLateOrBlind(posCategory) && cheapCall && r < 0.42 - tightness * 0.08) {
                callPlayer(index);
            } else {
                foldPlayer(index);
            }
        } else {
            if (bigStackPressureSpot && r < (activePlayerCount() >= 6 ? 0.42 : 0.58) + aggression * 0.14) {
                raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            } else if (isLateOrBlind(posCategory) && r < (activePlayerCount() >= 6 ? 0.34 : 0.50) - tightness * 0.08) {
                raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            } else if (cheapCall || toCall === 0 || profile.name === "跟注站") {
                callPlayer(index);
            } else {
                foldPlayer(index);
            }
        }
        return;
    }

    // 垃圾牌：v24 收緊 full-ring 深碼 open raise；大籌碼可以施壓，但不能用 92o 這類牌亂偷。
    if (strength === 0) {
        const activeCountNow = activePlayerCount();
        const marginalZeroPlayable = isMarginalButPlayableZeroPreflop(notation, posCategory, activeCountNow);
        const trashOpenBlocked = isTrashStrengthZeroOpenBlocked(notation, posCategory, activeCountNow, p.chips / Math.max(1, bigBlind), toCall);
        annotatePreflopDecisionDebug(index, {
            marginalZeroPlayable,
            trashOpenBlocked,
            v24PreflopGuard: trashOpenBlocked ? "trash-open-blocked" : "not-blocked"
        });

        if (toCall === 0) {
            callPlayer(index);
            return;
        }

        if (!facingRaise && profile.name === "鬆凶型" && isLateOrBlind(posCategory) && marginalZeroPlayable && !trashOpenBlocked && r < 0.24 + aggression * 0.10) {
            annotatePreflopDecisionDebug(index, { pressurePlanReason: "v24-lag-marginal-zero-steal" });
            raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            return;
        }

        const stationCheapCallChance = cheapCall ? getStrengthZeroCheapCallProfileFactor(profile, posCategory, activeCountNow, notation) : 0;
        const bigStackCheapCallBoost = bigStackPressureSpot && cheapCall && marginalZeroPlayable;

        if (!facingRaise && bigStackPressureSpot) {
            if (isLateOrBlind(posCategory) && marginalZeroPlayable && !trashOpenBlocked && r < 0.18 + aggression * 0.08) {
                annotatePreflopDecisionDebug(index, { pressurePlanReason: "v24-big-stack-marginal-zero-steal" });
                raisePlayer(index, openRaiseTo(posCategory, stack, aggression));
            } else if (cheapCall && marginalZeroPlayable && r < 0.34 - tightness * 0.10) {
                callPlayer(index);
            } else {
                foldPlayer(index);
            }
            return;
        }

        if (stationCheapCallChance > 0 && r < stationCheapCallChance) {
            callPlayer(index);
            return;
        }

        if (bigStackCheapCallBoost && r < 0.24) {
            callPlayer(index);
            return;
        }

        if (facingRaise && bigStackPressureSpot && moderateCall && r < 0.08 + aggression * 0.05) {
            raisePlayer(index, threeBetTo(stack, aggression));
            return;
        }

        if (headsUp && cheapCall && r < 0.34 + aggression * 0.12) {
            callPlayer(index);
            return;
        }

        foldPlayer(index);
    }
}

function moveDealerToActivePlayer() {
    for (let i = 0; i < players.length; i++) {
        dealerIndex = (dealerIndex + 1) % players.length;
        if (players[dealerIndex].chips > 0) return;
    }
}

function getSmallBlindIndex() {
    if (activePlayerCount() === 2) return dealerIndex;
    return nextPlayableIndex(dealerIndex);
}

function getBigBlindIndex() {
    if (activePlayerCount() === 2) return nextPlayableIndex(dealerIndex);
    return nextPlayableIndex(getSmallBlindIndex());
}

function activePlayerCount() {
    return players.filter(p => p.chips > 0).length;
}

function normalizeEliminatedPlayersAtHandBoundary() {
    for (const p of players) {
        if (p.chips <= 0) {
            p.chips = 0;
            p.folded = true;
            p.allIn = false;
            p.currentBet = 0;
            p.acted = true;

            if (!handInProgress) {
                p.lastAction = "破產";
            }
        }
    }
}

function normalizeTournamentEndState(winnerIndex) {
    for (let i = 0; i < players.length; i++) {
        const p = players[i];

        p.currentBet = 0;
        p.acted = true;
        p.allIn = false;

        if (p.chips <= 0) {
            p.chips = 0;
            p.folded = true;
            p.lastAction = "破產";
        } else if (i === winnerIndex) {
            p.folded = false;
            p.lastAction = "冠軍";
        } else {
            p.folded = true;
            p.lastAction = "淘汰";
        }
    }
}

function getTournamentWinnerIndex() {
    const alive = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.p.chips > 0);

    if (alive.length === 1) return alive[0].i;
    return null;
}

function checkTournamentGameOver() {
    normalizeEliminatedPlayersAtHandBoundary();

    const winnerIndex = getTournamentWinnerIndex();

    if (winnerIndex === null) return false;

    tournamentGameOver = true;
    handInProgress = false;
    waitingForHuman = false;
    autoPlayMode = false;
    humanTestMode = "none";
    humanTestModeLabel = "";
    clearTimeout(handEndTimer);
    clearPendingAiAction("tournament-over");
    normalizeTournamentEndState(winnerIndex);
    logChipConservationCheck("tournament-over");

    const winner = players[winnerIndex];
    const msg = "遊戲結束！冠軍是 " + winner.name + "，剩餘籌碼 " + money(winner.chips) + "。";

    if (handEndMessage !== msg) {
        log("<span class='winText'>" + msg + "</span>");
    }

    handEndMessage = msg;
    handEndPhase = "gameover";
    render();

    if (handleBatchTournamentFinished(winnerIndex)) {
        return true;
    }

    return true;
}

function updateBlindByRemainingPlayers() {
    const alive = activePlayerCount();
    const scale = initialChips / 2000;

    let baseSmallBlind = 10;

    if (alive >= 7) {
        baseSmallBlind = 10;
    } else if (alive >= 5) {
        baseSmallBlind = 20;
    } else if (alive === 4) {
        baseSmallBlind = 50;
    } else if (alive === 3) {
        baseSmallBlind = 100;
    } else if (alive === 2) {
        baseSmallBlind = 200;
    }

    // v26：只靠「剩餘人數」調盲會讓 heads-up 拖到 500+ 手。
    // 加入時間壓力，但不影響前期手感；越後期盲注自然上升，讓短碼進入 push/fold。
    let timeSmallBlind = 10;
    if (handNumber >= 560) timeSmallBlind = 800;
    else if (handNumber >= 430) timeSmallBlind = 500;
    else if (handNumber >= 320) timeSmallBlind = 300;
    else if (handNumber >= 220) timeSmallBlind = 200;
    else if (handNumber >= 150) timeSmallBlind = 100;
    else if (handNumber >= 100) timeSmallBlind = 50;
    else if (handNumber >= 60) timeSmallBlind = 20;

    baseSmallBlind = Math.max(baseSmallBlind, timeSmallBlind);

    smallBlind = Math.max(1, Math.round(baseSmallBlind * scale));
    bigBlind = smallBlind * 2;
    minRaise = bigBlind;

    const changed =
        lastBlindSmallBlind !== null &&
        (smallBlind !== lastBlindSmallBlind || bigBlind !== lastBlindBigBlind);

    lastBlindSmallBlind = smallBlind;
    lastBlindBigBlind = bigBlind;

    return changed;
}

function createDeck() {
    const d = [];
    const suits = ["S", "H", "D", "C"];
    for (const s of suits) {
        for (let r = 2; r <= 14; r++) {
            d.push({ rank: r, suit: s });
        }
    }
    return d;
}

function isActualNutsOnCurrentBoard(hole, boardCards, heroMade) {
    if (!hole || hole.length !== 2 || !boardCards || boardCards.length < 3 || !heroMade) return false;

    const dead = new Set(hole.concat(boardCards).map(cardKey));
    const remaining = createDeck().filter(c => !dead.has(cardKey(c)));

    for (let i = 0; i < remaining.length - 1; i++) {
        for (let j = i + 1; j < remaining.length; j++) {
            const opponentBest = bestOfSeven([remaining[i], remaining[j]].concat(boardCards));
            if (opponentBest && compareHands(opponentBest, heroMade) > 0) {
                return false;
            }
        }
    }
    return true;
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function postBlind(index, amount, label) {
    const p = players[index];
    const pay = Math.min(amount, p.chips);

    p.chips -= pay;
    p.currentBet += pay;
    p.totalBet += pay;
    pot += pay;

    if (p.chips === 0) {
        p.allIn = true;

        if (pay < amount) {
            p.lastAction = label + "不足 All-in " + money(pay);
            log(p.name + " " + label + "不足，All-in " + money(pay) + "。原本應付 " + money(amount) + "。");
        } else {
            p.lastAction = label + " All-in " + money(pay);
            log(p.name + " " + label + " All-in " + money(pay) + "。");
        }
    } else {
        p.lastAction = label + " " + money(pay);
        log(p.name + " 下" + label + " " + money(pay) + "。");
    }

    recordAction(index, label === "小盲" ? "smallBlind" : "bigBlind", pay, {
        forcedBlind: true,
        blindAmount: amount
    });
}

function recordAction(index, actionType, amountPaid, extra = {}) {
    const p = players[index];
    const entry = {
        handNumber,
        street,
        playerIndex: index,
        playerName: p.name,
        action: actionType,
        amountPaid: amountPaid || 0,
        currentBetAfterAction: p.currentBet,
        totalBetAfterAction: p.totalBet,
        potAfterAction: pot,
        boardSnapshot: board.map(c => ({ rank: c.rank, suit: c.suit })),
        isAllIn: p.allIn,
        ...extra
    };

    updateOpponentModelOnAction(index, actionType, amountPaid || 0, extra, entry);

    handActionHistory.push(entry);
    globalActionHistory.push(entry);

    if (street === "preflop") {
        completePreflopDecisionDebug(index, actionType, amountPaid, extra);
    }

    if (!FORMAL_RELEASE) autoLogEntries.push({
        type: "action",
        ...entry
    });

    if (globalActionHistory.length > 300) {
        globalActionHistory.shift();
    }
}

function markVoluntaryPreflop(index, didRaise = false) {
    const p = players[index];
    if (street !== "preflop" || !p.flags || !p.flags.dealtThisHand) return;

    p.flags.voluntarilyPutMoneyInPotThisHand = true;

    if (didRaise) {
        p.flags.preflopRaisedThisHand = true;
    }
}

function finalizeHandStats() {
    if (statsFinalizedThisHand) return;

    for (const p of players) {
        if (!p.flags || !p.flags.dealtThisHand || p.flags.statsFinalizedForThisHand) continue;

        if (p.flags.voluntarilyPutMoneyInPotThisHand) {
            p.stats.vpipHands++;
        }

        if (p.flags.preflopRaisedThisHand) {
            p.stats.pfrHands++;
        }

        p.flags.statsFinalizedForThisHand = true;
    }

    statsFinalizedThisHand = true;
}

function shouldRunOutBoardWithoutMoreBetting() {
    const contenders = players.filter(p => !p.folded && p.hole.length === 2);
    if (contenders.length < 2) return false;

    const ableToAct = players.filter(p => canAct(p));
    if (ableToAct.length > 1) return false;

    if (ableToAct.length === 0) return true;

    // 若唯一還有籌碼的人已經補齊當前注額，其他未棄牌者又都 All-in，
    // 後續街道不能再產生新下注，只能直接發完公牌後攤牌。
    return ableToAct[0].currentBet === currentBet;
}

function runOutBoardToShowdown() {
    if (!handInProgress || communityRevealInProgress) return;

    if (board.length < 3) {
        burnCard();
        while (board.length < 3) {
            board.push(deck.pop());
        }
        street = "flop";
        v34CFlopCBetTracker = null;
        log("翻牌：" + cardsToText(board));
    }

    if (board.length === 3) {
        burnCard();
        board.push(deck.pop());
        street = "turn";
        v34CFlopCBetTracker = null;
        log("轉牌：" + cardToText(board[3]));
    }

    if (board.length === 4) {
        burnCard();
        board.push(deck.pop());
        street = "river";
        v34CFlopCBetTracker = null;
        log("河牌：" + cardToText(board[4]));
    }

    revealCommunityCardsTo(board.length, () => {
        if (!handInProgress) return;
        showdown();
    });
}


function clearTurnWatchdog() {
    if (turnWatchdogTimer) {
        clearTimeout(turnWatchdogTimer);
        turnWatchdogTimer = null;
    }
}

function isPendingAiAction(index, token) {
    return handInProgress &&
        pendingAiActionIndex === index &&
        pendingAiActionToken === token &&
        pendingAiActionHandId === handLifecycleId;
}

function startTurnWatchdog(index, token) {
    clearTurnWatchdog();

    turnWatchdogTimer = setTimeout(() => {
        if (!isPendingAiAction(index, token)) return;

        const p = players[index];
        const name = p ? p.name : "未知玩家";
        log("<span class='bustLog'>防卡死機制啟動：" + name + " 的決策逾時，系統自動採用安全動作。</span>");
        safeFallbackAiAction(index, "watchdog-timeout");
    }, 6500);
}

function safeFallbackAiAction(index, reason = "fallback") {
    clearTurnWatchdog();

    if (!handInProgress) return;

    const p = players[index];

    if (!p || !canAct(p)) {
        actionIndex = nextPlayableIndex(index >= 0 ? index : dealerIndex);
        proceedTurn();
        return;
    }

    const toCall = Math.max(0, currentBet - p.currentBet);

    try {
        if (toCall === 0) {
            callPlayer(index);
        } else if (street === "preflop") {
            const cheap = toCall <= Math.max(bigBlind, p.chips * 0.08);
            if (cheap) callPlayer(index);
            else foldPlayer(index);
        } else {
            const potOdds = toCall / Math.max(1, pot + toCall);
            if (toCall <= bigBlind || potOdds <= 0.22) callPlayer(index);
            else foldPlayer(index);
        }
    } catch (err) {
        console.error("safeFallbackAiAction failed", reason, err);
        p.folded = true;
        p.acted = true;
        p.lastAction = "系統棄牌";
        recordAction(index, "fold", 0);
        log(p.name + " 系統自動棄牌。原因：" + reason);
    }

    finishAiTurn(index);
}

function proceedTurn() {
    render();

    if (!handInProgress) return;
    if (deckShuffleAnimationInProgress || holeDealAnimationInProgress || communityRevealInProgress) return;

    const winnerByFold = checkOnlyOneLeft();
    if (winnerByFold !== null) {
        awardPotByFold(winnerByFold, "其他玩家全部棄牌");
        return;
    }

    if (shouldRunOutBoardWithoutMoreBetting()) {
        runOutBoardToShowdown();
        return;
    }

    if (isBettingRoundComplete()) {
        advanceStreet();
        return;
    }

    const p = players[actionIndex];

    if (!p) {
        actionIndex = nextPlayableIndex(dealerIndex);
        setTimeout(proceedTurn, 80);
        return;
    }

    if (!canAct(p)) {
        p.acted = true;
        actionIndex = nextPlayableIndex(actionIndex);
        setTimeout(proceedTurn, 80);
        return;
    }

    if (p.isHuman && !autoPlayMode) {
        waitingForHuman = true;
        render();
    } else {
        waitingForHuman = false;
        performGTODecision(actionIndex);
    }
}

function finishAiTurn(index) {
    clearTurnWatchdog();
    pendingAiActionIndex = null;
    pendingAiActionHandId = 0;

    if (!handInProgress) {
        render();
        return;
    }

    actionIndex = nextPlayableIndex(index);
    proceedTurn();
}


function getPostflopOpponentBreakdown(index) {
    const all = players
        .map((p, i) => ({ p, i }))
        .filter(x => x.i !== index && x.p && !x.p.folded && !x.p.bankrupt && x.p.hole && x.p.hole.length === 2);

    const actionable = all.filter(x => !x.p.allIn && x.p.chips > 0);
    const allIn = all.filter(x => x.p.allIn || x.p.chips <= 0);

    return {
        all: all.length,
        actionable: actionable.length,
        allIn: allIn.length,
        allNames: all.map(x => x.p.name),
        actionableNames: actionable.map(x => x.p.name),
        allInNames: allIn.map(x => x.p.name)
    };
}

function getPostflopOpponentCount(index) {
    return getPostflopOpponentBreakdown(index).actionable;
}

function getShowdownOpponentCount(index) {
    return getPostflopOpponentBreakdown(index).all;
}

function getCurrentSPR(index) {
    const p = players[index];
    if (!p) return 0;

    const opponents = players.filter((opp, i) => {
        return i !== index && opp && !opp.folded && !opp.bankrupt && !opp.allIn && opp.chips > 0 && opp.hole && opp.hole.length === 2;
    });

    let effectiveStack = p.chips;
    if (opponents.length > 0) {
        const biggestRelevantOpponentStack = Math.max(...opponents.map(opp => opp.chips));
        effectiveStack = Math.min(p.chips, biggestRelevantOpponentStack);
    }

    return effectiveStack / Math.max(1, pot);
}

function getSafeOpponentRangeDebug(actingIndex) {
    try {
        const activeOpponents = players
            .map((playerObj, i) => ({ player: playerObj, index: i }))
            .filter(x => x.player && !x.player.folded && x.index !== actingIndex && x.player.hole && x.player.hole.length === 2);

        return activeOpponents.map(x => {
            try {
                const range = estimateOpponentRange(x.index);
                const rates = getEstimatedPreflopRates(x.index);
                return {
                    name: x.player.name,
                    actionSummary: getPreflopActionSummary(x.index),
                    vpip: rates.vpip,
                    pfr: rates.pfr,
                    top: getTopRangeNotations(range, 10)
                };
            } catch (err) {
                return {
                    name: x.player.name,
                    actionSummary: "range-error",
                    vpip: null,
                    pfr: null,
                    top: []
                };
            }
        });
    } catch (err) {
        return [];
    }
}
