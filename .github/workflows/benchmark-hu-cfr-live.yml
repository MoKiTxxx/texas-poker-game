name: HU CFR live A/B holdout

on:
  pull_request:
    branches:
      - feature/hu-preflop-cfr
    paths:
      - benchmark-hu-cfr-live.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - .github/workflows/benchmark-hu-cfr-live.yml

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - stack: 5
            seed: 510051
          - stack: 8
            seed: 810081
          - stack: 10
            seed: 1010101
          - stack: 12
            seed: 1212121
          - stack: 15
            seed: 1515151
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run duplicate HU CFR holdout
        env:
          BENCH_STACK_BB: ${{ matrix.stack }}
          BENCH_MIX: "1.0"
          BENCH_PAIRS: "500"
          BENCH_SEED: ${{ matrix.seed }}
        run: node benchmark-hu-cfr-live.js
