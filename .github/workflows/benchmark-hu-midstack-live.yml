name: HU midstack CFR live A/B holdout

on:
  pull_request:
    branches:
      - feature/hu-midstack-cfr
    paths:
      - benchmark-hu-midstack-live.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - .github/workflows/benchmark-hu-midstack-live.yml

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - stack: 12
            seed: 12012012
          - stack: 15
            seed: 15015015
          - stack: 18
            seed: 18018018
          - stack: 20
            seed: 20020020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run duplicate HU midstack CFR holdout
        env:
          BENCH_STACK_BB: ${{ matrix.stack }}
          BENCH_MIX: "1.0"
          BENCH_PAIRS: "1000"
          BENCH_SEED: ${{ matrix.seed }}
        run: node benchmark-hu-midstack-live.js
