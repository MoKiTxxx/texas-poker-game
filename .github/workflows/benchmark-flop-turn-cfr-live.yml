name: Flop+turn depth CFR second holdout

on:
  pull_request:
    branches:
      - feature/flop-depth-cfr
    paths:
      - benchmark-flop-cfr-live.js
      - zhang_family_texas_holdem_formal_v3_shuffle_below_cards.html
      - cfr/flop-depth-cfr.js
      - cfr/holdem-postflop.js
      - .github/workflows/benchmark-flop-turn-cfr-live.yml

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - stack: 12
            seed: 12091209
          - stack: 15
            seed: 15091509
          - stack: 18
            seed: 18091809
          - stack: 20
            seed: 20092009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run duplicate flop+turn CFR second holdout
        env:
          BENCH_STACK_BB: ${{ matrix.stack }}
          BENCH_PAIRS: "1000"
          BENCH_CFR_ITERATIONS: "600"
          BENCH_SEED: ${{ matrix.seed }}
        run: node benchmark-flop-cfr-live.js
